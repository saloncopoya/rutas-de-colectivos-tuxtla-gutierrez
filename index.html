<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>Colectivos TGZ Pro | Cyber-Rutas</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SDK Firebase JS v9 (Compatibilitdad) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' },
                        cyber: { dark: '#020617', panel: '#0f172a', border: '#1e293b', accent: '#38bdf8' }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .glass-panel { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border: 1px solid #1e293b; }
        .tab-active { color: #38bdf8 !important; border-bottom: 2px solid #38bdf8; }
        .no-anim * { transition: none !important; animation: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black no-anim">

    <!-- BANNER CONEXIÓN & CONFIGURACIÓN -->
    <div id="statusBanner" class="bg-slate-900 border-b border-slate-800 text-xs py-1 px-3 flex justify-between items-center text-slate-400 z-30">
        <span id="connectionState" class="flex items-center gap-2 text-[11px] font-mono">
            <span id="netStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> 
            <span id="netStatusText">MODO OFFLINE (CACHÉ LOCAL)</span>
        </span>
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-lg text-xs" title="Cambiar Tema">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <button id="pwaInstallBtnBanner" onclick="triggerPwaInstall()" class="hidden text-xs bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
                <i class="fa-solid fa-download"></i> Instalar App
            </button>
            <button onclick="toggleAdminSession()" id="adminAuthBtn" class="text-xs text-cyan-400 font-bold flex items-center gap-1 border border-cyan-500/30 px-2 py-0.5 rounded-lg bg-cyan-950/40">
                <i class="fa-solid fa-shield-halved"></i> <span id="adminBtnText">Admin</span>
            </button>
        </div>
    </div>

    <!-- ENCABEZADO TECNOLÓGICO -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0">
                    <i class="fa-solid fa-network-wired text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wider text-white uppercase flex items-center gap-2">
                        Colectivos TGZ <span class="text-[9px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-1.5 py-0.5 rounded font-mono">REALTIME + OFFLINE</span>
                    </h1>
                    <p class="text-[10px] text-slate-400">Navegación Urbana de Alta Velocidad</p>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <button id="btnAddNewRoute" onclick="openModal('adminModal')" class="hidden bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> <span>Nueva Ruta</span>
                </button>
                <button onclick="syncDataWithFirebase()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-2 rounded-lg text-xs border border-slate-700" title="Forzar Sincronización">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- NAVEGACIÓN SUPERIOR TABS -->
    <div class="max-w-7xl mx-auto w-full px-3 pt-2">
        <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
            <button onclick="switchTab('explorer')" id="top-tab-explorer" class="top-tab py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-magnifying-glass"></i> Explorador
            </button>
            <button onclick="switchTab('planner')" id="top-tab-planner" class="top-tab py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-route"></i> Planear
            </button>
            <button onclick="switchTab('map')" id="top-tab-map" class="top-tab py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-map-location-dot"></i> Visor Mapa
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto w-full px-3 py-3 flex-1 mb-16">

        <!-- VISTA 1: EXPLORADOR CON BUSCADOR Y AUTOCOMPLETADO GLOBAL -->
        <section id="view-explorer" class="tab-content space-y-3">
            
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-cyan-400 text-xs"></i>
                    <input type="text" id="searchInput" list="globalPointsDatalist" oninput="onSearchChange()" placeholder="Buscar ruta, parada, retorno o punto de interés..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500">
                </div>

                <!-- FILTROS AVANZADOS -->
                <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-800/80 pt-2 text-[11px]">
                    <div class="flex items-center gap-1 overflow-x-auto">
                        <span class="font-bold text-slate-400 mr-1"><i class="fa-solid fa-filter text-cyan-400"></i> Mostrar:</span>
                        <button onclick="setViewMode('ROUTES')" id="btnViewRoutes" class="mode-chip bg-cyan-600 text-white px-2.5 py-1 rounded font-bold">Rutas</button>
                        <button onclick="setViewMode('STOPS')" id="btnViewStops" class="mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold">Paradas</button>
                        <button onclick="setViewMode('POIS')" id="btnViewPois" class="mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold">Puntos Interés</button>
                        <button onclick="setViewMode('RETURNS')" id="btnViewReturns" class="mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold">Retornos</button>
                    </div>

                    <div class="flex items-center gap-1 overflow-x-auto">
                        <button onclick="filterCategory('ALL')" class="cat-chip bg-slate-800 text-cyan-400 px-2 py-0.5 rounded font-bold">Todas</button>
                        <button onclick="filterCategory('URBANA')" class="cat-chip bg-slate-800/60 text-slate-400 px-2 py-0.5 rounded font-bold">Urbanas</button>
                        <button onclick="filterCategory('FORANEA')" class="cat-chip bg-slate-800/60 text-slate-400 px-2 py-0.5 rounded font-bold">Foráneas</button>
                    </div>
                </div>
            </div>

            <div id="explorerResultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
        </section>

        <!-- VISTA 2: PLANIFICADOR MULTIDESTINO -->
        <section id="view-planner" class="tab-content hidden space-y-3">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5 uppercase">
                        <i class="fa-solid fa-diagram-project text-cyan-400"></i> Calculadora de Trasbordos
                    </h2>
                    <button onclick="resetPlanner()" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700">
                        <i class="fa-solid fa-trash"></i> Limpiar
                    </button>
                </div>

                <div id="destinationsContainer" class="space-y-2">
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold flex items-center justify-center shrink-0">A</span>
                        <input list="globalPointsDatalist" class="planner-input w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500" placeholder="Origen...">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold flex items-center justify-center shrink-0">B</span>
                        <input list="globalPointsDatalist" class="planner-input w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500" placeholder="Destino final...">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="addDestinationField()" class="flex-1 bg-slate-800 text-slate-300 py-1.5 rounded-lg text-xs font-semibold border border-slate-700">
                        <i class="fa-solid fa-plus text-cyan-400"></i> Escala
                    </button>
                    <button onclick="calculateMultiRoute()" class="flex-1 bg-cyan-600 text-white font-bold py-1.5 rounded-lg text-xs">
                        <i class="fa-solid fa-calculator"></i> Trazar Ruta
                    </button>
                </div>
            </div>

            <div id="plannerResults" class="space-y-3"></div>
        </section>

        <!-- VISTA 3: VISOR DE MAPAS -->
        <section id="view-map" class="tab-content hidden space-y-3">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5 uppercase">
                        <i class="fa-solid fa-map text-cyan-400"></i> Visor Geográfico
                    </h2>
                    <select id="mapRouteSelector" onchange="loadRouteMapDetails(this.value)" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-200 outline-none w-full sm:w-auto font-medium">
                    </select>
                </div>

                <div class="flex items-center gap-2 text-xs border-b border-slate-800 pb-2">
                    <button id="btnViewGmaps" onclick="toggleMapView('gmaps')" class="bg-cyan-600 text-white px-3 py-1 rounded font-bold">Google Maps</button>
                    <button id="btnViewImage" onclick="toggleMapView('image')" class="hidden bg-slate-800 text-slate-400 px-3 py-1 rounded font-bold">Plano / Imagen</button>
                </div>

                <div class="relative w-full h-[50vh] bg-slate-950 rounded-xl overflow-hidden border border-slate-800">
                    <iframe id="mainMapIframe" src="about:blank" class="w-full h-full border-0"></iframe>
                    <div id="imagePlanContainer" class="hidden w-full h-full overflow-auto flex items-center justify-center p-2 bg-slate-950">
                        <img id="routePlanImage" src="" alt="Plano de ruta" class="max-w-full max-h-full object-contain">
                    </div>
                </div>

                <div id="routeDetailCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2 pt-1"></div>
            </div>
        </section>

    </main>

    <!-- NAVEGACIÓN INFERIOR PWA -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-800 py-2 px-4 flex items-center justify-around z-40">
        <button onclick="switchTab('explorer')" id="nav-explorer" class="bottom-nav-btn tab-active flex flex-col items-center gap-0.5 text-slate-400">
            <i class="fa-solid fa-compass text-base"></i>
            <span class="text-[9px] font-bold">Explorar</span>
        </button>
        <button onclick="switchTab('planner')" id="nav-planner" class="bottom-nav-btn flex flex-col items-center gap-0.5 text-slate-400">
            <i class="fa-solid fa-route text-base"></i>
            <span class="text-[9px] font-bold">Planear</span>
        </button>
        <button onclick="switchTab('map')" id="nav-map" class="bottom-nav-btn flex flex-col items-center gap-0.5 text-slate-400">
            <i class="fa-solid fa-map-location-dot text-base"></i>
            <span class="text-[9px] font-bold">Visor</span>
        </button>
    </nav>

    <!-- DATALISTS DE AUTOCOMPLETADO GLOBAL Y POR CAMPOS -->
    <datalist id="globalPointsDatalist"></datalist>
    <datalist id="routesNamesDatalist"></datalist>
    <datalist id="stopsDatalist"></datalist>
    <datalist id="returnsDatalist"></datalist>
    <datalist id="poisUrbanDatalist"></datalist>
    <datalist id="poisForeignDatalist"></datalist>

    <!-- MODAL ADMINISTRADOR REFACTORIZADO CON CLOUDINARY Y BASE64 -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 hidden">
        <div class="bg-slate-900 w-full max-w-xl rounded-xl border border-slate-800 shadow-2xl flex flex-col max-h-[92vh]">
            <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h3 class="font-bold text-xs text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-cyan-400"></i> Registrar / Editar Ruta en la Nube
                </h3>
                <button onclick="closeModal('adminModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>

            <form id="addRouteForm" onsubmit="handleRouteSubmit(event)" class="p-3 overflow-y-auto space-y-3 flex-1 text-xs">
                <input type="hidden" id="editRouteId" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300">Nombre de la Ruta *</label>
                        <input type="text" id="routeName" list="routesNamesDatalist" required placeholder="Ej. Línea Nandalumi" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500">
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300">Categoría *</label>
                        <select id="routeCategory" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500">
                            <option value="URBANA">Urbana (Tuxtla)</option>
                            <option value="FORANEA">Foránea (Chiapa de Corzo / Otras)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="font-bold text-slate-300">URL / Iframe Google Maps *</label>
                    <input type="text" id="routeMapUrl" required placeholder="https://www.google.com/maps/d/embed?mid=..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500 font-mono text-[11px]">
                </div>

                <!-- SUBIDA DE IMÁGENES DUAL: CLOUDINARY + BASE64 -->
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 space-y-2">
                    <label class="font-bold text-cyan-400 block"><i class="fa-solid fa-image"></i> Gestión de Plano / Imagen</label>
                    
                    <input type="text" id="routeImageUrl" placeholder="URL directa de la imagen..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500 font-mono text-[11px]">
                    
                    <div class="flex items-center gap-2">
                        <label class="flex-1 text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg cursor-pointer text-center border border-slate-700">
                            <i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> Subir a Cloudinary (Servidor)
                            <input type="file" id="routeImageFileCloudinary" accept="image/*" onchange="uploadToCloudinary(this)" class="hidden">
                        </label>
                        <label class="flex-1 text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg cursor-pointer text-center border border-slate-700">
                            <i class="fa-solid fa-code text-cyan-400"></i> Modos Código Base64 (Local)
                            <input type="file" id="routeImageFileBase64" accept="image/*" onchange="convertImageToBase64(this)" class="hidden">
                        </label>
                    </div>
                    <span id="uploadStatus" class="text-[10px] text-slate-400 block font-mono"></span>
                </div>

                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 space-y-2">
                    <span class="text-[10px] font-bold text-cyan-400 uppercase block"><i class="fa-solid fa-list-check"></i> Datos con Autocompletado</span>
                    
                    <div class="space-y-1">
                        <label class="text-[10px] font-semibold text-slate-400">Paradas Clave</label>
                        <input type="text" id="routeStops" list="stopsDatalist" placeholder="Seleccionar o escribir..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[10px] font-semibold text-slate-400">Retornos</label>
                        <input type="text" id="routeReturnStops" list="returnsDatalist" placeholder="Seleccionar o escribir..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div class="space-y-1">
                            <label class="text-[10px] font-semibold text-slate-400">POIs Urbanos (Uno por línea)</label>
                            <input type="text" id="routePoisUrbanInput" list="poisUrbanDatalist" placeholder="Autocompletar..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500">
                            <textarea id="routePoisUrban" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500 text-[11px]"></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-semibold text-slate-400">POIs Foráneos (Uno por línea)</label>
                            <input type="text" id="routePoisForeignInput" list="poisForeignDatalist" placeholder="Autocompletar..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500">
                            <textarea id="routePoisForeign" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500 text-[11px]"></textarea>
                        </div>
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2 border-t border-slate-800">
                    <button type="button" onclick="closeModal('adminModal')" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg font-bold">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold">Guardar en Firebase</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FIREBASE Y CLOUDINARY
        const firebaseConfig = {
            apiKey: "AIzaSyASox7mRak5V0py29htEVWCVeipGpA0yfs",
            authDomain: "galloslivebadge.firebaseapp.com",
            databaseURL: "https://galloslivebadge-default-rtdb.firebaseio.com",
            projectId: "galloslivebadge",
            storageBucket: "galloslivebadge.firebasestorage.app",
            messagingSenderId: "979482928760",
            appId: "1:979482928760:web:3ea879dc4ee1e020df6f8d",
            measurementId: "G-8L3Z484S3D"
        };

        const CLOUDINARY_CONFIG = {
            cloudName: 'davovja1g',
            unsignedPreset: 'sinfirmaupload'
        };

        // INICIALIZACIÓN DE FIREBASE
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const routesRef = db.ref('rutas_colectivos_tgz');

        // DATOS PREDETERMINADOS (RESPALDO LOCAL)
        const DEFAULT_ROUTES = [
            {
                id: "route-nandalumi",
                name: "Línea Nandalumi (TGZ - Chiapa de Corzo)",
                category: "FORANEA",
                mapUrl: "https://www.google.com/maps/d/embed?mid=14GyzP6h6GlBTfddc3BLA6YE-dlBonmM&ehbc=2E312F",
                imageUrl: "",
                stops: ["Parada línea Nandalumi: 2a Oriente Sur y 10a Sur Oriente"],
                returnStops: ["Plaza de Armas Chiapa de Corzo", "Central de Abastos", "2a Ote Sur"],
                poisUrban: [
                    "Plaza del Mariachi Santa Cecilia", "Panteón Municipal", "Mercado de los Ancianos",
                    "Terminal Autobuses Aexa", "Colonia Bienestar Social", "Diana Cazadora Tuxtla",
                    "Plaza Polifórum / Polyforum", "ISSTECH - Hospital de Especialidades Vida Mejor",
                    "Plaza Ámbar Fashion Mall", "Parque Chiapasiónate", "Central de Abastos - Tuxtla Gutiérrez",
                    "Escuela Preparatoria Número 5", "Escuela Superior de Trabajo Social Jesús Aquino Juan"
                ],
                poisForeign: [
                    "Ribera Cahuaré", "Ribera Nandambua", "Plaza de Armas Ángel Albino Corzo", "Centro Chiapa de Corzo"
                ]
            }
        ];

        let routesData = [];
        let currentCategory = 'ALL';
        let currentViewMode = 'ROUTES';
        let selectedPointFilter = null;
        let isAdminLoggedIn = false;
        let deferredPrompt = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadRoutesFromLocalStorage();
            initFirebaseRealtimeSync();
            setupPwaAndNetworkEvents();
            setupFormInputSync();
            renderExplorerView();
            updateMapSelector();
            switchTab('explorer');
        });

        // REGLAS CACHÉ FIRST & SINCRONIZACIÓN FIREBASE
        function loadRoutesFromLocalStorage() {
            const saved = localStorage.getItem('tgz_routes_pro_cache');
            if (saved) {
                try { routesData = JSON.parse(saved); } catch (e) { routesData = DEFAULT_ROUTES; }
            } else {
                routesData = DEFAULT_ROUTES;
                saveRoutesToLocalStorage();
            }
            updateAllDatalists();
        }

        function saveRoutesToLocalStorage() {
            localStorage.setItem('tgz_routes_pro_cache', JSON.stringify(routesData));
            updateAllDatalists();
        }

        function initFirebaseRealtimeSync() {
            routesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    routesData = Array.isArray(data) ? data : Object.values(data);
                    saveRoutesToLocalStorage();
                    renderExplorerView();
                    updateMapSelector();
                    updateNetworkState(true, 'REALTIME ACTIVO');

                console.warn('Modo Offline: Operando con caché local.', error);

            });

        // SUBIDA A CLOUDINARY & BASE64
        function uploadToCloudinary(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const status = document.getElementById('uploadStatus');
            status.innerText = 'Subiendo imagen a Cloudinary...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_CONFIG.unsignedPreset);

            fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.secure_url) {
                    document.getElementById('routeImageUrl').value = data.secure_url;
                    status.innerText = '✓ Imagen cargada con éxito en Cloudinary.';
                } else {
                    throw new Error('Error en respuesta de Cloudinary');
                }
            })
            .catch(err => {
                status.innerText = 'Error al subir. Intenta en formato Base64 (Local).';
                console.error(err);
            });
        }

        function convertImageToBase64(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => { 
                    document.getElementById('routeImageUrl').value = e.target.result;
                    document.getElementById('uploadStatus').innerText = '✓ Convertido a código Base64.';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateAllDatalists() {
            const routeNames = new Set();
            const stops = new Set();
            const returns = new Set();
            const poisUrb = new Set();
            const poisFor = new Set();
            const global = new Set();

            routesData.forEach(r => {
                routeNames.add(r.name);
                (r.stops || []).forEach(p => { stops.add(p); global.add(p); });
                (r.returnStops || []).forEach(p => { returns.add(p); global.add(p); });
                (r.poisUrban || []).forEach(p => { poisUrb.add(p); global.add(p); });
                (r.poisForeign || []).forEach(p => { poisFor.add(p); global.add(p); });
            });

            fillDatalist('globalPointsDatalist', Array.from(global));
            fillDatalist('routesNamesDatalist', Array.from(routeNames));
            fillDatalist('stopsDatalist', Array.from(stops));
            fillDatalist('returnsDatalist', Array.from(returns));
            fillDatalist('poisUrbanDatalist', Array.from(poisUrb));
            fillDatalist('poisForeignDatalist', Array.from(poisFor));
        }

        function renderExplorerView() {
            const container = document.getElementById('explorerResultsContainer');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            if (selectedPointFilter) {
                const matchingRoutes = routesData.filter(r => {
                    const allPois = [...(r.stops || []), ...(r.returnStops || []), ...(r.poisUrban || []), ...(r.poisForeign || [])];
                    return allPois.includes(selectedPointFilter);
                });

                container.innerHTML = `
                    <div class="col-span-full bg-slate-900 p-3 rounded-xl border border-cyan-500/40 flex justify-between items-center text-xs">
                        <span>Filtrando por punto: <b class="text-cyan-400">${escapeHtml(selectedPointFilter)}</b></span>
                        <button onclick="selectedPointFilter=null; renderExplorerView()" class="bg-slate-800 text-slate-300 px-2 py-1 rounded">Ver Todo</button>
                    </div>
                    ${renderRoutesCardsHtml(matchingRoutes)}
                `;
                return;
            }

            if (currentViewMode === 'ROUTES') {
                const filtered = routesData.filter(r => {
                    const matchCat = (currentCategory === 'ALL') || (r.category === currentCategory);
                    const allPois = [...(r.poisUrban || []), ...(r.poisForeign || []), ...(r.stops || []), ...(r.returnStops || [])].join(' ').toLowerCase();
                    return matchCat && (r.name.toLowerCase().includes(query) || allPois.includes(query));
                });
                container.innerHTML = renderRoutesCardsHtml(filtered);
            } else {
                let itemsSet = new Set();
                routesData.forEach(r => {
                    if (currentCategory === 'ALL' || r.category === currentCategory) {
                        let target = [];
                        if (currentViewMode === 'STOPS') target = r.stops || [];
                        if (currentViewMode === 'POIS') target = [...(r.poisUrban || []), ...(r.poisForeign || [])];
                        if (currentViewMode === 'RETURNS') target = r.returnStops || [];
                        target.forEach(p => itemsSet.add(p));
                    }
                });

                const filteredItems = Array.from(itemsSet).filter(item => item.toLowerCase().includes(query)).sort();

                if (filteredItems.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs">Sin registros.</div>`;
                    return;
                }

                container.innerHTML = filteredItems.map(item => {
                    const count = routesData.filter(r => [...(r.stops || []), ...(r.returnStops || []), ...(r.poisUrban || []), ...(r.poisForeign || [])].includes(item)).length;
                    return `
                        <div onclick="filterBySelectedPoint('${escapeHtml(item)}')" class="bg-slate-900 border border-slate-800 p-3 rounded-xl cursor-pointer flex justify-between items-center text-xs">
                            <span class="font-bold text-slate-200"><i class="fa-solid fa-location-dot text-cyan-400 mr-1.5"></i> ${escapeHtml(item)}</span>
                            <span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded text-[10px] font-bold">${count} Ruta(s)</span>
                        </div>
                    `;
                }).join('');
            }
        }

        function calculateMultiRoute() {
            const inputs = document.getElementsByClassName('planner-input');
            const points = [];
            for (let inp of inputs) if (inp.value.trim()) points.push(inp.value.trim());

            if (points.length < 2) {
                Swal.fire('Atención', 'Ingresa origen y destino.', 'warning');
                return;
            }

            const resultsContainer = document.getElementById('plannerResults');
            resultsContainer.innerHTML = '';

            for (let i = 0; i < points.length - 1; i++) {
                const origin = points[i];
                const dest = points[i + 1];

                const directRoutes = routesData.filter(r => {
                    const pois = [...(r.poisUrban || []), ...(r.poisForeign || []), ...(r.stops || []), ...(r.returnStops || [])];
                    return pois.includes(origin) && pois.includes(dest);
                });

                let sectionHtml = `<div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <h3 class="font-bold text-slate-300">Tramo ${i+1}: <span class="text-emerald-400">${escapeHtml(origin)}</span> $\\to$ <span class="text-rose-400">${escapeHtml(dest)}</span></h3>`;

                if (directRoutes.length > 0) {
                    sectionHtml += `
                        <div class="bg-emerald-500/10 border border-emerald-500/30 p-2.5 rounded-lg space-y-1.5">
                            <span class="text-[10px] font-bold text-emerald-400 block"><i class="fa-solid fa-check-circle"></i> VÍA DIRECTA</span>
                            ${directRoutes.map(r => `
                                <div class="bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center">
                                    <span class="font-bold text-white">${escapeHtml(r.name)}</span>
                                    <button onclick="viewRouteOnMap('${r.id}')" class="bg-cyan-600 text-white px-2 py-0.5 rounded text-[10px]">Mapa</button>
                                </div>
                            `).join('')}
                        </div>`;
                } else {
                    sectionHtml += `<div class="text-[11px] text-amber-400 bg-amber-500/10 p-2 rounded border border-amber-500/20">Requiere trasbordo o conexión alternativa.</div>`;
                }
                sectionHtml += `</div>`;
                resultsContainer.innerHTML += sectionHtml;
            }
        }

        // UTILIDADES
        function sanitizeMapUrl(raw) {
            if (!raw) return 'about:blank';
            if (raw.includes('<iframe')) {
                const match = raw.match(/src=["']([^"']+)["']/);
                if (match && match[1]) return match[1];
            }
            return raw.trim();
        }

        function splitLines(str) {
            return str ? str.split(/[\n,]+/).map(s => s.trim()).filter(Boolean) : [];
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '';
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden'); 
            document.getElementById('addRouteForm').reset();
            document.getElementById('editRouteId').value = '';
            document.getElementById('uploadStatus').innerText = '';
        }
    </script>
</body>
</html>
