<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="./manifest.json">
    <title>Colectivos TGZ Pro | Sistema Integral</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SDK Firebase JS v9 (Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' },
                        cyber: { dark: '#020617', panel: '#0f172a', border: '#1e293b', accent: '#38bdf8' }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

        html { font-size: 18px; }
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        html:not(.dark) body { 
            background-color: #f1f5f9; 
            color: #0f172a; 
        }

        html:not(.dark) .bg-slate-900 { background-color: #ffffff !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        html:not(.dark) .bg-slate-950 { background-color: #f8fafc !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        html:not(.dark) .bg-slate-800 { background-color: #e2e8f0 !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        html:not(.dark) .text-white { color: #0f172a !important; }
        html:not(.dark) .text-slate-400 { color: #475569 !important; }
        html:not(.dark) .text-slate-300 { color: #334155 !important; }
        html:not(.dark) .border-slate-800 { border-color: #cbd5e1 !important; }
        html:not(.dark) #bottomNav { background-color: #ffffff !important; border-color: #cbd5e1 !important; }
        html:not(.dark) .bg-slate-950\/90 { background-color: rgba(255,255,255,0.95) !important; }
        html:not(.dark) .bg-slate-950\/40 { background-color: rgba(241,245,249,0.8) !important; }

        .tab-active { color: #06b6d4 !important; border-bottom: 2px solid #06b6d4; }
        .map-wrapper { transition: transform 0.2s ease-in-out; transform-origin: center center; }

        /* Estilos para publicaciones */
        .post-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .post-card:hover {
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 8px 32px rgba(6, 182, 212, 0.1);
        }
        .post-card.highlighted {
            border-color: #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }

        html:not(.dark) .post-card {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(203, 213, 225, 0.5);
        }
        html:not(.dark) .post-card.highlighted {
            border-color: #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
        }

        .post-media {
            border-radius: 16px;
            overflow: hidden;
            max-height: 500px;
            width: 100%;
            object-fit: cover;
        }

        /* Comentarios flotantes estilo TikTok */
        .comments-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 70vh;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            border-top: 1px solid rgba(30, 41, 59, 0.5);
            padding: 20px;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            overflow-y: auto;
        }
        .comments-panel.open {
            transform: translateY(0);
        }
        .comments-panel .handle {
            width: 40px;
            height: 4px;
            background: rgba(148, 163, 184, 0.3);
            border-radius: 2px;
            margin: 0 auto 12px;
            cursor: grab;
        }
        html:not(.dark) .comments-panel {
            background: rgba(255, 255, 255, 0.98);
            border-color: rgba(203, 213, 225, 0.5);
        }

        /* Marketplace */
        .market-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(30, 41, 59, 0.5);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .market-card:hover {
            transform: translateY(-4px);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 12px 40px rgba(6, 182, 212, 0.15);
        }
        .market-card.highlighted {
            border-color: #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }
        .market-card img, .market-card video {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        html:not(.dark) .market-card {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(203, 213, 225, 0.5);
        }

        /* Botones grandes para adultos mayores */
        .btn-lg {
            padding: 14px 24px;
            font-size: 1.1rem;
            border-radius: 16px;
            min-height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
        }

        .input-lg {
            padding: 16px 20px;
            font-size: 1.05rem;
            border-radius: 16px;
            min-height: 56px;
            border: 2px solid rgba(30, 41, 59, 0.5);
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-lg:focus {
            border-color: #06b6d4;
        }
        html:not(.dark) .input-lg {
            background: rgba(255, 255, 255, 0.8);
            color: #0f172a;
            border-color: rgba(203, 213, 225, 0.5);
        }

        /* Navegación inferior mejorada */
        #bottomNav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(30, 41, 59, 0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }
        .bottom-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s;
            min-width: 64px;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .bottom-nav-btn i {
            font-size: 1.4rem;
        }
        .bottom-nav-btn.tab-active {
            color: #06b6d4;
            background: rgba(6, 182, 212, 0.1);
        }
        .bottom-nav-btn:hover {
            color: #f8fafc;
        }

        html:not(.dark) #bottomNav {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(203, 213, 225, 0.5);
        }

        /* Pestañas superiores */
        .top-tab {
            padding: 12px 8px;
            font-size: 0.85rem;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 48px;
        }
        .top-tab.active {
            background: rgba(6, 182, 212, 0.15);
            color: #06b6d4;
        }
        .top-tab:hover {
            color: #f8fafc;
        }

        /* Filtros */
        .filter-chip {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 2px solid rgba(30, 41, 59, 0.3);
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 44px;
        }
        .filter-chip.active {
            background: rgba(6, 182, 212, 0.15);
            border-color: #06b6d4;
            color: #06b6d4;
        }
        .filter-chip:hover {
            border-color: #06b6d4;
            color: #f8fafc;
        }

        /* Responsive */
        @media (max-width: 640px) {
            html { font-size: 16px; }
            .post-card { padding: 16px; }
            .market-card img, .market-card video { height: 160px; }
            .btn-lg { padding: 12px 18px; font-size: 1rem; min-height: 48px; }
            .input-lg { padding: 14px 16px; font-size: 0.95rem; min-height: 48px; }
            .bottom-nav-btn { padding: 6px 10px; min-width: 48px; }
            .bottom-nav-btn i { font-size: 1.2rem; }
        }

        /* Animaciones */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
            50% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.4); }
        }
        .highlighted {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        /* Scrollbar para comentarios */
        .comments-panel::-webkit-scrollbar { width: 4px; }
        .comments-panel::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 2px; }

        .hidden-iframe {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div id="statusBanner" class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800 text-xs py-2 px-4 flex flex-wrap items-center justify-between gap-2 z-30 sticky top-0">
        <span id="connectionState" class="flex items-center gap-2 text-[11px] font-mono">
            <span id="netStatusDot" class="w-3 h-3 rounded-full bg-emerald-400"></span> 
            <span id="netStatusText">MODO OFFLINE (CACHÉ LOCAL)</span>
        </span>
        <div class="flex items-center gap-2 flex-wrap">
            <button id="btnInstallPwa" onclick="installPWA()" class="hidden btn-lg bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold border border-cyan-500 shadow-lg animate-pulse" style="padding:6px 14px; min-height:36px; font-size:0.75rem;">
                <i class="fa-solid fa-download"></i> Instalar App
            </button>
            <button onclick="toggleTheme()" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl text-base" title="Cambiar Tema">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <button onclick="toggleAdminSession()" id="adminAuthBtn" class="text-xs font-bold flex items-center gap-1.5 border border-cyan-500/30 px-3 py-1.5 rounded-xl bg-cyan-950/40 text-cyan-400">
                <i class="fa-solid fa-shield-halved"></i> <span id="adminBtnText">Admin</span>
            </button>
        </div>
    </div>

    <!-- ENCABEZADO -->
    <header class="bg-slate-900/80 backdrop-blur-sm border-b border-slate-800 px-4 py-3 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0 text-2xl">
                    <i class="fa-solid fa-bus"></i>
                </div>
                <div>
                    <h1 class="text-base font-black tracking-wider text-white uppercase flex items-center gap-2">
                        Colectivos TGZ <span class="text-[10px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-2 py-0.5 rounded font-mono">FULL SYSTEM</span>
                    </h1>
                    <p class="text-[11px] text-slate-400">Gestión de Rutas, Publicaciones y Marketplace</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btnAddPost" onclick="openPostWizard()" class="hidden btn-lg bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold px-4 py-2" style="min-height:40px;">
                    <i class="fa-solid fa-plus"></i> Publicar
                </button>
                <button id="btnAddMarket" onclick="openMarketWizard()" class="hidden btn-lg bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold px-4 py-2" style="min-height:40px;">
                    <i class="fa-solid fa-store"></i> Vender
                </button>
            </div>
        </div>
    </header>

    <!-- PESTAÑAS SUPERIORES -->
    <div class="max-w-7xl mx-auto w-full px-3 pt-3">
        <div class="grid grid-cols-3 gap-2 bg-slate-900/50 p-1.5 rounded-2xl border border-slate-800 text-sm font-bold">
            <button onclick="switchTab('feed')" id="top-tab-feed" class="top-tab active flex items-center justify-center gap-2">
                <i class="fa-solid fa-house text-base"></i> INICIO
            </button>
            <button onclick="switchTab('routes')" id="top-tab-routes" class="top-tab flex items-center justify-center gap-2">
                <i class="fa-solid fa-route text-base"></i> RUTAS
            </button>
            <button onclick="switchTab('market')" id="top-tab-market" class="top-tab flex items-center justify-center gap-2">
                <i class="fa-solid fa-store text-base"></i> MARKET
            </button>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto w-full px-3 py-4 flex-1">

        <!-- VISTA 1: FEED PUBLICACIONES -->
        <section id="view-feed" class="tab-content space-y-4">
            <div id="feedContainer" class="space-y-4 max-w-2xl mx-auto"></div>
        </section>

        <!-- VISTA 2: RUTAS Y TRASBORDOS -->
        <section id="view-routes" class="tab-content hidden space-y-4">
            <!-- Buscadores duales -->
            <div class="bg-slate-900/50 backdrop-blur-sm p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-cyan-400 mb-1.5"><i class="fa-solid fa-location-dot"></i> Estoy en:</label>
                        <input type="text" id="routeOrigin" list="globalPointsDatalist" 
                            placeholder="Calle, parada o punto de referencia..." 
                            class="input-lg" oninput="onRouteSearchChange()">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-emerald-400 mb-1.5"><i class="fa-solid fa-flag-checkered"></i> Quiero ir a:</label>
                        <input type="text" id="routeDestination" list="globalPointsDatalist" 
                            placeholder="Destino, calle o punto..." 
                            class="input-lg" oninput="onRouteSearchChange()">
                    </div>
                </div>
                <button onclick="calculateConnections()" class="btn-lg w-full bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl">
                    <i class="fa-solid fa-route"></i> Calcular Conexiones
                </button>
            </div>

            <!-- Filtros de visualización -->
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-sm font-bold text-slate-400 mr-1"><i class="fa-solid fa-filter text-cyan-400"></i> Ver:</span>
                <button onclick="setRouteView('ROUTES')" id="rv-routes" class="filter-chip active">Rutas</button>
                <button onclick="setRouteView('STOPS')" id="rv-stops" class="filter-chip">Paradas</button>
                <button onclick="setRouteView('POIS')" id="rv-pois" class="filter-chip">Puntos de Interés</button>
                <button onclick="setRouteView('RETURNS')" id="rv-returns" class="filter-chip">Retornos</button>
            </div>

            <!-- Contenedor de resultados de rutas -->
            <div id="routesResultsContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>

            <!-- Contenedor de resultados de conexiones -->
            <div id="connectionsContainer" class="space-y-3 hidden"></div>
        </section>

        <!-- VISTA 3: MARKETPLACE -->
        <section id="view-market" class="tab-content hidden space-y-4">
            <!-- Filtros marketplace -->
            <div class="bg-slate-900/50 backdrop-blur-sm p-4 rounded-2xl border border-slate-800 space-y-3">
                <div class="flex flex-wrap gap-2 items-center">
                    <span class="text-sm font-bold text-slate-400 mr-1">Categoría:</span>
                    <button onclick="filterMarket('ALL')" id="mk-all" class="filter-chip active">Todos</button>
                    <button onclick="filterMarket('AUTO')" id="mk-auto" class="filter-chip">🚗 Autos</button>
                    <button onclick="filterMarket('TERRENO')" id="mk-terreno" class="filter-chip">🏞️ Terrenos</button>
                    <button onclick="filterMarket('CASA')" id="mk-casa" class="filter-chip">🏠 Casas</button>
                    <button onclick="filterMarket('SERVICIO')" id="mk-servicio" class="filter-chip">🔧 Servicios</button>
                    <button onclick="filterMarket('OTRO')" id="mk-otro" class="filter-chip">📦 Otro</button>
                </div>
                <div class="flex flex-wrap gap-3 items-center">
                    <div class="flex-1 min-w-[150px]">
                        <label class="text-xs font-bold text-slate-400">Precio mínimo</label>
                        <input type="number" id="priceMin" class="input-lg" style="min-height:44px; padding:10px 14px;" placeholder="$0" oninput="filterMarketPrices()">
                    </div>
                    <div class="flex-1 min-w-[150px]">
                        <label class="text-xs font-bold text-slate-400">Precio máximo</label>
                        <input type="number" id="priceMax" class="input-lg" style="min-height:44px; padding:10px 14px;" placeholder="$999,999" oninput="filterMarketPrices()">
                    </div>
                    <button onclick="filterMarketPrices()" class="btn-lg bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl" style="min-height:44px; padding:10px 20px; font-size:0.9rem;">
                        <i class="fa-solid fa-magnifying-glass"></i> Filtrar
                    </button>
                </div>
            </div>

            <!-- Grid marketplace -->
            <div id="marketContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </section>

    </main>

    <!-- BARRA INFERIOR -->
    <nav id="bottomNav">
        <button onclick="switchTab('feed')" id="nav-feed" class="bottom-nav-btn tab-active">
            <i class="fa-solid fa-house"></i>
            <span>INICIO</span>
        </button>
        <button onclick="switchTab('routes')" id="nav-routes" class="bottom-nav-btn">
            <i class="fa-solid fa-route"></i>
            <span>RUTAS</span>
        </button>
        <button onclick="switchTab('market')" id="nav-market" class="bottom-nav-btn">
            <i class="fa-solid fa-store"></i>
            <span>MARKET</span>
        </button>
    </nav>

    <!-- DATALIST GLOBAL -->
    <datalist id="globalPointsDatalist"></datalist>

    <!-- MODAL RUTA COMPLETA -->
    <div id="routeDetailModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex items-center justify-center p-2 hidden">
        <div class="bg-slate-900 w-full max-w-6xl max-h-[95vh] rounded-2xl border border-slate-800 flex flex-col overflow-hidden shadow-2xl">
            <div class="px-4 py-3 bg-slate-950 border-b border-slate-800 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-lg">
                        <i class="fa-solid fa-bus"></i>
                    </div>
                    <div>
                        <h3 id="modalRouteTitle" class="text-base font-black text-white">Nombre de Ruta</h3>
                        <p id="modalRouteCategory" class="text-xs text-cyan-400 font-bold uppercase">Categoría</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="shareRoute()" class="p-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl text-sm">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <button onclick="closeModal('routeDetailModal')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xl">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="w-full h-[50vh] min-h-[300px] bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
                    <iframe id="modalMapIframe" src="about:blank" class="w-full h-[calc(100%+52px)] -mt-[52px] border-0"></iframe>
                </div>
                <div id="modalRouteInfoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-sm"></div>
                <div id="modalRouteStreets" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm"></div>
                <div id="modalRouteMatches" class="bg-slate-950 p-3 rounded-xl border border-slate-800 text-sm"></div>
            </div>
        </div>
    </div>

    <!-- PANEL DE COMENTARIOS FLOTANTE -->
    <div id="commentsPanel" class="comments-panel">
        <div class="handle" onclick="toggleCommentsPanel()"></div>
        <div id="commentsContent" class="space-y-3 max-h-[50vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <h4 class="text-base font-bold text-white">Comentarios</h4>
                <button onclick="toggleCommentsPanel()" class="p-2 bg-slate-800 rounded-xl text-slate-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="commentsList" class="space-y-3"></div>
            <div class="flex gap-2 mt-3">
                <input type="text" id="commentInput" placeholder="Escribe un comentario..." class="input-lg flex-1" style="min-height:48px; padding:12px 16px; font-size:0.95rem;">
                <button onclick="addComment()" class="btn-lg bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl" style="min-height:48px; padding:12px 20px;">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- WIZARD PUBLICACIONES -->
    <div id="postWizardModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col hidden">
        <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center shrink-0">
            <h3 class="font-bold text-base text-white"><i class="fa-solid fa-pen-to-square text-cyan-400 mr-2"></i>Nueva Publicación</h3>
            <button onclick="closeModal('postWizardModal')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="postForm" onsubmit="handlePostSubmit(event)" class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full flex flex-col justify-between">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1.5">Contenido *</label>
                    <textarea id="postContent" required rows="4" placeholder="¿Qué quieres compartir?" class="input-lg" style="min-height:100px;"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1.5">Imagen / Video (opcional)</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="postMediaUrl" placeholder="URL de imagen o video..." class="input-lg flex-1" style="min-height:48px; padding:12px 16px;">
                        <label class="btn-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl cursor-pointer" style="min-height:48px; padding:12px 20px;">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Subir
                            <input type="file" id="postFileInput" accept="image/*,video/*" class="hidden" onchange="uploadPostMedia(this)">
                        </label>
                    </div>
                </div>
            </div>
            <div class="pt-4 border-t border-slate-800 flex justify-end gap-3 mt-4">
                <button type="button" onclick="closeModal('postWizardModal')" class="btn-lg bg-slate-800 text-slate-400 rounded-xl">Cancelar</button>
                <button type="submit" class="btn-lg bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl">
                    <i class="fa-solid fa-check"></i> Publicar
                </button>
            </div>
        </form>
    </div>

    <!-- WIZARD MARKETPLACE -->
    <div id="marketWizardModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col hidden">
        <div class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center shrink-0">
            <h3 class="font-bold text-base text-white"><i class="fa-solid fa-store text-emerald-400 mr-2"></i>Nuevo Producto</h3>
            <button onclick="closeModal('marketWizardModal')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="marketForm" onsubmit="handleMarketSubmit(event)" class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full flex flex-col justify-between">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1.5">Título *</label>
                    <input type="text" id="marketTitle" required placeholder="Ej. Vendo auto, Terreno en..." class="input-lg">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-1.5">Categoría *</label>
                        <select id="marketCategory" required class="input-lg">
                            <option value="AUTO">🚗 Auto</option>
                            <option value="TERRENO">🏞️ Terreno</option>
                            <option value="CASA">🏠 Casa / Renta</option>
                            <option value="SERVICIO">🔧 Servicio</option>
                            <option value="OTRO">📦 Otro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-1.5">Precio *</label>
                        <input type="text" id="marketPrice" required placeholder="$0.00" class="input-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1.5">WhatsApp *</label>
                    <input type="text" id="marketWhatsapp" required placeholder="52 961 123 4567" class="input-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1.5">Descripción *</label>
                    <textarea id="marketDescription" required rows="4" placeholder="Detalles del producto..." class="input-lg" style="min-height:100px;"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1.5">Imagen / Video (opcional)</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="marketMediaUrl" placeholder="URL de imagen o video..." class="input-lg flex-1" style="min-height:48px; padding:12px 16px;">
                        <label class="btn-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl cursor-pointer" style="min-height:48px; padding:12px 20px;">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Subir
                            <input type="file" id="marketFileInput" accept="image/*,video/*" class="hidden" onchange="uploadMarketMedia(this)">
                        </label>
                    </div>
                </div>
            </div>
            <div class="pt-4 border-t border-slate-800 flex justify-end gap-3 mt-4">
                <button type="button" onclick="closeModal('marketWizardModal')" class="btn-lg bg-slate-800 text-slate-400 rounded-xl">Cancelar</button>
                <button type="submit" class="btn-lg bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl">
                    <i class="fa-solid fa-check"></i> Publicar
                </button>
            </div>
        </form>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        // ============================================================
        // CONFIGURACIÓN FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyASox7mRak5V0py29htEVWCVeipGpA0yfs",
            authDomain: "galloslivebadge.firebaseapp.com",
            databaseURL: "https://galloslivebadge-default-rtdb.firebaseio.com",
            projectId: "galloslivebadge",
            storageBucket: "galloslivebadge.firebasestorage.app",
            messagingSenderId: "979482928760",
            appId: "1:979482928760:web:3ea879dc4ee1e020df6f8d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const routesRef = db.ref('rutas_colectivos_tgz');
        const postsRef = db.ref('publicaciones');
        const marketRef = db.ref('marketplace');

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let routesData = [];
        let postsData = [];
        let marketData = [];
        let isAdminLoggedIn = false;
        let currentRouteView = 'ROUTES';
        let currentMarketCategory = 'ALL';
        let currentPostId = null;
        let currentCommentsPostId = null;
        let mapZoomLevel = 1;
        let deferredPrompt = null;
        let userId = localStorage.getItem('tgz_user_id') || 'user_' + Date.now();
        let userName = localStorage.getItem('tgz_user_name') || 'Anónimo';
        if (!localStorage.getItem('tgz_user_name')) {
            const names = ['Viajero', 'Explorador', 'Caminante', 'Paseante', 'Turista', 'Local'];
            userName = names[Math.floor(Math.random() * names.length)] + '_' + Math.floor(Math.random() * 1000);
            localStorage.setItem('tgz_user_name', userName);
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadLocalData();
            initFirebaseSync();
            renderFeed();
            renderRoutes();
            renderMarket();
            updateDatalists();
            switchTab('feed');
            handleUrlParams();
        });

        // ============================================================
        // TEMA
        // ============================================================
        function initTheme() {
            const saved = localStorage.getItem('tgz_theme') || 'dark';
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('tgz_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        // ============================================================
        // ALMACENAMIENTO LOCAL
        // ============================================================
        function loadLocalData() {
            try {
                const r = localStorage.getItem('tgz_routes_cache');
                if (r) routesData = JSON.parse(r);
                const p = localStorage.getItem('tgz_posts_cache');
                if (p) postsData = JSON.parse(p);
                const m = localStorage.getItem('tgz_market_cache');
                if (m) marketData = JSON.parse(m);
            } catch (e) { /* ignore */ }
        }

        function saveLocalData() {
            localStorage.setItem('tgz_routes_cache', JSON.stringify(routesData));
            localStorage.setItem('tgz_posts_cache', JSON.stringify(postsData));
            localStorage.setItem('tgz_market_cache', JSON.stringify(marketData));
        }

        // ============================================================
        // FIREBASE SYNC
        // ============================================================
        function initFirebaseSync() {
            // Rutas
            routesRef.on('value', (snap) => {
                const data = snap.val();
                if (data) routesData = Array.isArray(data) ? data : Object.values(data);
                saveLocalData();
                renderRoutes();
                updateDatalists();
                updateNetworkState(true, 'EN LÍNEA');
            }, () => updateNetworkState(false, 'MODO OFFLINE'));

            // Publicaciones
            postsRef.on('value', (snap) => {
                const data = snap.val();
                if (data) postsData = Array.isArray(data) ? data : Object.values(data);
                postsData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                saveLocalData();
                renderFeed();
                updateNetworkState(true, 'EN LÍNEA');
            });

            // Marketplace
            marketRef.on('value', (snap) => {
                const data = snap.val();
                if (data) marketData = Array.isArray(data) ? data : Object.values(data);
                marketData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                saveLocalData();
                renderMarket();
                updateNetworkState(true, 'EN LÍNEA');
            });
        }

        function syncToFirebase() {
            if (!navigator.onLine) {
                Swal.fire('Sin conexión', 'Los datos se guardarán localmente y se sincronizarán al recuperar conexión.', 'info');
                return;
            }
            routesRef.set(routesData).catch(() => {});
            postsRef.set(postsData).catch(() => {});
            marketRef.set(marketData).catch(() => {});
            Swal.fire({ icon: 'success', title: 'Sincronizado', timer: 1000, showConfirmButton: false });
        }

        function updateNetworkState(isOnline, text) {
            const dot = document.getElementById('netStatusDot');
            const txt = document.getElementById('netStatusText');
            dot.className = `w-3 h-3 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-amber-400'}`;
            txt.innerText = text || (isOnline ? 'EN LÍNEA' : 'MODO OFFLINE');
        }

        // ============================================================
        // ADMIN
        // ============================================================
        function toggleAdminSession() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                updateAdminUI();
                return;
            }
            Swal.fire({
                title: 'Acceso Administrador',
                html: `<input type="password" id="swal-pass" class="swal2-input" placeholder="Clave: admin123">`,
                showCancelButton: true,
                confirmButtonText: 'Entrar',
                preConfirm: () => {
                    const p = document.getElementById('swal-pass').value;
                    return p === 'admin123' ? true : Swal.showValidationMessage('Clave incorrecta');
                }
            }).then((res) => {
                if (res.isConfirmed) {
                    isAdminLoggedIn = true;
                    updateAdminUI();
                }
            });
        }

        function updateAdminUI() {
            document.getElementById('adminBtnText').innerText = isAdminLoggedIn ? 'Salir Admin' : 'Admin';
            document.getElementById('btnAddPost').classList.toggle('hidden', !isAdminLoggedIn);
            document.getElementById('btnAddMarket').classList.toggle('hidden', !isAdminLoggedIn);
            renderFeed();
            renderRoutes();
            renderMarket();
        }

        // ============================================================
        // NAVEGACIÓN
        // ============================================================
        function switchTab(tabId) {
            // Ocultar todas
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            // Pestañas superiores
            document.querySelectorAll('.top-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`top-tab-${tabId}`).classList.add('active');

            // Navegación inferior
            document.querySelectorAll('.bottom-nav-btn').forEach(el => el.classList.remove('tab-active'));
            document.getElementById(`nav-${tabId}`).classList.add('tab-active');

            // Renderizar según pestaña
            if (tabId === 'feed') renderFeed();
            if (tabId === 'routes') renderRoutes();
            if (tabId === 'market') renderMarket();
        }

        // ============================================================
        // URL PARAMS
        // ============================================================
        function handleUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('post');
            const routeId = params.get('ruta');
            const marketId = params.get('market');

            if (postId) {
                switchTab('feed');
                setTimeout(() => highlightPost(postId), 300);
            } else if (routeId) {
                switchTab('routes');
                setTimeout(() => highlightRoute(routeId), 300);
            } else if (marketId) {
                switchTab('market');
                setTimeout(() => highlightMarket(marketId), 300);
            }
        }

        function highlightPost(id) {
            const el = document.querySelector(`[data-post-id="${id}"]`);
            if (el) {
                el.classList.add('highlighted');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function highlightRoute(id) {
            const el = document.querySelector(`[data-route-id="${id}"]`);
            if (el) {
                el.classList.add('highlighted');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => openRouteModal(id), 500);
            }
        }

        function highlightMarket(id) {
            const el = document.querySelector(`[data-market-id="${id}"]`);
            if (el) {
                el.classList.add('highlighted');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // ============================================================
        // COMPARTIR
        // ============================================================
        function sharePost(postId) {
            const url = `${window.location.origin}${window.location.pathname}?post=${postId}`;
            shareContent(url, '📌 ¡Mira esta publicación en Colectivos TGZ!');
        }

        function shareRoute(routeId) {
            const url = `${window.location.origin}${window.location.pathname}?ruta=${routeId}`;
            shareContent(url, '🚌 ¡Mira esta ruta en Colectivos TGZ!');
        }

        function shareMarket(marketId) {
            const url = `${window.location.origin}${window.location.pathname}?market=${marketId}`;
            shareContent(url, '🛒 ¡Mira este producto en Colectivos TGZ!');
        }

        function shareContent(url, message) {
            if (navigator.share) {
                navigator.share({ title: 'Colectivos TGZ', text: message, url: url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    Swal.fire({ icon: 'success', title: 'Enlace copiado', text: 'Comparte el enlace con tus contactos.', timer: 2000, showConfirmButton: false });
                }).catch(() => {
                    // WhatsApp fallback
                    window.open(`https://wa.me/?text=${encodeURIComponent(message + ' ' + url)}`, '_blank');
                });
            }
        }

        // ============================================================
        // PUBLICACIONES (FEED)
        // ============================================================
        function renderFeed() {
            const container = document.getElementById('feedContainer');
            if (!container) return;

            if (postsData.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-slate-500 py-12">
                        <i class="fa-solid fa-newspaper text-4xl mb-3 text-slate-700"></i>
                        <p class="text-base">No hay publicaciones aún.</p>
                        ${isAdminLoggedIn ? '<p class="text-sm text-cyan-400 mt-2">Crea una nueva publicación usando el botón "Publicar"</p>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = postsData.map(post => `
                <div class="post-card fade-in-up" data-post-id="${post.id}">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-10 h-10 rounded-full bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <span class="font-bold text-sm text-white">Administrador</span>
                                <span class="text-xs text-slate-400 block">${new Date(post.timestamp || Date.now()).toLocaleDateString()}</span>
                            </div>
                        </div>
                        ${isAdminLoggedIn ? `
                            <div class="flex gap-1">
                                <button onclick="editPost('${post.id}')" class="p-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-lg text-sm">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deletePost('${post.id}')" class="p-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-lg text-sm">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <p class="text-white text-base leading-relaxed whitespace-pre-wrap">${escapeHtml(post.content)}</p>

                    ${post.mediaUrl ? `
                        ${post.mediaUrl.match(/\.(mp4|webm|ogg)$/i) ? 
                            `<video src="${post.mediaUrl}" controls class="post-media mt-3" onerror="this.style.display='none'"></video>` :
                            `<img src="${post.mediaUrl}" alt="Publicación" class="post-media mt-3" onerror="this.style.display='none'">`
                        }
                    ` : ''}

                    <div class="flex items-center gap-4 mt-4 pt-3 border-t border-slate-800">
                        <button onclick="toggleLike('${post.id}')" class="flex items-center gap-1.5 text-sm font-bold ${(post.likedBy || []).includes(userId) ? 'text-rose-500' : 'text-slate-400'} hover:text-rose-400 transition">
                            <i class="fa-solid fa-heart"></i> ${post.likes || 0}
                        </button>
                        <button onclick="openComments('${post.id}')" class="flex items-center gap-1.5 text-sm font-bold text-slate-400 hover:text-cyan-400 transition">
                            <i class="fa-regular fa-comment"></i> ${(post.comments || []).length}
                        </button>
                        <button onclick="sharePost('${post.id}')" class="flex items-center gap-1.5 text-sm font-bold text-slate-400 hover:text-emerald-400 transition ml-auto">
                            <i class="fa-solid fa-share-nodes"></i> Compartir
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(postId) {
            const post = postsData.find(p => p.id === postId);
            if (!post) return;
            if (!post.likedBy) post.likedBy = [];
            if (!post.likes) post.likes = 0;

            const idx = post.likedBy.indexOf(userId);
            if (idx === -1) {
                post.likedBy.push(userId);
                post.likes += 1;
            } else {
                post.likedBy.splice(idx, 1);
                post.likes -= 1;
            }
            saveLocalData();
            syncToFirebase();
            renderFeed();
        }

        function openComments(postId) {
            currentCommentsPostId = postId;
            document.getElementById('commentsPanel').classList.add('open');
            renderComments(postId);
        }

        function toggleCommentsPanel() {
            document.getElementById('commentsPanel').classList.toggle('open');
        }

        function renderComments(postId) {
            const post = postsData.find(p => p.id === postId);
            if (!post) return;
            const list = document.getElementById('commentsList');
            if (!post.comments) post.comments = [];

            list.innerHTML = post.comments.map((c, idx) => `
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-cyan-400 text-sm">${escapeHtml(c.userName || 'Anónimo')}</span>
                        <span class="text-xs text-slate-400">${new Date(c.timestamp || Date.now()).toLocaleDateString()}</span>
                    </div>
                    <p class="text-white text-sm mt-1">${escapeHtml(c.text)}</p>
                    ${c.userId === userId || isAdminLoggedIn ? `
                        <div class="flex gap-2 mt-2">
                            <button onclick="editComment('${postId}', ${idx})" class="text-xs text-cyan-400 hover:text-cyan-300 font-bold">Editar</button>
                            <button onclick="deleteComment('${postId}', ${idx})" class="text-xs text-rose-400 hover:text-rose-300 font-bold">Eliminar</button>
                        </div>
                    ` : ''}
                </div>
            `).join('') || '<p class="text-slate-400 text-sm">No hay comentarios aún. Sé el primero.</p>';
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !currentCommentsPostId) return;

            const post = postsData.find(p => p.id === currentCommentsPostId);
            if (!post) return;
            if (!post.comments) post.comments = [];

            post.comments.push({
                userId: userId,
                userName: userName,
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
            saveLocalData();
            syncToFirebase();
            renderComments(currentCommentsPostId);
            renderFeed();
        }

        function editComment(postId, idx) {
            const post = postsData.find(p => p.id === postId);
            if (!post || !post.comments || !post.comments[idx]) return;
            const comment = post.comments[idx];

            Swal.fire({
                title: 'Editar comentario',
                input: 'text',
                inputValue: comment.text,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                inputValidator: (val) => !val && 'El comentario no puede estar vacío'
            }).then((res) => {
                if (res.isConfirmed && res.value) {
                    comment.text = res.value;
                    saveLocalData();
                    syncToFirebase();
                    renderComments(postId);
                    renderFeed();
                }
            });
        }

        function deleteComment(postId, idx) {
            Swal.fire({
                title: '¿Eliminar comentario?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Eliminar'
            }).then((res) => {
                if (res.isConfirmed) {
                    const post = postsData.find(p => p.id === postId);
                    if (post && post.comments) {
                        post.comments.splice(idx, 1);
                        saveLocalData();
                        syncToFirebase();
                        renderComments(postId);
                        renderFeed();
                    }
                }
            });
        }

        function openPostWizard() {
            if (!isAdminLoggedIn) {
                Swal.fire('Acceso restringido', 'Solo administradores pueden crear publicaciones.', 'info');
                return;
            }
            document.getElementById('postForm').reset();
            openModal('postWizardModal');
        }

        function handlePostSubmit(e) {
            e.preventDefault();
            const content = document.getElementById('postContent').value.trim();
            const mediaUrl = document.getElementById('postMediaUrl').value.trim();

            if (!content) {
                Swal.fire('Error', 'El contenido es obligatorio.', 'error');
                return;
            }

            const post = {
                id: 'post_' + Date.now(),
                content: content,
                mediaUrl: mediaUrl || '',
                timestamp: Date.now(),
                likes: 0,
                likedBy: [],
                comments: []
            };

            postsData.unshift(post);
            saveLocalData();
            syncToFirebase();
            closeModal('postWizardModal');
            renderFeed();
            Swal.fire({ icon: 'success', title: 'Publicación creada', timer: 1000, showConfirmButton: false });
        }

        function editPost(postId) {
            const post = postsData.find(p => p.id === postId);
            if (!post) return;
            document.getElementById('postContent').value = post.content;
            document.getElementById('postMediaUrl').value = post.mediaUrl || '';
            document.getElementById('postForm').onsubmit = (e) => {
                e.preventDefault();

        // ============================================================

        function renderRoutes() {

        function renderItemizedView(container, routes, mode) {
            const mapPoints = new Map();
            routes.forEach(r => {
                let list = [];
                if (mode === 'STOPS') list = r.stops || [];
                if (mode === 'RETURNS') list = r.returnStops || [];
                if (mode === 'POIS') list = [...(r.poisUrban || []), ...(r.poisForeign || [])];
                list.forEach(pt => {
                    if (!mapPoints.has(pt)) mapPoints.set(pt, []);
                    mapPoints.get(pt).push(r);
                });
            });

            if (mapPoints.size === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-8 text-sm">No hay puntos en esta categoría.</div>`;
                return;
            }

            let html = '';
            mapPoints.forEach((routesArr, ptName) => {
                html += `

        function calculateConnections() {
            const origin = document.getElementById('routeOrigin').value.trim().toLowerCase();
            const destination = document.getElementById('routeDestination').value.trim().toLowerCase();
            const container = document.getElementById('connectionsContainer');

            if (!origin || !destination) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');

            const getAllPoints = (r) => {
                return [
                    ...(r.stops || []),
                    ...(r.returnStops || []),
                    ...(r.poisUrban || []),
                    ...(r.poisForeign || []),
                    ...(r.streets ? r.streets.split(',').map(s => s.trim()) : [])
                ].map(p => p.toLowerCase());
            };

            const direct = routesData.filter(r => {
                const pts = getAllPoints(r);
                return pts.some(p => p.includes(origin)) && pts.some(p => p.includes(destination));
            });

            let html = '';

            if (direct.length > 0) {
                html += `
                    <div class="bg-emerald-950/40 border border-emerald-500/30 p-4 rounded-2xl space-y-3">
                        <span class="text-sm font-bold text-emerald-400 flex items-center gap-2">
                            <i class="fa-solid fa-bolt"></i> Conexión Directa (${direct.length})
                        </span>
                        ${direct.map(r => `
                            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2">
                                <span class="font-bold text-sm text-white">${escapeHtml(r.name)}</span>
                                <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-cyan-400">${r.category}</span>
                                <button onclick="openRouteModal('${r.id}')" class="btn-lg bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-sm" style="min-height:40px; padding:8px 16px;">
                                    <i class="fa-solid fa-map-location-dot"></i> Ver Mapa
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                // Buscar trasbordos
                const transfers = [];
                routesData.forEach(r1 => {
                    const pts1 = getAllPoints(r1);
                    if (pts1.some(p => p.includes(origin))) {
                        routesData.forEach(r2 => {
                            if (r1.id !== r2.id) {
                                const pts2 = getAllPoints(r2);
                                if (pts2.some(p => p.includes(destination))) {
                                    const common = pts1.filter(p => pts2.includes(p));
                                    if (common.length > 0) {
                                        transfers.push({ r1, r2, point: common[0] });
                                    }
                                }
                            }
                        });
                    }
                });

                if (transfers.length > 0) {
                    html += `
                        <div class="bg-cyan-950/40 border border-cyan-500/30 p-4 rounded-2xl space-y-3">
                            <span class="text-sm font-bold text-cyan-400 flex items-center gap-2">
                                <i class="fa-solid fa-arrows-split-up-and-left"></i> Trasbordos (${transfers.length})
                            </span>
                            ${transfers.slice(0, 10).map(t => `
                                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="font-bold text-sm text-white">${escapeHtml(t.r1.name)}</span>
                                        <i class="fa-solid fa-arrow-right text-slate-500 text-xs"></i>
                                        <span class="font-bold text-sm text-white">${escapeHtml(t.r2.name)}</span>
                                    </div>
                                    <div class="text-xs text-amber-400 font-bold">Trasbordo en: ${escapeHtml(t.point)}</div>
                                    <div class="flex flex-wrap gap-2">
                                        <button onclick="openRouteModal('${t.r1.id}')" class="btn-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl text-xs" style="min-height:36px; padding:6px 14px;">Ruta 1</button>
                                        <button onclick="openRouteModal('${t.r2.id}')" class="btn-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl text-xs" style="min-height:36px; padding:6px 14px;">Ruta 2</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    html = `
                        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center text-slate-400 text-sm">
                            No se encontraron conexiones directas ni trasbordos para esos puntos.
                        </div>
                    `;
                }
            }

            container.innerHTML = html;
        }

        // ============================================================
        // CLOUDINARY UPLOAD
        // ============================================================
        function uploadToCloudinary(file, callback) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'sinfirmaupload');

            fetch('https://api.cloudinary.com/v1_1/davovja1g/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.secure_url) {
                    callback(data.secure_url);
                    Swal.fire({ icon: 'success', title: 'Archivo subido', timer: 1000, showConfirmButton: false });
                } else {
                    Swal.fire('Error', 'No se pudo subir el archivo.', 'error');
                }
            })
            .catch(() => {
                Swal.fire('Error', 'Error al subir a Cloudinary.', 'error');
            });
        }

        // ============================================================
        // RUTAS CRUD (Admin)
        // ============================================================
        function editRoute(routeId) {
            if (!isAdminLoggedIn) {
                Swal.fire('Acceso restringido', 'Solo administradores pueden editar rutas.', 'info');
                return;
            }
            const route = routesData.find(r => r.id === routeId);
            if (!route) return;

            // Usar el wizard existente
            document.getElementById('editRouteId').value = route.id;
            document.getElementById('routeName').value = route.name || '';
            document.getElementById('routeCategory').value = route.category || 'URBANA';
            document.getElementById('routeMapUrl').value = route.mapUrl || '';
            document.getElementById('routeImageUrl').value = route.imageUrl || '';
            document.getElementById('routeStops').value = (route.stops || []).join(', ');
            document.getElementById('routeReturnStops').value = (route.returnStops || []).join(', ');
            document.getElementById('routePoisUrban').value = (route.poisUrban || []).join(', ');
            document.getElementById('routePoisForeign').value = (route.poisForeign || []).join(', ');
            document.getElementById('routeStreets').value = route.streets || '';

            // Mostrar el wizard de rutas
            const wizard = document.getElementById('adminWizardModal');
            if (wizard) wizard.classList.remove('hidden');
            currentWizardStep = 1;
            updateWizardStepUI();
        }

        function deleteRoute(id) {
            if (!isAdminLoggedIn) return;
            Swal.fire({
                title: '¿Eliminar ruta?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Eliminar'
            }).then((res) => {
                if (res.isConfirmed) {
                    routesData = routesData.filter(r => r.id !== id);
                    saveLocalData();
                    syncToFirebase();
                    renderRoutes();
                    updateDatalists();
                }
            });
        }

        // ============================================================
        // DATALISTS
        // ============================================================
        function updateDatalists() {
            const global = new Set();
            routesData.forEach(r => {
                (r.stops || []).forEach(p => global.add(p));
                (r.returnStops || []).forEach(p => global.add(p));
                (r.poisUrban || []).forEach(p => global.add(p));
                (r.poisForeign || []).forEach(p => global.add(p));
                if (r.streets) {
                    r.streets.split(',').map(s => s.trim()).filter(Boolean).forEach(st => global.add(st));
                }
            });

            const dl = document.getElementById('globalPointsDatalist');
            if (dl) dl.innerHTML = Array.from(global).sort().map(i => `<option value="${escapeHtml(i)}"></option>`).join('');
        }

        // ============================================================
        // WIZARD DE RUTAS (Reutilizado del index original)
        // ============================================================
        let currentWizardStep = 1;

        function updateWizardStepUI() {
            for (let i = 1; i <= 4; i++) {
                const step = document.getElementById(`wizard-step-${i}`);
                if (step) step.classList.toggle('hidden', i !== currentWizardStep);
                const chip = document.getElementById(`step-indicator-${i}`);
                if (chip) {
                    if (i <= currentWizardStep) {
                        chip.className = "step-chip text-cyan-400 flex items-center gap-1.5";
                        const span = chip.querySelector('span');
                        if (span) span.className = "w-5 h-5 rounded-full bg-cyan-600 text-white flex items-center justify-center text-[10px]";
                    } else {
                        chip.className = "step-chip text-slate-500 flex items-center gap-1.5";
                        const span = chip.querySelector('span');
                        if (span) span.className = "w-5 h-5 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-[10px]";
                    }
                }
            }

            const btnPrev = document.getElementById('btnWizardPrev');
            const btnNext = document.getElementById('btnWizardNext');
            const btnSubmit = document.getElementById('btnWizardSubmit');

            if (btnPrev) {
                btnPrev.disabled = currentWizardStep === 1;
                btnPrev.classList.toggle('opacity-50', currentWizardStep === 1);
                btnPrev.classList.toggle('cursor-not-allowed', currentWizardStep === 1);
            }

            if (btnNext && btnSubmit) {
                if (currentWizardStep === 4) {
                    btnNext.classList.add('hidden');
                    btnSubmit.classList.remove('hidden');
                } else {
                    btnNext.classList.remove('hidden');
                    btnSubmit.classList.add('hidden');
                }
            }
        }

        function navigateWizard(delta) {
            currentWizardStep = Math.max(1, Math.min(4, currentWizardStep + delta));
            updateWizardStepUI();
        }

        function handleRouteSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editRouteId').value;

            const parseAndClean = (str) => {
                const items = (str || '').split(',').map(s => s.trim()).filter(Boolean);
                const unique = [];
                const seen = new Set();
                items.forEach(i => {
                    if (!seen.has(i.toLowerCase())) {
                        seen.add(i.toLowerCase());
                        unique.push(i);
                    }
                });
                return unique;
            };

            const routeObj = {
                id: editId || 'route_' + Date.now(),
                name: document.getElementById('routeName').value.trim(),
                category: document.getElementById('routeCategory').value,
                mapUrl: document.getElementById('routeMapUrl').value.trim(),
                imageUrl: document.getElementById('routeImageUrl').value.trim(),
                stops: parseAndClean(document.getElementById('routeStops').value),
                returnStops: parseAndClean(document.getElementById('routeReturnStops').value),
                poisUrban: parseAndClean(document.getElementById('routePoisUrban').value),
                poisForeign: parseAndClean(document.getElementById('routePoisForeign').value),
                streets: document.getElementById('routeStreets').value.trim()
            };

            if (editId) {
                const idx = routesData.findIndex(r => r.id === editId);
                if (idx !== -1) routesData[idx] = routeObj;
            } else {
                routesData.push(routeObj);
            }

            saveLocalData();
            syncToFirebase();
            closeModal('adminWizardModal');
            document.getElementById('wizardForm').reset();
            document.getElementById('editRouteId').value = '';
            renderRoutes();
            updateDatalists();
            Swal.fire({ icon: 'success', title: 'Ruta guardada', timer: 1000, showConfirmButton: false });
        }

        // ============================================================
        // UTILIDADES
        // ============================================================
        function openModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // ============================================================
        // PWA
        // ============================================================
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btnInstallPwa');
            if (btn) btn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    document.getElementById('btnInstallPwa').classList.add('hidden');
                    deferredPrompt = null;
                });
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        // ============================================================
        // DETECCIÓN DE URL AL CARGAR
        // ============================================================
        window.addEventListener('popstate', handleUrlParams);
    </script>

</body>
</html>
