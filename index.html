<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="./manifest.json">
    <title>Colectivos TGZ Pro | Sistema Integral de Rutas</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SDK Firebase JS v9 (Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' },
                        cyber: { dark: '#020617', panel: '#0f172a', border: '#1e293b', accent: '#38bdf8' }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        /* Ajustes Estructurales de Modo Claro y Oscuro */
        html.dark body { background-color: #020617; color: #f8fafc; }
        html:not(.dark) body { background-color: #f1f5f9; color: #0f172a; }

        html:not(.dark) .bg-slate-900 { background-color: #ffffff !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        html:not(.dark) .bg-slate-950 { background-color: #f8fafc !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        html:not(.dark) .text-white { color: #0f172a !important; }
        html:not(.dark) .text-slate-400 { color: #475569 !important; }
        html:not(.dark) .text-slate-300 { color: #334155 !important; }
        html:not(.dark) .border-slate-800 { border-color: #cbd5e1 !important; }
        html:not(.dark) #bottomNav { background-color: #ffffff !important; border-color: #cbd5e1 !important; }

        .tab-active { color: #06b6d4 !important; border-bottom: 2px solid #06b6d4; }
        .map-wrapper { transition: transform 0.2s ease-in-out; transform-origin: center center; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cyan-500 selection:text-black">

    <!-- BARRA SUPERIOR DE ESTADO Y CONFIGURACIÓN -->
    <div id="statusBanner" class="bg-slate-900 border-b border-slate-800 text-xs py-1.5 px-3 flex justify-between items-center text-slate-400 z-30">
        <span id="connectionState" class="flex items-center gap-2 text-[11px] font-mono">
            <span id="netStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> 
            <span id="netStatusText">MODO OFFLINE (CACHÉ LOCAL)</span>
        </span>
        <div class="flex items-center gap-2">
            <!-- BOTÓN INSTALAR PWA (SE MUESTRA SOLO CUANDO EL NAVEGADOR LO PERMITE) -->
            <button id="btnInstallPwa" onclick="installPWA()" class="hidden p-1 px-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-[11px] font-bold border border-cyan-500 flex items-center gap-1 shadow-lg animate-pulse" title="Instalar Aplicación PWA">
                <i class="fa-solid fa-download"></i> Instalar App
            </button>
            
            <button onclick="toggleTheme()" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-lg text-xs" title="Cambiar Tema Claro/Oscuro">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <button onclick="toggleAdminSession()" id="adminAuthBtn" class="text-xs text-cyan-400 font-bold flex items-center gap-1 border border-cyan-500/30 px-2 py-0.5 rounded-lg bg-cyan-950/40">
                <i class="fa-solid fa-shield-halved"></i> <span id="adminBtnText">Admin</span>
            </button>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center text-cyan-400 shrink-0">
                    <i class="fa-solid fa-bus text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wider text-white uppercase flex items-center gap-2">
                        Colectivos TGZ <span class="text-[9px] bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-1.5 py-0.5 rounded font-mono">SISTEMA FULL</span>
                    </h1>
                    <p class="text-[10px] text-slate-400">Gestión de Rutas, Paradas y Trasbordos Urbano / Foráneo</p>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <button id="btnAddNewRoute" onclick="openModal('adminModal')" class="hidden bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> <span>Nueva Ruta</span>
                </button>
                <button onclick="syncDataWithFirebase()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-2 rounded-lg text-xs border border-slate-700" title="Sincronizar Datos">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- NAVEGACIÓN SUPERIOR POR PESTAÑAS -->
    <div class="max-w-7xl mx-auto w-full px-3 pt-2">
        <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
            <button onclick="switchTab('explorer')" id="top-tab-explorer" class="top-tab py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-magnifying-glass"></i> Explorador
            </button>
            <button onclick="switchTab('planner')" id="top-tab-planner" class="top-tab py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-route"></i> Trasbordos
            </button>
            <button onclick="switchTab('map')" id="top-tab-map" class="top-tab py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-map-location-dot"></i> Visor Mapa
            </button>
        </div>
    </div>

    <!-- CONTENEDOR DE CONTENIDO -->
    <main class="max-w-7xl mx-auto w-full px-3 py-3 flex-1 mb-16">

        <!-- VISTA 1: EXPLORADOR Y FILTROS -->
        <section id="view-explorer" class="tab-content space-y-3">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-cyan-400 text-xs"></i>
                    <input type="text" id="searchInput" list="globalPointsDatalist" oninput="onSearchChange()" placeholder="Buscar por ruta, avenida, hospital, escuela o punto clave..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500">
                </div>

                <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-800/80 pt-2 text-[11px]">
                    <div class="flex items-center gap-1 overflow-x-auto">
                        <span class="font-bold text-slate-400 mr-1"><i class="fa-solid fa-filter text-cyan-400"></i> Vista:</span>
                        <button onclick="setViewMode('ROUTES')" id="btnViewRoutes" class="mode-chip bg-cyan-600 text-white px-2.5 py-1 rounded font-bold">Rutas</button>
                        <button onclick="setViewMode('STOPS')" id="btnViewStops" class="mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold">Paradas</button>
                        <button onclick="setViewMode('POIS')" id="btnViewPois" class="mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold">Puntos Interés</button>
                        <button onclick="setViewMode('RETURNS')" id="btnViewReturns" class="mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold">Retornos</button>
                    </div>

                    <div class="flex items-center gap-1 overflow-x-auto">
                        <button onclick="filterCategory('ALL')" class="cat-chip bg-slate-800 text-cyan-400 px-2 py-0.5 rounded font-bold">Todas</button>
                        <button onclick="filterCategory('URBANA')" class="cat-chip bg-slate-800/60 text-slate-400 px-2 py-0.5 rounded font-bold">Urbanas</button>
                        <button onclick="filterCategory('FORANEA')" class="cat-chip bg-slate-800/60 text-slate-400 px-2 py-0.5 rounded font-bold">Foráneas</button>
                    </div>
                </div>
            </div>

            <div id="explorerResultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
        </section>

        <!-- VISTA 2: PLANIFICADOR DE TRASBORDOS CON ALGORITMO COMPLETO -->
        <section id="view-planner" class="tab-content hidden space-y-3">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5 uppercase">
                        <i class="fa-solid fa-diagram-project text-cyan-400"></i> Calculadora Automática de Trasbordos
                    </h2>
                    <button onclick="resetPlanner()" class="text-[10px] bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700">
                        <i class="fa-solid fa-trash"></i> Resetear
                    </button>
                </div>

                <div id="destinationsContainer" class="space-y-2">
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold flex items-center justify-center shrink-0">A</span>
                        <input list="globalPointsDatalist" id="plannerOrigin" class="planner-input w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500" placeholder="Lugar de Origen (Ej. Copoya, Terán, Parque Central)...">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold flex items-center justify-center shrink-0">B</span>
                        <input list="globalPointsDatalist" id="plannerDestination" class="planner-input w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white placeholder-slate-500 outline-none focus:border-cyan-500" placeholder="Lugar de Destino (Ej. Hospital General, Chiapa de Corzo)...">
                    </div>
                </div>

                <button onclick="calculateMultiRoute()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-lg text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-route"></i> Calcular Mejores Conexiones
                </button>
            </div>

            <div id="plannerResults" class="space-y-3"></div>
        </section>

        <!-- VISTA 3: VISOR DE MAPA AVANZADO -->
        <section id="view-map" class="tab-content hidden space-y-3">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-2">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5 uppercase">
                        <i class="fa-solid fa-map text-cyan-400"></i> Visor Geográfico y Mapas de Ruta
                    </h2>
                    <select id="mapRouteSelector" onchange="loadRouteMapDetails(this.value)" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-200 outline-none w-full sm:w-auto font-medium">
                    </select>
                </div>

                <div class="flex items-center justify-between border-b border-slate-800 pb-2 text-xs">
                    <div class="flex items-center gap-2">
                        <button id="btnViewGmaps" onclick="toggleMapView('gmaps')" class="bg-cyan-600 text-white px-3 py-1 rounded font-bold">Google Maps</button>
                        <button id="btnViewImage" onclick="toggleMapView('image')" class="hidden bg-slate-800 text-slate-400 px-3 py-1 rounded font-bold">Plano Imagen</button>
                    </div>

                    <!-- BARRA DE CONTROLES EXTERNOS DEL MAPA -->
                    <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                        <button onclick="adjustMapZoom(0.15)" class="p-1 px-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs font-bold" title="Acercar mapa"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                        <button onclick="adjustMapZoom(-0.15)" class="p-1 px-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs font-bold" title="Alejar mapa"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                        <button onclick="resetMapZoom()" class="p-1 px-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs font-bold" title="Restablecer zoom"><i class="fa-solid fa-rotate-left"></i></button>
                        <button onclick="toggleMapFullscreen()" class="p-1 px-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs font-bold" title="Pantalla Completa"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>

                <!-- CONTENEDOR CON MARGEN NEGATIVO SUPERIOR PARA OCULTAR BORDES DE GOOGLE MAPS -->
                <div id="mapFrameContainer" class="relative w-full h-[60vh] bg-slate-950 rounded-xl overflow-hidden border border-slate-800">
                    <div id="mapTransformWrapper" class="map-wrapper w-full h-full relative">
                        <iframe id="mainMapIframe" src="about:blank" class="w-full h-[calc(100%+52px)] -mt-[52px] border-0"></iframe>
                    </div>

                    <div id="imagePlanContainer" class="hidden w-full h-full overflow-auto flex items-center justify-center p-2 bg-slate-950">
                        <img id="routePlanImage" src="" alt="Plano de ruta" class="max-w-full max-h-full object-contain">
                    </div>
                </div>

                <div id="routeDetailCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2 pt-1"></div>
            </div>
        </section>

    </main>

    <!-- BARRA INFERIOR MÓVIL PWA -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-800 py-2 px-4 flex items-center justify-around z-40">
        <button onclick="switchTab('explorer')" id="nav-explorer" class="bottom-nav-btn tab-active flex flex-col items-center gap-0.5 text-slate-400">
            <i class="fa-solid fa-compass text-base"></i>
            <span class="text-[9px] font-bold">Explorar</span>
        </button>
        <button onclick="switchTab('planner')" id="nav-planner" class="bottom-nav-btn flex flex-col items-center gap-0.5 text-slate-400">
            <i class="fa-solid fa-route text-base"></i>
            <span class="text-[9px] font-bold">Trasbordos</span>
        </button>
        <button onclick="switchTab('map')" id="nav-map" class="bottom-nav-btn flex flex-col items-center gap-0.5 text-slate-400">
            <i class="fa-solid fa-map-location-dot text-base"></i>
            <span class="text-[9px] font-bold">Visor</span>
        </button>
    </nav>

    <!-- DATALISTS PARA AUTOCOMPLETADO GLOBAL -->
    <datalist id="globalPointsDatalist"></datalist>

    <!-- MODAL ADMINISTRADOR -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 hidden">
        <div class="bg-slate-900 w-full max-w-xl rounded-xl border border-slate-800 shadow-2xl flex flex-col max-h-[92vh]">
            <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h3 class="font-bold text-xs text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-cyan-400"></i> Registrar / Editar Ruta
                </h3>
                <button onclick="closeModal('adminModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>

            <form id="addRouteForm" onsubmit="handleRouteSubmit(event)" class="p-3 overflow-y-auto space-y-3 flex-1 text-xs">
                <input type="hidden" id="editRouteId" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300">Nombre de la Ruta *</label>
                        <input type="text" id="routeName" required placeholder="Ej. Ruta 1 y 2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500">
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-slate-300">Categoría *</label>
                        <select id="routeCategory" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500">
                            <option value="URBANA">Urbana (Tuxtla)</option>
                            <option value="FORANEA">Foránea (Chiapa de Corzo / Copoya / Otras)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="font-bold text-slate-300">URL / Iframe Google Maps *</label>
                    <input type="text" id="routeMapUrl" required placeholder="https://www.google.com/maps/d/embed?mid=..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500 font-mono text-[11px]">
                </div>

                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 space-y-2">
                    <label class="font-bold text-cyan-400 block"><i class="fa-solid fa-image"></i> Plano de Ruta / Imagen (Opcional)</label>
                    <input type="text" id="routeImageUrl" placeholder="URL directa de la imagen..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-white outline-none focus:border-cyan-500 font-mono text-[11px]">
                </div>

                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 space-y-2">
                    <span class="text-[10px] font-bold text-cyan-400 uppercase block"><i class="fa-solid fa-list-check"></i> Paradas y Puntos Clave</span>
                    <div class="space-y-1">
                        <label class="text-[10px] font-semibold text-slate-400">Paradas Principales (Separadas por comas)</label>
                        <input type="text" id="routeStops" placeholder="Parada A, Parada B..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-semibold text-slate-400">Retornos (Separados por comas)</label>
                        <input type="text" id="routeReturnStops" placeholder="Retorno A, Retorno B..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div class="space-y-1">
                            <label class="text-[10px] font-semibold text-slate-400">POIs Urbanos</label>
                            <textarea id="routePoisUrban" rows="2" placeholder="Mercado Central, Parque Bicentenario..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500 text-[11px]"></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-semibold text-slate-400">POIs Foráneos</label>
                            <textarea id="routePoisForeign" rows="2" placeholder="El Jobo, Mirador, Parque Chiapa..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-white outline-none focus:border-cyan-500 text-[11px]"></textarea>
                        </div>
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2 border-t border-slate-800">
                    <button type="button" onclick="closeModal('adminModal')" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg font-bold">Cancelar</button>
                    <button type="submit" class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold">Guardar Ruta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGICA SCRIPT INTEGRAL DE LA APLICACIÓN -->
    <script>
        // CONFIGURACIÓN DE FIREBASE REALTIME DATABASE
        const firebaseConfig = {
            apiKey: "AIzaSyASox7mRak5V0py29htEVWCVeipGpA0yfs",
            authDomain: "galloslivebadge.firebaseapp.com",
            databaseURL: "https://galloslivebadge-default-rtdb.firebaseio.com",
            projectId: "galloslivebadge",
            storageBucket: "galloslivebadge.firebasestorage.app",
            messagingSenderId: "979482928760",
            appId: "1:979482928760:web:3ea879dc4ee1e020df6f8d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const routesRef = db.ref('rutas_colectivos_tgz');

        let routesData = [];
        let currentCategory = 'ALL';
        let currentViewMode = 'ROUTES';
        let selectedPointFilter = null;
        let isAdminLoggedIn = false;
        let mapZoomLevel = 1;
        let deferredPrompt = null; // CAPTURA EVENTO DE INSTALACIÓN PWA

        // EVENTO PARA CAPTURAR LA PROMP DE INSTALACIÓN MANUAL
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('btnInstallPwa');
            if (installBtn) installBtn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('btnInstallPwa').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // REGISTRO DE SERVICE WORKER
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('ServiceWorker activo:', reg.scope);
                }).catch(err => {
                    console.log('Error registrando ServiceWorker:', err);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadRoutesFromLocalStorage();
            initFirebaseRealtimeSync();
            renderExplorerView();
            updateMapSelector();
            switchTab('explorer');
        });

        // MANEJO DE TEMA GUARDADO EN LOCALSTORAGE
        function initTheme() {
            const savedTheme = localStorage.getItem('tgz_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('tgz_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        function loadRoutesFromLocalStorage() {
            const saved = localStorage.getItem('tgz_routes_pro_cache');
            if (saved) {
                try { routesData = JSON.parse(saved); } catch (e) { routesData = []; }
            } else {
                routesData = [];
            }
            updateAllDatalists();
        }

        function saveRoutesToLocalStorage() {
            localStorage.setItem('tgz_routes_pro_cache', JSON.stringify(routesData));
            updateAllDatalists();
        }

        function initFirebaseRealtimeSync() {
            routesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data !== null) {
                    routesData = Array.isArray(data) ? data : Object.values(data);
                }
                saveRoutesToLocalStorage();
                renderExplorerView();
                updateMapSelector();
                updateNetworkState(true, 'REALTIME EN LÍNEA');
            }, (error) => {
                updateNetworkState(false, 'MODO OFFLINE (CACHÉ LOCAL)');
            });
        }

        function syncDataWithFirebase() {
            if (navigator.onLine) {
                routesRef.set(routesData).then(() => {
                    Swal.fire({ icon: 'success', title: 'Sincronizado con Firebase', timer: 1000, showConfirmButton: false });
                }).catch(err => {
                    Swal.fire('Error', 'No se pudo actualizar la nube: ' + err.message, 'error');
                });
            } else {
                Swal.fire('Modo Offline', 'Estás trabajando localmente. Todo está seguro en tu navegador.', 'info');
            }
        }

        function updateNetworkState(isOnline, text) {
            const dot = document.getElementById('netStatusDot');
            const txt = document.getElementById('netStatusText');
            if (isOnline) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
                txt.innerText = text || "EN LÍNEA";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
                txt.innerText = text || "MODO OFFLINE (CACHÉ LOCAL)";
            }
        }

        // CONTROLES DE NAVEGACIÓN Y ZOOM DEL MAPA
        function adjustMapZoom(delta) {
            mapZoomLevel = Math.max(0.7, Math.min(2.5, mapZoomLevel + delta));
            document.getElementById('mapTransformWrapper').style.transform = `scale(${mapZoomLevel})`;
        }

        function resetMapZoom() {
            mapZoomLevel = 1;
            document.getElementById('mapTransformWrapper').style.transform = `scale(1)`;
        }

        function toggleMapFullscreen() {
            const container = document.getElementById('mapFrameContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        function updateAllDatalists() {
            const global = new Set();
            routesData.forEach(r => {
                (r.stops || []).forEach(p => global.add(p));
                (r.returnStops || []).forEach(p => global.add(p));
                (r.poisUrban || []).forEach(p => global.add(p));
                (r.poisForeign || []).forEach(p => global.add(p));
            });

            const dl = document.getElementById('globalPointsDatalist');
            if (dl) dl.innerHTML = Array.from(global).sort().map(i => `<option value="${escapeHtml(i)}"></option>`).join('');
        }

        function toggleAdminSession() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                updateAdminUI();
            } else {
                Swal.fire({
                    title: 'Acceso Administrador',
                    html: `<input type="password" id="swal-pass" class="swal2-input" placeholder="Clave: admin123">`,
                    showCancelButton: true,
                    confirmButtonText: 'Entrar',
                    preConfirm: () => {
                        const p = document.getElementById('swal-pass').value;
                        return p === 'admin123' ? true : Swal.showValidationMessage('Clave incorrecta');
                    }
                }).then((res) => {
                    if (res.isConfirmed) {
                        isAdminLoggedIn = true;
                        updateAdminUI();
                    }
                });
            }
        }

        function updateAdminUI() {
            document.getElementById('btnAddNewRoute').classList.toggle('hidden', !isAdminLoggedIn);
            document.getElementById('adminBtnText').innerText = isAdminLoggedIn ? 'Salir Admin' : 'Admin';
            renderExplorerView();
        }

        function switchTab(tabId) {
            const contents = document.getElementsByClassName('tab-content');
            for (let c of contents) c.classList.add('hidden');
            document.getElementById(`view-${tabId}`).classList.remove('hidden');

            const topTabs = document.getElementsByClassName('top-tab');
            for (let t of topTabs) t.classList.remove('bg-cyan-600', 'text-white');
            document.getElementById(`top-tab-${tabId}`).classList.add('bg-cyan-600', 'text-white');

            const navBtns = document.getElementsByClassName('bottom-nav-btn');
            for (let n of navBtns) n.classList.remove('tab-active');
            document.getElementById(`nav-${tabId}`).classList.add('tab-active');

            if (tabId === 'map' && routesData.length > 0) {
                const selected = document.getElementById('mapRouteSelector').value || routesData[0].id;
                loadRouteMapDetails(selected);
            }
        }

        function onSearchChange() {
            selectedPointFilter = null;
            renderExplorerView();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            selectedPointFilter = null;
            const chips = document.getElementsByClassName('mode-chip');
            for (let c of chips) c.className = "mode-chip bg-slate-800 text-slate-400 px-2.5 py-1 rounded font-bold";
            
            const activeBtn = { ROUTES: 'btnViewRoutes', STOPS: 'btnViewStops', POIS: 'btnViewPois', RETURNS: 'btnViewReturns' }[mode];
            document.getElementById(activeBtn).className = "mode-chip bg-cyan-600 text-white px-2.5 py-1 rounded font-bold";
            renderExplorerView();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderExplorerView();
        }

        function renderExplorerView() {
            const container = document.getElementById('explorerResultsContainer');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            if (selectedPointFilter) {
                const matchingRoutes = routesData.filter(r => {
                    const allPois = [...(r.stops || []), ...(r.returnStops || []), ...(r.poisUrban || []), ...(r.poisForeign || [])];
                    return allPois.includes(selectedPointFilter);
                });

                container.innerHTML = `
                    <div class="col-span-full bg-slate-900 p-3 rounded-xl border border-cyan-500/40 flex justify-between items-center text-xs">
                        <span>Filtrando punto: <b class="text-cyan-400">${escapeHtml(selectedPointFilter)}</b></span>
                        <button onclick="selectedPointFilter=null; renderExplorerView()" class="bg-slate-800 text-slate-300 px-2 py-1 rounded">Ver Todo</button>
                    </div>
                    ${renderRoutesCardsHtml(matchingRoutes)}
                `;
                return;
            }

            if (currentViewMode === 'ROUTES') {
                const filtered = routesData.filter(r => {
                    const matchCat = (currentCategory === 'ALL') || (r.category === currentCategory);
                    const allPois = [...(r.poisUrban || []), ...(r.poisForeign || []), ...(r.stops || []), ...(r.returnStops || [])].join(' ').toLowerCase();
                    return matchCat && (r.name.toLowerCase().includes(query) || allPois.includes(query));
                });
                container.innerHTML = renderRoutesCardsHtml(filtered);
            } else {
                let itemsSet = new Set();
                routesData.forEach(r => {
                    if (currentCategory === 'ALL' || r.category === currentCategory) {
                        let target = [];
                        if (currentViewMode === 'STOPS') target = r.stops || [];
                        if (currentViewMode === 'POIS') target = [...(r.poisUrban || []), ...(r.poisForeign || [])];
                        if (currentViewMode === 'RETURNS') target = r.returnStops || [];
                        target.forEach(p => itemsSet.add(p));
                    }
                });

                const filteredItems = Array.from(itemsSet).filter(item => item.toLowerCase().includes(query)).sort();

                if (filteredItems.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs">Sin registros de coincidencias.</div>`;
                    return;
                }

                container.innerHTML = filteredItems.map(item => {
                    const count = routesData.filter(r => [...(r.stops || []), ...(r.returnStops || []), ...(r.poisUrban || []), ...(r.poisForeign || [])].includes(item)).length;
                    return `
                        <div onclick="selectedPointFilter='${escapeHtml(item)}'; renderExplorerView()" class="bg-slate-900 border border-slate-800 p-3 rounded-xl cursor-pointer flex justify-between items-center text-xs hover:border-cyan-500/50">
                            <span class="font-bold text-slate-200"><i class="fa-solid fa-location-dot text-cyan-400 mr-1.5"></i> ${escapeHtml(item)}</span>
                            <span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded text-[10px] font-bold">${count} Ruta(s)</span>
                        </div>
                    `;
                }).join('');
            }
        }

        function renderRoutesCardsHtml(routes) {
            if (routes.length === 0) return `<div class="col-span-full text-center py-6 text-slate-500 text-xs">No hay rutas guardadas aún. Registra una con el botón de Admin.</div>`;

            return routes.map(r => `
                <div class="bg-slate-900 rounded-xl p-3 border border-slate-800 flex flex-col justify-between space-y-2 text-xs">
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-start gap-1">
                            <h3 class="font-bold text-white">${escapeHtml(r.name)}</h3>
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${r.category === 'URBANA' ? 'bg-cyan-500/20 text-cyan-300' : 'bg-purple-500/20 text-purple-300'}">${r.category}</span>
                        </div>
                        <p class="text-[11px] text-slate-400"><i class="fa-solid fa-bus text-cyan-400"></i> Parada inicial: ${r.stops && r.stops.length ? escapeHtml(r.stops[0]) : 'Sin parada'}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-1.5">
                        <button onclick="viewRouteOnMap('${r.id}')" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1">
                            <i class="fa-solid fa-map"></i> Ver Mapa
                        </button>
                        ${isAdminLoggedIn ? `
                            <button onclick="editRoute('${r.id}')" class="p-1.5 bg-slate-800 text-slate-300 rounded-lg"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteRoute('${r.id}')" class="p-1.5 bg-rose-500/20 text-rose-400 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ALGORITMO COMPLETO DE CÁLCULO DE TRASBORDOS
        function calculateMultiRoute() {
            const orig = document.getElementById('plannerOrigin').value.trim().toLowerCase();
            const dest = document.getElementById('plannerDestination').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('plannerResults');

            if (!orig || !dest) {
                Swal.fire('Campos requeridos', 'Ingresa origen y destino para calcular la mejor conexión.', 'warning');
                return;
            }

            const getAllPoints = (r) => [...(r.stops || []), ...(r.returnStops || []), ...(r.poisUrban || []), ...(r.poisForeign || [])].map(p => p.toLowerCase());

            // 1. Conexiones Directas (Sin trasbordo)
            const directRoutes = routesData.filter(r => {
                const pts = getAllPoints(r);
                return pts.some(p => p.includes(orig)) && pts.some(p => p.includes(dest));
            });

            if (directRoutes.length > 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-slate-900 p-3 rounded-xl border border-emerald-500/40 space-y-2">
                        <span class="text-xs font-bold text-emerald-400 uppercase flex items-center gap-1">
                            <i class="fa-solid fa-bolt"></i> Conexión Directa Encontrada (${directRoutes.length})
                        </span>
                        ${directRoutes.map(r => `
                            <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center text-xs">
                                <div>
                                    <h4 class="font-bold text-white">${escapeHtml(r.name)}</h4>
                                    <p class="text-[10px] text-slate-400">Te lleva directo sin cambiar de colectivo.</p>
                                </div>
                                <button onclick="viewRouteOnMap('${r.id}')" class="bg-cyan-600 text-white px-2.5 py-1 rounded text-[11px] font-bold">Ver Mapa</button>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }

            // 2. Conexiones con 1 Trasbordo
            let transferSolutions = [];
            routesData.forEach(r1 => {
                const pts1 = getAllPoints(r1);
                if (pts1.some(p => p.includes(orig))) {
                    routesData.forEach(r2 => {
                        if (r1.id !== r2.id) {
                            const pts2 = getAllPoints(r2);
                            if (pts2.some(p => p.includes(dest))) {
                                const common = pts1.filter(p => pts2.includes(p));
                                if (common.length > 0) {
                                    transferSolutions.push({
                                        route1: r1,
                                        route2: r2,
                                        transferPoint: common[0]
                                    });
                                }
                            }
                        }
                    });
                }
            });

            if (transferSolutions.length > 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-slate-900 p-3 rounded-xl border border-cyan-500/40 space-y-2">
                        <span class="text-xs font-bold text-cyan-400 uppercase flex items-center gap-1">
                            <i class="fa-solid fa-arrows-split-up-and-left"></i> Conexión con 1 Trasbordo (${transferSolutions.length})
                        </span>
                        ${transferSolutions.slice(0, 5).map(sol => `
                            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2 text-xs">
                                <div class="flex items-center gap-2 text-slate-300">
                                    <span class="font-bold text-cyan-400">1º Tomar:</span> ${escapeHtml(sol.route1.name)}
                                </div>
                                <div class="bg-cyan-950/40 border border-cyan-500/30 p-2 rounded text-[11px] text-cyan-300 font-semibold flex items-center gap-2">
                                    <i class="fa-solid fa-person-walking-arrow-loop-left text-sm"></i> Bajar en punto de trasbordo: <b class="uppercase text-white">${escapeHtml(sol.transferPoint)}</b>
                                </div>
                                <div class="flex items-center gap-2 text-slate-300">
                                    <span class="font-bold text-purple-400">2º Trasbordar a:</span> ${escapeHtml(sol.route2.name)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                resultsContainer.innerHTML = `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-center text-slate-400 text-xs">
                        <i class="fa-solid fa-circle-exclamation text-amber-400 text-xl mb-1"></i>
                        <p>No se encontraron rutas que conecten directamente estos dos puntos con los registros actuales.</p>
                    </div>
                `;
            }
        }

        function resetPlanner() {
            document.getElementById('plannerOrigin').value = '';
            document.getElementById('plannerDestination').value = '';
            document.getElementById('plannerResults').innerHTML = '';
        }

        function updateMapSelector() {
            const select = document.getElementById('mapRouteSelector');
            if (routesData.length === 0) {
                select.innerHTML = '<option value="">Sin rutas cargadas</option>';
                return;
            }
            select.innerHTML = routesData.map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
        }

        function viewRouteOnMap(routeId) {
            switchTab('map');
            document.getElementById('mapRouteSelector').value = routeId;
            loadRouteMapDetails(routeId);
        }

        function loadRouteMapDetails(routeId) {
            const route = routesData.find(r => r.id === routeId);
            if (!route) return;

            resetMapZoom();
            toggleMapView('gmaps');
            document.getElementById('mainMapIframe').src = sanitizeMapUrl(route.mapUrl);

            const btnImg = document.getElementById('btnViewImage');
            if (route.imageUrl && route.imageUrl.trim() !== '') {
                btnImg.classList.remove('hidden');
                document.getElementById('routePlanImage').src = route.imageUrl;
            } else {
                btnImg.classList.add('hidden');
            }

            document.getElementById('routeDetailCards').innerHTML = `
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 space-y-0.5">
                    <span class="text-[10px] font-bold text-cyan-400 uppercase">Paradas</span>
                    <p class="text-xs text-slate-300">${(route.stops || []).map(s => escapeHtml(s)).join(', ') || 'N/A'}</p>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 space-y-0.5">
                    <span class="text-[10px] font-bold text-emerald-400 uppercase">POIs Urbanos</span>
                    <p class="text-xs text-slate-300">${(route.poisUrban || []).map(p => escapeHtml(p)).join(', ') || 'N/A'}</p>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 space-y-0.5">
                    <span class="text-[10px] font-bold text-purple-400 uppercase">POIs Foráneos</span>
                    <p class="text-xs text-slate-300">${(route.poisForeign || []).map(p => escapeHtml(p)).join(', ') || 'N/A'}</p>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 space-y-0.5">
                    <span class="text-[10px] font-bold text-amber-400 uppercase">Retornos</span>
                    <p class="text-xs text-slate-300">${(route.returnStops || []).map(r => escapeHtml(r)).join(', ') || 'N/A'}</p>
                </div>
            `;
        }

        function toggleMapView(type) {
            const frameWrapper = document.getElementById('mapTransformWrapper');
            const imgContainer = document.getElementById('imagePlanContainer');
            const btnGmaps = document.getElementById('btnViewGmaps');
            const btnImg = document.getElementById('btnViewImage');

            if (type === 'gmaps') {
                frameWrapper.classList.remove('hidden');
                imgContainer.classList.add('hidden');
                btnGmaps.className = "bg-cyan-600 text-white px-3 py-1 rounded font-bold";
                btnImg.className = "bg-slate-800 text-slate-400 px-3 py-1 rounded font-bold";
            } else {
                frameWrapper.classList.add('hidden');
                imgContainer.classList.remove('hidden');
                btnImg.className = "bg-cyan-600 text-white px-3 py-1 rounded font-bold";
                btnGmaps.className = "bg-slate-800 text-slate-400 px-3 py-1 rounded font-bold";
            }
        }

        function handleRouteSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editRouteId').value;
            const routeId = editId || 'route-' + Date.now();
            
            const newRoute = {
                id: routeId,
                name: document.getElementById('routeName').value.trim(),
                category: document.getElementById('routeCategory').value,
                mapUrl: document.getElementById('routeMapUrl').value.trim(),
                imageUrl: document.getElementById('routeImageUrl').value.trim(),
                stops: splitLines(document.getElementById('routeStops').value),
                returnStops: splitLines(document.getElementById('routeReturnStops').value),
                poisUrban: splitLines(document.getElementById('routePoisUrban').value),
                poisForeign: splitLines(document.getElementById('routePoisForeign').value)
            };

            if (editId) {
                const idx = routesData.findIndex(r => r.id === editId);
                if (idx !== -1) routesData[idx] = newRoute;
            } else {
                routesData.push(newRoute);
            }

            saveRoutesToLocalStorage();
            syncDataWithFirebase();
            renderExplorerView();
            updateMapSelector();
            closeModal('adminModal');
        }

        function editRoute(routeId) {
            const r = routesData.find(x => x.id === routeId);
            if (!r) return;

            document.getElementById('editRouteId').value = r.id;
            document.getElementById('routeName').value = r.name;
            document.getElementById('routeCategory').value = r.category;
            document.getElementById('routeMapUrl').value = r.mapUrl;
            document.getElementById('routeImageUrl').value = r.imageUrl || '';
            document.getElementById('routeStops').value = (r.stops || []).join(', ');
            document.getElementById('routeReturnStops').value = (r.returnStops || []).join(', ');
            document.getElementById('routePoisUrban').value = (r.poisUrban || []).join('\n');
            document.getElementById('routePoisForeign').value = (r.poisForeign || []).join('\n');

            openModal('adminModal');
        }

        function deleteRoute(routeId) {
            Swal.fire({
                title: '¿Eliminar Ruta?',
                text: 'Esta acción la eliminará localmente y en la base de datos.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Sí, eliminar'
            }).then(res => {
                if (res.isConfirmed) {
                    routesData = routesData.filter(r => r.id !== routeId);
                    saveRoutesToLocalStorage();

                    if (navigator.onLine) {
                        routesRef.set(routesData).then(() => {
                            renderExplorerView();
                            updateMapSelector();
                        });
                    } else {
                        renderExplorerView();
                        updateMapSelector();
                    }
                }
            });
        }

        function sanitizeMapUrl(raw) {
            if (!raw) return 'about:blank';
            if (raw.includes('<iframe')) {
                const match = raw.match(/src=["']([^"']+)["']/);
                if (match && match[1]) return match[1];
            }
            return raw.trim();
        }

        function splitLines(str) {
            return str ? str.split(/[\n,]+/).map(s => s.trim()).filter(Boolean) : [];
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '';
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden'); 
            document.getElementById('addRouteForm').reset();
            document.getElementById('editRouteId').value = '';
        }
    </script>
</body>
</html>
