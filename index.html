<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colectivos Tuxtla Pro</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        header { background: #1e293b; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-bottom: 5px; }
        .card p { color: #666; font-size: 14px; margin-bottom: 15px; }
        .btns { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-ver { background: #2563eb; color: white; }
        .btn-share { background: #25D366; color: white; }
        #map { height: 300px; width: 100%; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>🚌 Colectivos Tuxtla Pro</h1>
    </header>

    <div class="grid" id="app-container"></div>

    <script>
        const rutasBD = [
            { id: "ruta-108", nombre: "Ruta 108", desc: "Copoya - Centro - Hospitales", lat: 16.7527, lng: -93.1167 },
            { id: "ruta-1", nombre: "Ruta 1", desc: "Terán - Poliforum - Mactumactzá", lat: 16.7500, lng: -93.1100 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderizarApp();

            const urlParams = new URLSearchParams(window.location.search);
            const rutaParam = urlParams.get('ruta');

            if (rutaParam) {
                setTimeout(() => {
                    abrirModalRuta(rutaParam);
                }, 500);
            }
        });

        function renderizarApp() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            rutasBD.forEach(ruta => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${ruta.nombre}</h3>
                        <p>${ruta.desc}</p>
                        <div class="btns">
                            <button class="btn-ver" onclick="abrirModalRuta('${ruta.id}')">Ver Mapa</button>
                            <button class="btn-share" onclick="compartirWhatsApp('${ruta.id}', '${ruta.nombre}')">Compartir</button>
                        </div>
                    </div>
                `;
            });
        }

        function compartirWhatsApp(idRuta, nombreRuta) {
            const baseUrl = window.location.origin + window.location.pathname.replace("index.html", "");
            const shareUrl = `${baseUrl}rutas/${idRuta}.html`;
            const mensaje = `🚌 Mira el recorrido de la *${nombreRuta}*:\n${shareUrl}`;
            
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function abrirModalRuta(idRuta) {
            const ruta = rutasBD.find(r => r.id === idRuta);
            if (!ruta) return;

            Swal.fire({
                title: ruta.nombre,
                html: `<p>${ruta.desc}</p><div id="map"></div>`,
                width: '600px',
                didOpen: () => {
                    const map = L.map('map').setView([ruta.lat, ruta.lng], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    L.marker([ruta.lat, ruta.lng]).addTo(map)
                        .bindPopup(`<b>${ruta.nombre}</b>`)
                        .openPopup();
                }
            });
        }
    </script>
</body>
</html>
