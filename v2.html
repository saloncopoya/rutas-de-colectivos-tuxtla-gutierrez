<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Rutas Tuxtla Gutiérrez - Registro y visualización de rutas de transporte público">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rutas Tuxtla Gutiérrez</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- idb -->
  <script src="https://cdn.jsdelivr.net/npm/idb@8.0.0/build/umd.js"></script>

  <style>
    /* ============ VARIABLES ============ */
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.15);
      --radius: 12px;
      --radius-sm: 8px;
      --header-h: 56px;
      --panel-collapsed: 0px;
      --sheet-h: 75vh;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ============ RESET ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; font-size: 14px; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ============ HEADER ============ */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      box-shadow: var(--shadow);
    }
    #header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
    }
    #header .brand svg { color: var(--primary); flex-shrink: 0; }
    #connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      background: var(--surface-2);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 2px rgba(22,163,74,.2);
    }
    .status-dot.offline { background: var(--danger); box-shadow: 0 0 0 2px rgba(220,38,38,.2); }

    /* ============ MAP ============ */
    #map {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      z-index: 1;
      background: #e5e7eb;
    }
    .leaflet-control-attribution {
      font-size: 9px !important;
      background: rgba(255,255,255,.7) !important;
      padding: 1px 4px !important;
    }

    /* ============ MAP SEARCH ============ */
    #map-search {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 500;
      width: 280px;
      max-width: calc(100% - 24px);
    }
    #map-search .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #map-search input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 14px;
      font-size: 14px;
      background: transparent;
      min-width: 0;
    }
    #map-search .search-btn {
      padding: 12px 14px;
      color: var(--primary);
      display: flex;
      align-items: center;
    }
    #search-results {
      margin-top: 6px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      border: 1px solid var(--border);
    }
    #search-results.show { display: block; }
    #search-results .sr-item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #search-results .sr-item:last-child { border-bottom: none; }
    #search-results .sr-item:hover { background: var(--primary-light); }
    #search-results .sr-item .sr-icon { color: var(--primary); flex-shrink: 0; margin-top: 1px; }

    /* ============ BUTTONS ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      transition: all .15s;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-pill {
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      box-shadow: var(--shadow);
    }
    .btn-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-pill.warn.active { background: var(--warning); border-color: var(--warning); }

    /* ============ FAB ============ */
    #fab {
      position: absolute;
      right: 16px;
      bottom: 90px;
      z-index: 500;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--success);
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(22,163,74,.4);
      transition: transform .2s, box-shadow .2s;
    }
    #fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(22,163,74,.5); }
    #fab:active { transform: scale(.95); }
    #fab .tooltip {
      position: absolute;
      right: 64px;
      background: var(--text);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    #fab:hover .tooltip { opacity: 1; }

    /* ============ EDIT TOOLBAR ============ */
    #edit-toolbar {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      z-index: 600;
      display: none;
      gap: 6px;
      padding: 8px;
      background: var(--surface);
      border-radius: 30px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      max-width: calc(100% - 24px);
      overflow-x: auto;
      opacity: 0;
      transition: opacity .25s, transform .25s;
    }
    #edit-toolbar.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
    #edit-toolbar .btn-pill { box-shadow: none; flex-shrink: 0; }

    /* ============ RECORDING BAR ============ */
    #recording-bar {
      position: absolute;
      top: calc(var(--header-h) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      z-index: 700;
      display: none;
      align-items: center;
      gap: 12px;
      background: var(--danger);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 16px rgba(220,38,38,.4);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .25s, transform .25s;
    }
    #recording-bar.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
    #recording-bar .pulse {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.4); }
    }
    #recording-bar button {
      background: rgba(255,255,255,.2);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    #recording-bar button:hover { background: rgba(255,255,255,.35); }

    /* ============ PANEL ============ */
    #panel {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      height: 60vh;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.12);
      z-index: 800;
      display: flex;
      flex-direction: column;
      transform: translateY(0);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      touch-action: none;
      will-change: transform;
      overscroll-behavior: contain;
    }
    #panel.collapsed { transform: translateY(calc(100% - 56px)); }
    #panel.full { height: 92vh; }
    #panel-handle {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 6px;
      cursor: grab;
      flex-shrink: 0;
      touch-action: none;
    }
    #panel-handle:active { cursor: grabbing; }
    #panel-handle .bar {
      width: 40px; height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
    }
    #panel-handle .chevron {
      margin-top: 2px;
      color: var(--text-3);
      transition: transform .3s;
    }
    #panel.collapsed #panel-handle .chevron { transform: rotate(180deg); }

    #panel-tabs {
      display: flex;
      gap: 4px;
      padding: 0 12px 8px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #panel-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      white-space: nowrap;
      transition: all .15s;
      flex-shrink: 0;
    }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .tab-btn:not(.active):hover { background: var(--surface-2); }

    #panel-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 12px 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* ============ ROUTE CARDS ============ */
    .route-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      transition: all .15s;
      cursor: pointer;
    }
    .route-card:hover { border-color: var(--primary); }
    .route-card.selected { background: var(--primary-light); border-color: var(--primary); }
    .route-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .route-card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .route-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .badge-ida { background: #dbeafe; color: #1d4ed8; }
    .badge-vuelta { background: #dcfce7; color: #15803d; }
    .badge-circular { background: #fef3c7; color: #b45309; }
    .route-card-desc {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .route-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    .route-card-meta span { display: flex; align-items: center; gap: 3px; }
    .route-card-actions {
      display: flex;
      gap: 6px;
    }
    .route-card-actions button {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      transition: all .15s;
    }
    .btn-view { background: var(--primary); color: #fff; }
    .btn-view:hover { background: var(--primary-dark); }
    .btn-edit { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
    .btn-edit:hover { background: var(--border); }
    .btn-del { background: var(--surface); color: var(--danger); border: 1px solid var(--border); flex: 0 0 36px !important; }
    .btn-del:hover { background: #fee2e2; }

    /* Route grid (4 columns) */
    #routes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 900px) {
      #routes-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      #routes-grid { grid-template-columns: 1fr; }
    }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-3);
    }
    .empty-state svg { margin-bottom: 12px; opacity: .5; }
    .empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
    .empty-state p { font-size: 13px; }

    /* ============ SEARCH TRIP ============ */
    .search-instructions {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
      color: #1e40af;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .search-point-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    .point-letter {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }
    .point-letter.a { background: var(--success); }
    .point-letter.b { background: var(--danger); }
    .point-letter.c { background: var(--warning); }
    .search-point-info { flex: 1; min-width: 0; }
    .search-point-info .coords {
      font-size: 11px;
      color: var(--text-3);
      font-family: monospace;
    }
    .search-point-info .street {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slider-container {
      margin: 12px 0;
    }
    .slider-container label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .slider-container input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
    }
    .slider-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .result-group { margin-bottom: 16px; }
    .result-group-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-group-title.green { color: var(--success); }
    .result-group-title.amber { color: var(--warning); }
    .result-group-title.blue { color: var(--primary); }

    /* ============ POI LIST ============ */
    .poi-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      cursor: pointer;
      transition: all .15s;
    }
    .poi-item:hover { border-color: var(--primary); }
    .poi-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: var(--surface);
      border: 2px solid var(--primary);
    }
    .poi-info { flex: 1; min-width: 0; }
    .poi-info .poi-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .poi-info .poi-route { font-size: 11px; color: var(--text-3); }

    /* ============ SHEET ============ */
    #sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.4);
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    #sheet-overlay.show { opacity: 1; pointer-events: auto; }

    #sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--sheet-h);
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.32,.72,0,1);
      touch-action: none;
      will-change: transform;
      box-shadow: 0 -8px 40px rgba(0,0,0,.2);
    }
    #sheet.show { transform: translateY(0); }

    #sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      flex-shrink: 0;
      position: relative;
    }
    #sheet-drag-handle {
      position: absolute;
      top: 6px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
      cursor: grab;
    }
    #sheet-title { font-size: 16px; font-weight: 700; }
    #sheet-header-actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      transition: background .15s;
    }
    .icon-btn:hover { background: var(--surface-2); }

    #sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    #sheet-footer {
      padding: 12px 16px calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: var(--surface);
    }
    #sheet-footer .btn { flex: 1; }
    #sheet-footer .btn-primary { flex: 1.5; }

    /* ============ ACCORDION ============ */
    .accordion {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      background: var(--surface-2);
      user-select: none;
      transition: background .15s;
    }
    .accordion-header:hover { background: var(--border); }
    .accordion-header .acc-title { display: flex; align-items: center; gap: 8px; }
    .accordion-header .acc-chevron {
      transition: transform .25s;
      color: var(--text-3);
    }
    .accordion.open .accordion-header .acc-chevron { transform: rotate(180deg); }
    .accordion-body {
      display: none;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    .accordion.open .accordion-body { display: block; }

    /* ============ FORM ============ */
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .form-group input[type="text"],
    .form-group input[type="time"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      background: var(--surface);
      outline: none;
      transition: border-color .15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Color chips */
    .color-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color-chip {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }
    .color-chip:hover { transform: scale(1.1); }
    .color-chip.selected { border-color: var(--text); transform: scale(1.1); }

    /* Points list */
    .points-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px;
      background: var(--surface-2);
    }
    .point-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .point-item:last-child { border-bottom: none; }
    .point-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .point-coords { color: var(--text-3); font-family: monospace; font-size: 10px; }

    /* Progress bar */
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
      display: none;
    }
    .progress-bar.show { display: block; }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width .3s;
      width: 0%;
    }
    .progress-text {
      font-size: 11px;
      color: var(--text-2);
      text-align: center;
      margin-bottom: 6px;
      display: none;
    }
    .progress-text.show { display: block; }

    /* Street items */
    .street-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 4px;
      font-size: 12px;
    }
    .street-num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .street-info { flex: 1; min-width: 0; }
    .street-info .street-name { font-weight: 600; color: var(--text); }
    .street-info .street-colonia { font-size: 10px; color: var(--text-3); }
    .street-actions { display: flex; gap: 2px; }
    .street-actions button {
      width: 24px; height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-2);
    }
    .street-actions button:hover { background: var(--border); }

    /* Image upload */
    .image-upload {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      color: var(--text-3);
    }
    .image-upload:hover { border-color: var(--primary); background: var(--primary-light); }
    .image-upload svg { margin-bottom: 8px; }
    .image-upload p { font-size: 13px; }
    .image-preview {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }
    .image-preview.show { display: block; }
    .image-preview img { width: 100%; display: block; max-height: 200px; object-fit: cover; }
    .image-preview .remove-img {
      position: absolute;
      top: 8px; right: 8px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,.6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* ============ TOAST ============ */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      box-shadow: var(--shadow-lg);
      max-width: calc(100% - 32px);
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============ DRIVER MODE ============ */
    #driver-panel {
      position: fixed;
      inset: 0;
      background: var(--surface);
      z-index: 1500;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }
    #driver-panel.show { display: flex; }
    #driver-panel .driver-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }
    #driver-panel .driver-header h2 { font-size: 18px; font-weight: 700; }
    #driver-panel .driver-body { padding: 16px; flex: 1; }
    #driver-panel .driver-body .form-group { margin-bottom: 16px; }
    #driver-panel .driver-body .form-group label { font-size: 13px; margin-bottom: 6px; }
    #driver-panel .driver-body input,
    #driver-panel .driver-body select {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 16px;
    }
    #driver-panel .driver-actions {
      padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #driver-panel .driver-actions .btn { width: 100%; padding: 16px; font-size: 16px; }
    .driver-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .driver-status-badge.active { background: #dcfce7; color: #15803d; }
    .driver-status-badge.inactive { background: #fee2e2; color: #b91c1c; }

    /* ============ ROUTE INFO TAB ============ */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .info-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
    }
    .info-item .info-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
    .info-item .info-value { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 2px; }

    /* ============ MAP CONTROLS TOGGLE ============ */
    #map-controls-toggle {
      position: absolute;
      bottom: 20px;
      right: 16px;
      z-index: 500;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      border: 1px solid var(--border);
      font-size: 18px;
    }
    #map-controls-toggle:hover { background: var(--surface-2); }

    /* ============ DESKTOP ============ */
    @media (min-width: 900px) {
      #panel {
        left: 0; top: var(--header-h);
        right: auto; bottom: 0;
        width: 400px;
        height: auto;
        border-radius: 0;
        box-shadow: 2px 0 12px rgba(0,0,0,.06);
        transform: none !important;
      }
      #panel.collapsed { transform: none !important; width: 56px; }
      #panel.collapsed #panel-content,
      #panel.collapsed #panel-tabs { display: none; }
      #panel.full { height: auto; }

      #map { left: 400px; top: var(--header-h); }
      body.panel-collapsed #map { left: 56px; }

      #fab { bottom: 24px; right: 24px; }
      #edit-toolbar { bottom: 24px; left: calc(50% + 200px); }

      #sheet {
        left: auto; right: 0; top: var(--header-h); bottom: 0;
        width: 420px;
        height: auto;
        border-radius: 0;
        transform: translateX(100%);
        box-shadow: -4px 0 24px rgba(0,0,0,.1);
      }
      #sheet.show { transform: translateX(0); }
      #sheet-drag-handle { display: none; }

      #toast { bottom: 30px; }

      #map-search { width: 320px; }
    }

    /* Hide recording bar on top of sheet */
    #sheet.show ~ #recording-bar { display: none; }

    /* ============ ANIMATIONS ============ */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .fade-in { animation: fadeIn .3s; }

    /* ============ SPINNER ============ */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(37,99,235,.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ DRIVER TOGGLE BUTTON ============ */
    #driver-toggle-btn {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: var(--text);
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .2s;
    }
    #driver-toggle-btn:hover { background: #1e293b; transform: translateX(-50%) scale(1.05); }
    @media (min-width: 900px) {
      #driver-toggle-btn { left: calc(50% + 200px); bottom: 80px; }
    }
  </style>
</head>
<body>

  <!-- ============ DRIVER PANEL ============ -->
  <div id="driver-panel">

  <!-- ============ SERVICE WORKER REGISTRATION ============ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>

  <!-- ============ MAIN APP ============ -->
  <script type="module">
    // ============================================================
    // GLOBAL STATE
    // ============================================================
    const state = {
      map: null,
      routes: [],
      pois: [],
      selectedRoute: null,
      editingRoute: null,
      isEditing: false,
      editTool: 'draw',
      editPoints: [],
      editStreets: [],
      editPois: [],
      editColor: '#2563eb',
      editPolyline: null,
      editMarkers: [],
      editPoiMarkers: [],
      gpsWatchId: null,
      gpsPoints: [],
      isRecording: false,
      searchPoints: [],
      searchRadius: 500,
      searchResults: [],
      searchMarkers: [],
      searchCircles: [],
      searchPolylines: [],
      routeLayers: [],
      activeTab: 'routes',
      routesGridMode: 'hidden', // hidden | all | selected
      drivers: {},
      driverWatchId: null,
      driverInterval: null,
      driverInfo: null,
      mapControlsVisible: true,
      geocodeCache: new Map(),
      lastGeocodeTime: 0,
      baseLayers: {},
      layerControl: null,
      routeSearchFilter: '',
      streetDetectionRunning: false,
      detectedStreets: [],
      detectedPois: []
    };

    const COLORS = ['#2563eb', '#16a34a', '#dc2626', '#f59e0b', '#8b5cf6', '#06b6d4', '#ec4899', '#f97316'];
    const TUXTLA_CENTER = [16.7538, -93.1156];
    const FIREBASE_URL = 'https://galloslivebadge-default-rtdb.firebaseio.com';
    const CLOUDINARY_CLOUD = 'dxjgyqcby';
    const CLOUDINARY_PRESET = 'sinfirmaupload';

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimer = null;
    function toast(msg, duration = 2500) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // ============================================================
    // INDEXEDDB
    // ============================================================
    let db = null;
    async function initDB() {
      db = await idb.openDB('rutas-tuxtla-db', 2, {
        upgrade(db) {
          if (!db.objectStoreNames.contains('rutas')) {
            db.createObjectStore('rutas', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('pois')) {
            db.createObjectStore('pois', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('sync-queue')) {
            db.createObjectStore('sync-queue', { autoIncrement: true });
          }
        }
      });
    }

    async function saveRoute(route) {
      await db.put('rutas', route);
      for (const poi of (route.pois || [])) {
        await db.put('pois', { ...poi, routeId: route.id });
      }
    }
    async function getRoutes() {
      return await db.getAll('rutas');
    }
    async function deleteRoute(id) {
      await db.delete('rutas', id);
      const allPois = await db.getAll('pois');
      for (const p of allPois) {
        if (p.routeId === id) await db.delete('pois', p.id);
      }
    }
    async function savePoi(poi) { await db.put('pois', poi); }
    async function getPois() { return await db.getAll('pois'); }

    // ============================================================
    // FIREBASE
    // ============================================================
    async function syncRouteToFirebase(route) {
      if (!navigator.onLine) return false;
      try {
        const res = await fetch(`${FIREBASE_URL}/rutas/${route.id}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...route, updatedAt: Date.now() })
        });
        return res.ok;
      } catch { return false; }
    }

    async function deleteRouteFromFirebase(id) {
      if (!navigator.onLine) return false;
      try {
        const res = await fetch(`${FIREBASE_URL}/rutas/${id}.json`, { method: 'DELETE' });
        return res.ok;
      } catch { return false; }
    }

    async function loadRoutesFromFirebase() {
      if (!navigator.onLine) return [];
      try {
        const res = await fetch(`${FIREBASE_URL}/rutas.json`);
        if (!res.ok) return [];
        const data = await res.json();
        if (!data) return [];
        return Object.entries(data).map(([id, r]) => ({ ...r, id }));
      } catch { return []; }
    }

    // ============================================================
    // DRIVER LOCATION SYNC
    // ============================================================
    async function syncDriverLocation(info, lat, lng) {
      if (!navigator.onLine) return;
      try {
        await fetch(`${FIREBASE_URL}/drivers/${info.routeId}_${info.unit}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...info,
            lat, lng,
            timestamp: Date.now(),
            updatedAt: Date.now()
          })
        });
      } catch {}
    }

    async function clearDriverLocation(info) {
      if (!navigator.onLine) return;
      try {
        await fetch(`${FIREBASE_URL}/drivers/${info.routeId}_${info.unit}.json`, { method: 'DELETE' });
      } catch {}
    }

    async function loadDrivers() {
      if (!navigator.onLine) return {};
      try {
        const res = await fetch(`${FIREBASE_URL}/drivers.json`);
        if (!res.ok) return {};
        return await res.json() || {};
      } catch { return {}; }
    }

    // ============================================================
    // CLOUDINARY
    // ============================================================
    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
        method: 'POST',
        body: formData
      });
      if (!res.ok) throw new Error('Error al subir imagen');
      const data = await res.json();
      return data.secure_url;
    }

    // ============================================================
    // NOMINATIM
    // ============================================================
    async function reverseGeocode(lat, lng) {
      const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;
      if (state.geocodeCache.has(key)) return state.geocodeCache.get(key);
      const now = Date.now();
      const wait = Math.max(0, 1100 - (now - state.lastGeocodeTime));
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      state.lastGeocodeTime = Date.now();
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1&accept-language=es`,
          { headers: { 'User-Agent': 'RutasTuxtlaApp/1.0' } }
        );
        const data = await res.json();
        state.geocodeCache.set(key, data);
        return data;
      } catch { return null; }
    }

    async function searchNominatim(q) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&addressdetails=1&limit=8&accept-language=es&countrycodes=mx`,
          { headers: { 'User-Agent': 'RutasTuxtlaApp/1.0' } }
        );
        return await res.json();
      } catch { return []; }
    }

    function extractStreetName(address) {
      if (!address) return null;
      return address.road || address.pedestrian || address.footway || address.path ||
             address.neighbourhood || address.suburb || address.city_district || null;
    }

    function extractColonia(address) {
      if (!address) return '';
      return address.neighbourhood || address.suburb || address.colonia || address.city_district || '';
    }

    // ============================================================
    // GEOMETRY
    // ============================================================
    function calculateDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1;
      const lenSq = dx*dx + dy*dy;
      let t = 0;
      if (lenSq > 0) {
        t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
      }
      const projX = x1 + t * dx, projY = y1 + t * dy;
      return calculateDistance(px, py, projX, projY);
    }

    function pointToLineDistance(px, py, coords) {
      let min = Infinity;
      for (let i = 0; i < coords.length - 1; i++) {
        const d = pointToSegmentDistance(px, py, coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
        if (d < min) min = d;
      }
      return min;
    }

    // ============================================================
    // MAP INIT
    // ============================================================
    function initMap() {
      const map = L.map('map', {
        center: TUXTLA_CENTER,
        zoom: 13,
        zoomControl: false,
        attributionControl: true,
        preferCanvas: true
      });
      state.map = map;

      state.baseLayers = {
        'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }),
        'OSM HOT': L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors, HOT'
        })
      };

      state.baseLayers['OpenStreetMap'].addTo(map);

      // Attribution mini
      map.attributionControl.setPrefix('');

      // Geolocation
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => { map.setView([pos.coords.latitude, pos.coords.longitude], 15); },
          () => {}
        );
      }

      // Layer control bottom right
      state.layerControl = L.control.layers(state.baseLayers, {}, { position: 'bottomright' }).addTo(map);
      state.layerControl.addTo(map);

      // Zoom control
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Map click handler
      map.on('click', handleMapClick);
    }

    function toggleMapControls() {
      state.mapControlsVisible = !state.mapControlsVisible;
      if (state.mapControlsVisible) {
        document.querySelector('.leaflet-control-zoom')?.style.setProperty('display', 'block');
        document.querySelector('.leaflet-control-layers')?.style.setProperty('display', 'block');
      } else {
        document.querySelector('.leaflet-control-zoom')?.style.setProperty('display', 'none');
        document.querySelector('.leaflet-control-layers')?.style.setProperty('display', 'none');
      }
    }

    // ============================================================
    // MAP CLICK
    // ============================================================
    async function handleMapClick(e) {
      const { lat, lng } = e.latlng;

      // Search trip mode
      if (state.activeTab === 'trip' && !state.isEditing) {
        if (state.searchPoints.length >= 3) {
          toast('Máximo 3 puntos de búsqueda');
          return;
        }
        const letter = ['A', 'B', 'C'][state.searchPoints.length];
        const color = { A: '#16a34a', B: '#dc2626', C: '#f59e0b' }[letter];
        state.searchPoints.push({ lat, lng, letter, color });
        addSearchPointMarker({ lat, lng, letter, color });
        updateSearchRadiusCircles();
        // Get street name
        const geo = await reverseGeocode(lat, lng);
        const street = extractStreetName(geo?.address) || 'Calle desconocida';
        state.searchPoints[state.searchPoints.length - 1].street = street;
        renderPanel();
        return;
      }

      if (!state.isEditing) return;

      if (state.editTool === 'draw') {
        await addEditPoint(lat, lng);
      } else if (state.editTool === 'poi') {
        await addEditPoi(lat, lng);
      }
    }

    async function addEditPoint(lat, lng) {
      // Reverse geocode for street name
      const geo = await reverseGeocode(lat, lng);
      const streetName = extractStreetName(geo?.address) || 'Calle desconocida';
      const colonia = extractColonia(geo?.address);

      state.editPoints.push({
        lat, lng,
        type: 'manual',
        street: streetName,
        colonia,
        timestamp: Date.now()
      });

      drawEditRoute();
      renderSheet();
      toast(`Punto ${state.editPoints.length} agregado`);
    }

    async function addEditPoi(lat, lng) {
      // Offset slightly to the side
      const offsetLat = lat + 0.00015;
      const offsetLng = lng + 0.00015;

      const geo = await reverseGeocode(offsetLat, offsetLng);
      const addr = geo?.address || {};
      let nombre = addr.shop || addr.amenity || addr.tourism || addr.leisure || addr.building || 'Punto de interés';
      let tipo = 'business';
      let icono = '🏪';

      if (addr.shop) { tipo = 'business'; icono = '🏪'; }
      else if (addr.amenity === 'restaurant' || addr.amenity === 'cafe') { tipo = 'business'; icono = '🍽️'; }
      else if (addr.amenity === 'pharmacy') { tipo = 'business'; icono = '💊'; }
      else if (addr.amenity === 'bank') { tipo = 'business'; icono = '🏦'; }
      else if (addr.amenity === 'hospital') { tipo = 'business'; icono = '🏥'; }
      else if (addr.amenity === 'school') { tipo = 'business'; icono = '🏫'; }
      else if (addr.tourism) { tipo = 'business'; icono = '📷'; }
      else if (addr.leisure) { tipo = 'business'; icono = '⚽'; }

      const poi = {
        id: 'poi_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        lat: offsetLat,
        lng: offsetLng,
        nombre,
        tipo,
        icono,
        descripcion: geo?.display_name || '',
        colonia: extractColonia(addr),
        timestamp: Date.now()
      };

      state.editPois.push(poi);
      drawEditPois();
      renderSheet();
      toast(`POI agregado: ${nombre}`);
    }

    // ============================================================
    // EDIT ROUTE DRAWING
    // ============================================================
    function drawEditRoute() {
      // Remove old polyline
      if (state.editPolyline) {
        state.map.removeLayer(state.editPolyline);
        state.editPolyline = null;
      }
      state.editMarkers.forEach(m => state.map.removeLayer(m));
      state.editMarkers = [];

      const coords = state.editPoints.map(p => [p.lat, p.lng]);
      if (coords.length >= 2) {
        state.editPolyline = L.polyline(coords, {
          color: state.editColor,
          weight: 5,
          opacity: 0.9,
          lineJoin: 'round',
          dashArray: state.isRecording ? '8,8' : null
        }).addTo(state.map);
      }

      state.editPoints.forEach((p, i) => {
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 7,
          color: '#fff',
          weight: 2,
          fillColor: '#dc2626',
          fillOpacity: 1
        }).addTo(state.map);
        marker.bindPopup(`<b>Punto ${i + 1}</b><br>${p.street || ''}`);
        marker.on('click', () => {
          if (confirm(`¿Eliminar punto ${i + 1}?`)) {
            state.editPoints.splice(i, 1);
            drawEditRoute();
            renderSheet();
          }
        });
        state.editMarkers.push(marker);
      });
    }

    function drawEditPois() {
      state.editPoiMarkers.forEach(m => state.map.removeLayer(m));
      state.editPoiMarkers = [];

      state.editPois.forEach((poi, i) => {
        const icon = L.divIcon({
          className: 'poi-marker',
          html: `<div style="width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #2563eb;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:grab;">${poi.icono || '🏪'}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        const marker = L.marker([poi.lat, poi.lng], { icon, draggable: true }).addTo(state.map);
        marker.bindPopup(`<b>${poi.nombre}</b><br>${poi.descripcion || ''}`);
        marker.on('dragend', (e) => {
          const pos = e.target.getLatLng();
          poi.lat = pos.lat;
          poi.lng = pos.lng;
        });
        marker.on('click', () => {
          const newName = prompt('Nombre del punto:', poi.nombre);
          if (newName) {
            poi.nombre = newName;
            drawEditPois();
            renderSheet();
          }
        });
        state.editPoiMarkers.push(marker);
      });
    }

    // ============================================================
    // GPS RECORDING
    // ============================================================
    function startGpsRecording() {
      if (!navigator.geolocation) {
        toast('GPS no disponible');
        return;
      }
      if (state.isRecording) return;

      state.isRecording = true;
      state.gpsPoints = [];

      const bar = document.getElementById('recording-bar');
      bar.classList.add('show');
      document.getElementById('recording-text').textContent = 'Grabando... 0 pts';

      state.gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          state.editPoints.push({
            lat: latitude,
            lng: longitude,
            type: 'gps',
            accuracy,
            timestamp: Date.now()
          });
          state.gpsPoints.push({ lat: latitude, lng: longitude });
          document.getElementById('recording-text').textContent = `Grabando... ${state.gpsPoints.length} pts`;
          state.map.setView([latitude, longitude], 16);
          drawEditRoute();
        },
        (err) => {
          console.error(err);
          toast('Error de GPS: ' + err.message);
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
      );
    }

    function stopGpsRecording() {
      if (state.gpsWatchId !== null) {
        navigator.geolocation.clearWatch(state.gpsWatchId);
        state.gpsWatchId = null;
      }
      state.isRecording = false;
      document.getElementById('recording-bar').classList.remove('show');
      toast(`Grabación detenida. ${state.gpsPoints.length} puntos capturados.`);
      renderSheet();
    }

    // ============================================================
    // STREET DETECTION
    // ============================================================
    async function detectStreets() {
      if (state.editPoints.length < 2) {
        toast('Agrega al menos 2 puntos a la ruta');
        return;
      }
      if (state.streetDetectionRunning) return;
      state.streetDetectionRunning = true;

      const total = Math.min(12, state.editPoints.length);
      const step = Math.max(1, Math.floor(state.editPoints.length / total));
      const samples = [];
      for (let i = 0; i < state.editPoints.length && samples.length < total; i += step) {
        samples.push(state.editPoints[i]);
      }
      if (samples[samples.length - 1] !== state.editPoints[state.editPoints.length - 1]) {
        samples.push(state.editPoints[state.editPoints.length - 1]);
      }

      const progressBar = document.querySelector('.progress-bar');
      const progressFill = document.querySelector('.progress-bar-fill');
      const progressText = document.querySelector('.progress-text');
      if (progressBar) progressBar.classList.add('show');
      if (progressText) progressText.classList.add('show');

      const seen = new Set();
      const streets = [];

      for (let i = 0; i < samples.length; i++) {
        if (progressText) progressText.textContent = `Detectando calles... ${i + 1}/${samples.length}`;
        if (progressFill) progressFill.style.width = `${((i + 1) / samples.length) * 100}%`;

        const geo = await reverseGeocode(samples[i].lat, samples[i].lng);
        const addr = geo?.address || {};
        const name = extractStreetName(addr);
        if (name && !seen.has(name)) {
          seen.add(name);
          streets.push({
            id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            nombre: name,
            lat: samples[i].lat,
            lng: samples[i].lng,
            colonia: extractColonia(addr),
            ciudad: addr.city || 'Tuxtla Gutiérrez',
            orden: streets.length + 1,
            direccion: geo.display_name || ''
          });
        }
      }

      state.editStreets = streets;
      state.detectedStreets = streets;
      state.streetDetectionRunning = false;

      setTimeout(() => {
        if (progressBar) progressBar.classList.remove('show');
        if (progressText) progressText.classList.remove('show');
        if (progressFill) progressFill.style.width = '0%';
      }, 1000);

      renderSheet();
      toast(`${streets.length} calles detectadas`);
    }

    // ============================================================
    // BUSINESS DETECTION
    // ============================================================
    async function detectBusinesses() {
      if (state.editPoints.length === 0) {
        toast('Agrega puntos a la ruta primero');
        return;
      }

      const total = Math.min(8, state.editPoints.length);
      const step = Math.max(1, Math.floor(state.editPoints.length / total));
      const samples = [];
      for (let i = 0; i < state.editPoints.length && samples.length < total; i += step) {
        samples.push(state.editPoints[i]);
      }

      const found = [];
      for (const sample of samples) {
        const geo = await reverseGeocode(sample.lat, sample.lng);
        const addr = geo?.address || {};
        const amenity = addr.amenity || addr.shop || addr.tourism || addr.leisure;
        if (amenity) {
          let icono = '🏪';
          if (addr.shop) icono = '🏪';
          else if (addr.amenity === 'restaurant' || addr.amenity === 'cafe') icono = '🍽️';
          else if (addr.amenity === 'pharmacy') icono = '💊';
          else if (addr.amenity === 'bank') icono = '🏦';
          else if (addr.amenity === 'hospital') icono = '🏥';
          else if (addr.amenity === 'school') icono = '🏫';
          else if (addr.tourism) icono = '📷';
          else if (addr.leisure) icono = '⚽';

          found.push({
            id: 'poi_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            lat: sample.lat + 0.0001,
            lng: sample.lng + 0.0001,
            nombre: amenity,
            tipo: 'business',
            icono,
            descripcion: geo.display_name || '',
            colonia: extractColonia(addr),
            timestamp: Date.now()
          });
        }
      }

      if (found.length > 0) {
        state.editPois.push(...found);
        drawEditPois();
        renderSheet();
        toast(`${found.length} negocios detectados`);
      } else {
        toast('No se encontraron negocios cercanos');
      }
    }

    // ============================================================
    // SEARCH TRIP
    // ============================================================
    function addSearchPointMarker(point) {
      const { lat, lng, letter, color } = point;
      const icon = L.divIcon({
        className: 'search-point-marker',
        html: `<div style="width:32px;height:32px;border-radius:50%;background:${color};border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);">${letter}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
      const marker = L.marker([lat, lng], { icon }).addTo(state.map);
      marker.bindPopup(`Punto ${letter}: ${point.street || ''}`);
      state.searchMarkers.push(marker);
    }

    function updateSearchRadiusCircles() {
      state.searchCircles.forEach(c => state.map.removeLayer(c));
      state.searchCircles = [];

      state.searchPoints.forEach(p => {
        const circle = L.circle([p.lat, p.lng], {
          radius: state.searchRadius,
          color: p.color,
          weight: 2,
          dashArray: '6,6',
          fillColor: p.color,
          fillOpacity: 0.08
        }).addTo(state.map);
        state.searchCircles.push(circle);
      });
    }

    function clearSearchPoints() {
      state.searchMarkers.forEach(m => state.map.removeLayer(m));
      state.searchCircles.forEach(c => state.map.removeLayer(c));
      state.searchPolylines.forEach(p => state.map.removeLayer(p));
      state.searchMarkers = [];
      state.searchCircles = [];
      state.searchPolylines = [];
      state.searchPoints = [];
      state.searchResults = [];
      renderPanel();
    }

    function findRoutesNearPoint(lat, lng, radius) {
      const results = [];
      for (const route of state.routes) {
        if (!route.puntos || route.puntos.length < 2) continue;
        const coords = route.puntos.map(p => [p.lat, p.lng]);
        const dist = pointToLineDistance(lat, lng, coords);
        if (dist <= radius) {
          results.push({ route, distance: dist });
        }
      }
      return results.sort((a, b) => a.distance - b.distance);
    }

    function searchTrip() {
      if (state.searchPoints.length === 0) {
        toast('Agrega al menos 1 punto de búsqueda');
        return;
      }

      state.searchPolylines.forEach(p => state.map.removeLayer(p));
      state.searchPolylines = [];
      state.searchResults = [];

      const radius = state.searchRadius;
      const pointResults = state.searchPoints.map(sp =>
        findRoutesNearPoint(sp.lat, sp.lng, radius)
      );

      // Routes that pass all points
      const allRouteIds = new Set(state.routes.map(r => r.id));
      const passingAll = [];
      const passing2Plus = [];
      const passing1 = [];

      for (const routeId of allRouteIds) {
        let count = 0;
        for (const pr of pointResults) {
          if (pr.some(r => r.route.id === routeId)) count++;
        }
        const route = state.routes.find(r => r.id === routeId);
        if (count === state.searchPoints.length) passingAll.push(route);
        else if (count >= 2) passing2Plus.push(route);
        else if (count === 1) passing1.push(route);
      }

      // Transfers
      const transfers = [];
      if (state.searchPoints.length >= 2 && passingAll.length === 0) {
        for (let i = 0; i < state.searchPoints.length - 1; i++) {
          const fromPoint = state.searchPoints[i];
          const toPoint = state.searchPoints[i + 1];
          const fromRoutes = findRoutesNearPoint(fromPoint.lat, fromPoint.lng, radius);
          const toRoutes = findRoutesNearPoint(toPoint.lat, toPoint.lng, radius);
          for (const fr of fromRoutes) {
            for (const tr of toRoutes) {
              if (fr.route.id !== tr.route.id) {
                // Find intersection point
                const intersection = findRouteIntersection(fr.route, tr.route);
                if (intersection) {
                  transfers.push({
                    from: fr.route,
                    to: tr.route,
                    intersection,
                    fromPoint,
                    toPoint
                  });
                }
              }
            }
          }
        }
      }

      state.searchResults = { passingAll, passing2Plus, passing1, transfers };

      // Draw routes
      passingAll.forEach(route => drawRouteOnMap(route, '#16a34a', true));
      passing2Plus.forEach(route => drawRouteOnMap(route, '#f59e0b', true));
      transfers.forEach(t => {
        drawRouteOnMap(t.from, '#2563eb', true);
        drawRouteOnMap(t.to, '#2563eb', true);
        if (t.intersection) {
          L.circleMarker([t.intersection.lat, t.intersection.lng], {
            radius: 10,
            color: '#fff',
            weight: 3,
            fillColor: '#f59e0b',
            fillOpacity: 1
          }).addTo(state.map).bindPopup(`Transbordo: ${t.from.nombre} → ${t.to.nombre}`);
        }
      });

      renderPanel();

      if (passingAll.length + passing2Plus.length + passing1.length + transfers.length === 0) {
        toast('No se encontraron rutas cercanas. Intenta ampliar el radio.');
      } else {
        toast(`Se encontraron ${passingAll.length + passing2Plus.length + passing1.length} rutas`);
      }
    }

    function findRouteIntersection(route1, route2) {
      const coords1 = route1.puntos.map(p => [p.lat, p.lng]);
      const coords2 = route2.puntos.map(p => [p.lat, p.lng]);
      for (let i = 0; i < coords1.length; i++) {
        for (let j = 0; j < coords2.length; j++) {
          const d = calculateDistance(coords1[i][0], coords1[i][1], coords2[j][0], coords2[j][1]);
          if (d < 150) {
            return { lat: coords1[i][0], lng: coords1[i][1] };
          }
        }
      }
      return null;
    }

    function drawRouteOnMap(route, color, dashed) {
      if (!route.puntos || route.puntos.length < 2) return;
      const coords = route.puntos.map(p => [p.lat, p.lng]);
      const polyline = L.polyline(coords, {
        color: color || route.color || '#2563eb',
        weight: 4,
        opacity: 0.85,
        dashArray: dashed ? '10,8' : null,
        lineJoin: 'round'
      }).addTo(state.map);
      state.searchPolylines.push(polyline);
    }

    // ============================================================
    // RENDER ROUTES ON MAP
    // ============================================================
    function clearRouteLayers() {
      state.routeLayers.forEach(l => state.map.removeLayer(l));
      state.routeLayers = [];
    }

    function renderRoutesOnMap() {
      clearRouteLayers();

      let toDraw = [];
      if (state.routesGridMode === 'all') {
        toDraw = state.routes;
      } else if (state.routesGridMode === 'selected' && state.selectedRoute) {
        toDraw = [state.selectedRoute];
      }

      toDraw.forEach(route => {
        if (!route.puntos || route.puntos.length < 2) return;
        const coords = route.puntos.map(p => [p.lat, p.lng]);
        const isSelected = state.selectedRoute?.id === route.id;
        const polyline = L.polyline(coords, {
          color: route.color || '#2563eb',
          weight: isSelected ? 6 : 4,
          opacity: isSelected ? 1 : 0.75,
          lineJoin: 'round'
        }).addTo(state.map);

        polyline.bindPopup(`<b>${route.nombre}</b><br>${route.descripcion || ''}`);
        polyline.on('click', () => selectRoute(route.id));
        state.routeLayers.push(polyline);

        // Start/End markers
        const start = coords[0];
        const end = coords[coords.length - 1];
        const startMarker = L.circleMarker(start, {
          radius: 8,
          color: '#fff',
          weight: 3,
          fillColor: route.color || '#2563eb',
          fillOpacity: 1
        }).addTo(state.map).bindPopup(`<b>${route.nombre}</b><br>Inicio`);
        const endMarker = L.circleMarker(end, {
          radius: 8,
          color: '#fff',
          weight: 3,
          fillColor: route.color || '#2563eb',
          fillOpacity: 1
        }).addTo(state.map).bindPopup(`<b>${route.nombre}</b><br>Fin`);
        state.routeLayers.push(startMarker, endMarker);

        // POIs
        (route.pois || []).forEach(poi => {
          const poiIcon = L.divIcon({
            className: 'route-poi',
            html: `<div style="width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid ${route.color || '#2563eb'};display:flex;align-items:center;justify-content:center;font-size:12px;">${poi.icono || '🏪'}</div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          const m = L.marker([poi.lat, poi.lng], { icon: poiIcon }).addTo(state.map);
          m.bindPopup(`<b>${poi.nombre}</b><br>${poi.descripcion || ''}`);
          state.routeLayers.push(m);
        });
      });
    }

    function selectRoute(id) {
      state.selectedRoute = state.routes.find(r => r.id === id) || null;
      if (state.selectedRoute) {
        state.routesGridMode = 'selected';
        renderRoutesOnMap();
        if (state.selectedRoute.puntos?.length) {
          const bounds = L.latLngBounds(state.selectedRoute.puntos.map(p => [p.lat, p.lng]));
          state.map.fitBounds(bounds, { padding: [50, 50] });
        }
      }
      renderPanel();
    }

    // ============================================================
    // RENDER PANEL
    // ============================================================
    function renderPanel() {
      const content = document.getElementById('panel-content');
      if (!content) return;

      switch (state.activeTab) {
        case 'routes': renderRoutesTab(content); break;
        case 'trip': renderTripTab(content); break;
        case 'pois': renderPoisTab(content); break;
        case 'info': renderInfoTab(content); break;
      }
    }

    function renderRoutesTab(content) {
      let filtered = state.routes;
      if (state.routeSearchFilter) {
        const q = state.routeSearchFilter.toLowerCase();
        filtered = state.routes.filter(r =>
          (r.nombre || '').toLowerCase().includes(q) ||
          (r.descripcion || '').toLowerCase().includes(q) ||
          (r.empresa || '').toLowerCase().includes(q) ||
          (r.streets || []).some(s => (s.nombre || '').toLowerCase().includes(q))
        );
      }

      filtered = [...filtered].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

      let html = `
        <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
          <button class="btn-pill ${state.routesGridMode === 'all' ? 'active' : ''}" data-vis="all">Mostrar todas</button>
          <button class="btn-pill ${state.routesGridMode === 'selected' ? 'active' : ''}" data-vis="selected">Solo seleccionada</button>
          <button class="btn-pill ${state.routesGridMode === 'hidden' ? 'active' : ''}" data-vis="hidden">Ocultar todas</button>
        </div>
      `;

      if (filtered.length === 0) {
        html += `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <h3>${state.routeSearchFilter ? 'No se encontraron rutas' : 'No hay rutas registradas'}</h3>
            <p>${state.routeSearchFilter ? 'Intenta con otra búsqueda' : 'Toca + para agregar una nueva ruta'}</p>
          </div>
        `;
      } else {
        html += `<div id="routes-grid">`;
        filtered.forEach(route => {
          const isSelected = state.selectedRoute?.id === route.id;
          const badgeClass = route.tipo === 'ida' ? 'badge-ida' : route.tipo === 'vuelta' ? 'badge-vuelta' : 'badge-circular';
          const badgeText = route.tipo === 'ida' ? 'IDA' : route.tipo === 'vuelta' ? 'VUELTA' : 'CIRCULAR';
          html += `
            <div class="route-card ${isSelected ? 'selected' : ''}" data-route-id="${route.id}">
              <div class="route-card-header">
                <div class="route-card-title">
                  <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${route.color || '#2563eb'};"></span>
                  ${route.nombre || 'Sin nombre'}
                </div>
                <span class="route-badge ${badgeClass}">${badgeText}</span>
              </div>
              ${route.descripcion ? `<div class="route-card-desc">${route.descripcion}</div>` : ''}
              <div class="route-card-meta">
                <span>📍 ${(route.puntos || []).length} pts</span>
                <span>🛣️ ${(route.streets || []).length} calles</span>
                <span>🏪 ${(route.pois || []).length} POIs</span>
                ${route.tarifa ? `<span>💰 ${route.tarifa}</span>` : ''}
              </div>
              <div class="route-card-actions">
                <button class="btn-view" data-action="view" data-id="${route.id}">👁️ Ver</button>
                <button class="btn-edit" data-action="edit" data-id="${route.id}">✏️ Editar</button>
                <button class="btn-del" data-action="delete" data-id="${route.id}">🗑️</button>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      content.innerHTML = html;

      // Bind visibility buttons
      content.querySelectorAll('[data-vis]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.routesGridMode = btn.dataset.vis;
          if (btn.dataset.vis === 'all') {
            state.selectedRoute = null;
            renderRoutesOnMap();
            const bounds = L.latLngBounds(state.routes.flatMap(r => (r.puntos || []).map(p => [p.lat, p.lng])));
            if (bounds.isValid()) state.map.fitBounds(bounds, { padding: [50, 50] });
          } else if (btn.dataset.vis === 'selected' && state.selectedRoute) {
            renderRoutesOnMap();
          } else if (btn.dataset.vis === 'hidden') {
            clearRouteLayers();
          }
          renderPanel();
        });
      });

      // Bind card actions
      content.querySelectorAll('[data-action="view"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          state.selectedRoute = state.routes.find(r => r.id === id) || null;
          state.routesGridMode = 'selected';
          renderRoutesOnMap();
          if (state.selectedRoute?.puntos?.length) {
            const bounds = L.latLngBounds(state.selectedRoute.puntos.map(p => [p.lat, p.lng]));
            state.map.fitBounds(bounds, { padding: [50, 50] });
          }
          state.activeTab = 'info';
          document.querySelectorAll('.tab-btn').forEach(t => t.classList.toggle('active', t.dataset.tab === 'info'));
          renderPanel();
        });
      });

      content.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          editRoute(btn.dataset.id);
        });
      });

      content.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteRouteConfirm(btn.dataset.id);
        });
      });

      // Bind card click
      content.querySelectorAll('.route-card').forEach(card => {
        card.addEventListener('click', () => selectRoute(card.dataset.routeId));
      });
    }

    function renderTripTab(content) {
      let html = `
        <div class="search-instructions">
          Toca el mapa para marcar hasta 3 puntos (A, B, C). Se buscarán rutas que pasen cerca de cada punto.
        </div>
      `;

      if (state.searchPoints.length > 0) {
        state.searchPoints.forEach((p, i) => {
          html += `
            <div class="search-point-item">
              <div class="point-letter ${p.letter.toLowerCase()}">${p.letter}</div>
              <div class="search-point-info">
                <div class="street">${p.street || 'Calle desconocida'}</div>
                <div class="coords">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>
              </div>
              <button class="icon-btn" onclick="removeSearchPoint(${i})" aria-label="Eliminar punto">✕</button>
            </div>
          `;
        });
      }

      html += `
        <div style="display:flex;gap:6px;margin:10px 0;">
          <button class="btn btn-secondary btn-sm" id="btn-add-my-location">📍 Agregar punto en mi ubicación</button>
          <button class="btn btn-secondary btn-sm" id="btn-center-my-location">🎯 Centrar</button>
          <button class="btn btn-danger btn-sm" id="btn-clear-search">🗑️ Limpiar</button>
        </div>
        <div class="slider-container">
          <label><span>Radio de búsqueda</span><span id="radius-value">${state.searchRadius}m</span></label>
          <input type="range" id="search-radius" min="10" max="2000" step="50" value="${state.searchRadius}">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-bottom:12px;" id="btn-search-trip">🔍 Buscar Rutas</button>
      `;

      if (state.searchResults) {
        const { passingAll, passing2Plus, passing1, transfers } = state.searchResults;

        if (passingAll.length > 0) {
          html += `<div class="result-group"><div class="result-group-title green">✅ Rutas que pasan por todos los puntos</div>`;
          passingAll.forEach(r => {
            html += `
              <div class="route-card" data-route-id="${r.id}">
                <div class="route-card-header">
                  <div class="route-card-title">
                    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${r.color || '#2563eb'};"></span>
                    ${r.nombre}
                  </div>
                </div>
                <div class="route-card-meta">📍 ${(r.puntos || []).length} pts ${r.tarifa ? `• 💰 ${r.tarifa}` : ''}</div>
              </div>
            `;
          });
          html += `</div>`;
        }

        if (passing2Plus.length > 0) {
          html += `<div class="result-group"><div class="result-group-title amber">🔄 Rutas que conectan varios puntos</div>`;
          passing2Plus.forEach(r => {
            html += `
              <div class="route-card" data-route-id="${r.id}">
                <div class="route-card-header">
                  <div class="route-card-title">
                    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${r.color || '#2563eb'};"></span>
                    ${r.nombre}
                  </div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }

        if (transfers.length > 0) {
          html += `<div class="result-group"><div class="result-group-title amber">🔄 Transbordos sugeridos</div>`;
          transfers.slice(0, 5).forEach(t => {
            html += `
              <div class="route-card">
                <div style="font-size:12px;font-weight:600;margin-bottom:4px;">${t.from.nombre} → ${t.to.nombre}</div>
                <div style="font-size:11px;color:var(--text-3);">Bajar en: ${t.intersection ? `${t.intersection.lat.toFixed(5)}, ${t.intersection.lng.toFixed(5)}` : 'Punto cercano'}</div>
              </div>
            `;
          });
          html += `</div>`;
        }

        if (passing1.length > 0) {
          html += `<div class="result-group"><div class="result-group-title blue">📍 Rutas cercanas a cada punto</div>`;
          passing1.slice(0, 8).forEach(r => {
            html += `
              <div class="route-card" data-route-id="${r.id}">
                <div class="route-card-header">
                  <div class="route-card-title">${r.nombre}</div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }

        if (passingAll.length === 0 && passing2Plus.length === 0 && passing1.length === 0 && transfers.length === 0) {
          html += `<div class="empty-state"><p>No se encontraron rutas. Intenta ampliar el radio.</p></div>`;
        }
      }

      content.innerHTML = html;

      // Bind events
      content.querySelector('#btn-add-my-location')?.addEventListener('click', addMyLocationAsPoint);
      content.querySelector('#btn-center-my-location')?.addEventListener('click', centerOnMyLocation);
      content.querySelector('#btn-clear-search')?.addEventListener('click', clearSearchPoints);
      content.querySelector('#btn-search-trip')?.addEventListener('click', searchTrip);

      const slider = content.querySelector('#search-radius');
      if (slider) {
        slider.addEventListener('input', (e) => {
          state.searchRadius = parseInt(e.target.value);
          document.getElementById('radius-value').textContent = `${state.searchRadius}m`;
          updateSearchRadiusCircles();
        });
      }

      content.querySelectorAll('.route-card[data-route-id]').forEach(card => {
        card.addEventListener('click', () => {
          selectRoute(card.dataset.routeId);
        });
      });
    }

    function renderPoisTab(content) {
      const allPois = [];
      state.routes.forEach(route => {
        (route.pois || []).forEach(poi => {
          allPois.push({ ...poi, routeName: route.nombre, routeId: route.id, routeColor: route.color });
        });
      });

      if (allPois.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <h3>No hay puntos de interés</h3>
            <p>Los POIs aparecerán aquí cuando los agregues a una ruta</p>
          </div>
        `;
        return;
      }

      let html = '';
      allPois.forEach(poi => {
        html += `
          <div class="poi-item" data-route-id="${poi.routeId}" data-poi-id="${poi.id}">
            <div class="poi-icon" style="border-color:${poi.routeColor || '#2563eb'};">${poi.icono || '🏪'}</div>
            <div class="poi-info">
              <div class="poi-name">${poi.nombre}</div>
              <div class="poi-route">${poi.routeName}</div>
            </div>
          </div>
        `;
      });

      content.innerHTML = html;

      content.querySelectorAll('.poi-item').forEach(item => {
        item.addEventListener('click', () => {
          selectRoute(item.dataset.routeId);
          const poi = allPois.find(p => p.id === item.dataset.poiId);
          if (poi) {
            state.map.setView([poi.lat, poi.lng], 17);
          }
        });
      });
    }
