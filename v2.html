<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e40af">
  <link rel="manifest" href="/manifest.json">
  <title>Rutas Tuxtla Gutiérrez - App Profesional</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #3b82f6;
      --secondary: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #ca8a04;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 4px 12px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* Header */
    .header {
      background: var(--primary);
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    .header h1 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .header-status { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .status-dot.offline { background: var(--danger); }

    /* Mapa */
    #map-container { flex: 1; position: relative; min-height: 150px; }
    #map { height: 100%; width: 100%; }

    /* Controles flotantes superiores */
    .top-controls {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .top-controls > * { pointer-events: auto; }

    .search-box {
      flex: 1;
      display: flex;
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .search-box input { flex: 1; border: none; padding: 12px 14px; font-size: 14px; outline: none; }
    .search-box button { background: none; border: none; padding: 12px; cursor: pointer; color: var(--secondary); }

    .btn-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      font-size: 20px;
      transition: all 0.2s;
    }

    .btn-circle:active { transform: scale(0.95); }
    .btn-add { background: var(--primary); color: white; }
    .btn-layers { background: white; color: var(--primary); }

    /* Modo edición overlay */
    .edit-mode-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999;
      pointer-events: none;
    }

    .edit-mode-overlay.active { pointer-events: auto; }

    .edit-toolbar {
      position: absolute;
      top: 70px;
      left: 10px;
      right: 10px;
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow-lg);
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 1001;
    }

    .edit-toolbar.active { display: flex; }

    .tool-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .tool-btn:active { background: var(--bg); }
    .tool-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .tool-btn.danger { background: #fee2e2; color: var(--danger); border-color: #fecaca; }

    /* Panel inferior */
    .bottom-panel {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      max-height: 50vh;
      display: flex;
      flex-direction: column;
      transition: max-height 0.3s ease;
      z-index: 999;
    }

    .bottom-panel.collapsed { max-height: 50px; }

    .panel-handle-area {
      padding: 8px 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
    }

    .panel-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; }

    .panel-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }

    .panel-tab {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .panel-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .panel-content { flex: 1; overflow-y: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; }
    .panel-content.hidden { display: none; }

    /* Tarjetas de ruta */
    .route-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .route-card:active { transform: scale(0.98); }
    .route-card.selected { border-color: var(--primary); background: #eff6ff; }

    .route-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .route-card h3 { font-size: 14px; font-weight: 600; }
    .route-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase; }
    .badge-ida { background: #dbeafe; color: #1e40af; }
    .badge-vuelta { background: #fef3c7; color: #92400e; }
    .badge-circular { background: #dcfce7; color: #166534; }

    .route-meta { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .route-actions { display: flex; gap: 6px; }

    .btn-sm {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-view { background: var(--primary); color: white; }
    .btn-edit { background: var(--border); color: var(--text); }
    .btn-delete { background: #fee2e2; color: var(--danger); }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-header h2 { font-size: 17px; }
    .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--secondary); }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Formularios */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text); }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--primary); }

    .form-group textarea { resize: vertical; min-height: 60px; }

    .form-row { display: flex; gap: 10px; }
    .form-row > * { flex: 1; }

    /* Botones */
    .btn {
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; flex: 1; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-block { width: 100%; flex: none; }

    /* Subida de imagen */
    .image-upload {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .image-upload:active { border-color: var(--primary); background: #eff6ff; }
    .image-preview { max-width: 100%; max-height: 120px; border-radius: 8px; margin-top: 10px; }

    /* Indicador de grabación */
    .recording-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: white;
      padding: 14px 20px;
      border-radius: 30px;
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1500;
      box-shadow: 0 4px 20px rgba(220,38,38,0.4);
    }

    .recording-bar.active { display: flex; }

    .pulse { width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* POI List */
    .poi-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .poi-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .poi-icon.business { background: #dbeafe; }
    .poi-icon.street { background: #dcfce7; }
    .poi-icon.colonia { background: #fef3c7; }
    .poi-icon.intersection { background: #fce7f3; }
    .poi-icon.custom { background: #e0e7ff; }

    .poi-info { flex: 1; min-width: 0; }
    .poi-info h4 { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poi-info p { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Transfer points */
    .transfer-card {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .transfer-card h4 { font-size: 13px; color: #92400e; margin-bottom: 6px; }
    .transfer-card p { font-size: 12px; color: #78350f; }

    /* Radio selector */
    .radius-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .radius-selector input[type="range"] { flex: 1; }

    /* Empty state */
    .empty-state { text-align: center; padding: 30px 20px; color: var(--text-muted); }
    .empty-state svg { width: 50px; height: 50px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 13px; }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 30px; gap: 10px; color: var(--text-muted); }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 3000;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Responsive */
    @media (min-width: 768px) {
      .bottom-panel { max-height: 40vh; }
      .modal { align-items: center; }
      .modal-content { border-radius: 20px; max-height: 85vh; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
        Rutas Tuxtla
      </h1>
      <div class="header-status">
        <span class="status-dot" id="connection-dot"></span>
        <span id="connection-text">Online</span>
      </div>
    </header>

    <!-- Mapa -->
    <div id="map-container">
      <div id="map"></div>

      <!-- Controles superiores -->
      <div class="top-controls">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Buscar rutas, calles, negocios...">
          <button id="search-btn" aria-label="Buscar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>
        </div>
        <button class="btn-circle btn-add" id="btn-add-route" aria-label="Agregar ruta">+</button>
        <button class="btn-circle btn-layers" id="btn-layers" aria-label="Capas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
          </svg>
        </button>
      </div>

      <!-- Toolbar de edición -->
      <div class="edit-toolbar" id="edit-toolbar">
        <button class="tool-btn active" id="tool-draw" data-tool="draw">✏️ Dibujar</button>
        <button class="tool-btn" id="tool-gps" data-tool="gps">📍 GPS</button>
        <button class="tool-btn" id="tool-poi" data-tool="poi">🏪 Punto</button>
        <button class="tool-btn" id="tool-undo" data-tool="undo">↩️ Deshacer</button>
        <button class="tool-btn danger" id="tool-clear" data-tool="clear">🗑️ Limpiar</button>
      </div>
    </div>

    <!-- Panel inferior -->
    <div class="bottom-panel" id="bottom-panel">
      <div class="panel-handle-area" id="panel-toggle">
        <div class="panel-handle"></div>
      </div>
      <div class="panel-tabs">
        <div class="panel-tab active" data-tab="routes">Rutas</div>
        <div class="panel-tab" data-tab="search">Buscar Viaje</div>
        <div class="panel-tab" data-tab="pois">Puntos de Interés</div>
      </div>
      <div class="panel-content" id="tab-routes">
        <div class="loading">
          <div class="spinner"></div>
          <span>Cargando rutas...</span>
        </div>
      </div>
      <div class="panel-content hidden" id="tab-search">
        <div class="form-group">
          <label>Punto de partida</label>
          <input type="text" id="search-origin" placeholder="Tu ubicación o dirección">
        </div>
        <div class="form-group">
          <label>Destino</label>
          <input type="text" id="search-destination" placeholder="A dónde vas">
        </div>
        <div class="radius-selector">
          <span style="font-size:12px;">Radio:</span>
          <input type="range" id="search-radius" min="100" max="2000" value="500" step="100">
          <span id="radius-value" style="font-size:12px;font-weight:600;">500m</span>
        </div>
        <button class="btn btn-primary btn-block" id="btn-search-trip">
          🔍 Buscar Rutas
        </button>
        <div id="search-results" style="margin-top:16px;"></div>
      </div>
      <div class="panel-content hidden" id="tab-pois">
        <div id="pois-list"></div>
      </div>
    </div>
  </div>

  <!-- Barra de grabación -->
  <div class="recording-bar" id="recording-bar">
    <span class="pulse"></span>
    <span id="recording-text">Grabando... 0 puntos</span>
    <button class="btn btn-sm btn-danger" id="btn-stop-recording">Detener</button>
  </div>

  <!-- Modal de ruta -->
  <div class="modal" id="route-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nueva Ruta</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="route-form">
          <input type="hidden" id="route-id">

          <div class="form-group">
            <label for="route-name">Nombre de la ruta *</label>
            <input type="text" id="route-name" required placeholder="Ej: Ruta 15 - Centro Sur">
          </div>

          <div class="form-group">
            <label for="route-desc">Descripción</label>
            <textarea id="route-desc" placeholder="Describe el recorrido, horarios, frecuencia..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="route-type">Tipo</label>
              <select id="route-type">
                <option value="ida">Ida</option>
                <option value="vuelta">Vuelta</option>
                <option value="circular">Circular</option>
              </select>
            </div>
            <div class="form-group">
              <label for="route-color">Color</label>
              <input type="color" id="route-color" value="#1e40af" style="height:40px;cursor:pointer;">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="route-fare">Tarifa</label>
              <input type="text" id="route-fare" placeholder="$12.00">
            </div>
            <div class="form-group">
              <label for="route-schedule">Horario</label>
              <input type="text" id="route-schedule" placeholder="5:00 - 22:00">
            </div>
          </div>

          <div class="form-group">
            <label for="route-notes">Notas adicionales</label>
            <textarea id="route-notes" placeholder="Información adicional sobre la ruta..." style="min-height:50px;"></textarea>
          </div>

          <div class="form-group">
            <label>Imagen de referencia</label>
            <div class="image-upload" id="image-upload-area">
              <input type="file" id="route-image" accept="image/*" hidden>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.5;margin-bottom:6px;">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
              </svg>
              <p style="font-size:12px;color:var(--text-muted);">Toca para subir imagen</p>
              <img id="image-preview" class="image-preview" style="display:none;">
            </div>
          </div>

          <div class="form-group">
            <label>Puntos de la ruta (<span id="points-count">0</span>)</label>
            <div id="points-info" style="padding:10px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text-muted);">
              Haz clic en "Dibujar" y luego en el mapa para trazar la ruta.
              También puedes usar "GPS" para grabar tu recorrido en tiempo real.
            </div>
          </div>

          <div class="form-group">
            <label>Puntos de interés detectados</label>
            <div id="detected-pois"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancel">Cancelar</button>
        <button class="btn btn-primary" id="btn-save">Guardar Ruta</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>

  <script type="module">
    // =====================================================
    // CONFIGURACIÓN
    // =====================================================
    const FIREBASE_DB_URL = 'https://galloslivebadge-default-rtdb.firebaseio.com';
    const CLOUDINARY_CONFIG = {
      cloud_name: 'dxjgyqcby',
      upload_preset: 'sinfirmaupload'
    };
    const TUXTLA_CENTER = [16.7538, -93.1156];
    const DEFAULT_ZOOM = 13;
    const NOMINATIM_URL = 'https://nominatim.openstreetmap.org';

    // =====================================================
    // ESTADO GLOBAL
    // =====================================================

    function showToast(message, duration = 3000) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);

    function updateConnectionStatus() {
      state.isOnline = navigator.onLine;
      const dot = $('#connection-dot');
      const text = $('#connection-text');
      if (state.isOnline) {
        dot.classList.remove('offline');
        text.textContent = 'Online';
      } else {
        dot.classList.add('offline');
        text.textContent = 'Offline';
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function pointToLineDistance(point, line) {
      let minDist = Infinity;
      for (let i = 0; i < line.length - 1; i++) {
        const dist = pointToSegmentDistance(point, line[i], line[i+1]);
        if (dist < minDist) minDist = dist;
      }
      return minDist;
    }

    function pointToSegmentDistance(p, a, b) {
      const atob = { lat: b.lat - a.lat, lng: b.lng - a.lng };
      const atop = { lat: p.lat - a.lat, lng: p.lng - a.lng };
      const len = atob.lat * atob.lat + atob.lng * atob.lng;
      let t = len === 0 ? 0 : (atop.lat * atob.lat + atop.lng * atob.lng) / len;
      t = Math.max(0, Math.min(1, t));
      const closest = { lat: a.lat + t * atob.lat, lng: a.lng + t * atob.lng };
      return calculateDistance(p.lat, p.lng, closest.lat, closest.lng);
    }

    // =====================================================
    // NOMINATIM - Geocodificación
    // =====================================================
    async function reverseGeocode(lat, lng) {
      try {
        const response = await fetch(
          `${NOMINATIM_URL}/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1&accept-language=es`,
          { headers: { 'User-Agent': 'RutasTuxtlaApp/1.0' } }
        );
        if (!response.ok) throw new Error('Error geocoding');
        const data = await response.json();
        return {
          displayName: data.display_name || '',
          address: data.address || {},
          type: data.type || '',
          class: data.class || ''
        };
      } catch (error) {
        console.error('Reverse geocode error:', error);
        return null;
      }
    }

    async function searchPlaces(query, lat, lng) {
      try {
        let url = `${NOMINATIM_URL}/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&limit=10&accept-language=es`;
        if (lat && lng) {
          url += `&viewbox=${lng-0.1},${lat+0.1},${lng+0.1},${lat-0.1}&bounded=0`;
        }
        const response = await fetch(url, {
          headers: { 'User-Agent': 'RutasTuxtlaApp/1.0' }
        });
        if (!response.ok) throw new Error('Error search');
        return await response.json();
      } catch (error) {
        console.error('Search error:', error);
        return [];
      }
    }

    async function detectPoisAlongRoute(points) {
      const pois = [];
      const processedLocations = new Set();

      for (let i = 0; i < points.length; i += 5) {
        const point = points[i];
        const key = `${point.lat.toFixed(4)},${point.lng.toFixed(4)}`;

        if (processedLocations.has(key)) continue;
        processedLocations.add(key);

        try {
          const result = await reverseGeocode(point.lat, point.lng);
          if (result && result.address) {
            const addr = result.address;
            let poiType = 'street';
            let name = '';
            let icon = '🛣️';

            if (addr.amenity || addr.shop || addr.restaurant || addr.cafe || addr.bank) {
              poiType = 'business';
              name = addr.amenity || addr.shop || addr.restaurant || addr.cafe || addr.bank || 'Negocio';
              icon = '🏪';
            } else if (addr.road) {
              poiType = 'street';
              name = addr.road;
              icon = '🛣️';
            } else if (addr.suburb || addr.neighbourhood) {
              poiType = 'colonia';
              name = addr.suburb || addr.neighbourhood;
              icon = '🏘️';
            } else if (addr.city || addr.town) {
              name = addr.city || addr.town;
              icon = '🏙️';
            }

            if (name) {
              pois.push({
                id: generateId(),
                lat: point.lat,
                lng: point.lng,
                nombre: name,
                descripcion: result.displayName,
                tipo: poiType,
                icono: icon,
                direccion: result.displayName
              });
            }
          }

          await new Promise(r => setTimeout(r, 1100));
        } catch (error) {
          console.error('POI detection error:', error);
        }
      }

      return pois;
    }

    // =====================================================
    // INDEXEDDB
    // =====================================================
    async function initDB() {
      state.db = await idb.openDB('rutas-tuxtla-db', 2, {
        upgrade(db, oldVersion) {
          if (!db.objectStoreNames.contains('rutas')) {
            db.createObjectStore('rutas', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('pois')) {
            db.createObjectStore('pois', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('sync-queue')) {
            db.createObjectStore('sync-queue', { keyPath: 'id', autoIncrement: true });
          }
        }
      });
      console.log('IndexedDB inicializada');
    }

    async function saveRouteToLocal(route) {
      if (!state.db) await initDB();
      await state.db.put('rutas', route);
    }

    async function getRoutesFromLocal() {
      if (!state.db) await initDB();
      return await state.db.getAll('rutas');
    }

    async function deleteRouteFromLocal(id) {
      if (!state.db) await initDB();
      await state.db.delete('rutas', id);
    }

    async function savePoisToLocal(pois) {
      if (!state.db) await initDB();
      for (const poi of pois) {
        await state.db.put('pois', poi);
      }
    }

    async function getPoisFromLocal() {
      if (!state.db) await initDB();
      return await state.db.getAll('pois');
    }

    // =====================================================
    // FIREBASE
    // =====================================================
    async function syncRouteToFirebase(route) {
      const url = `${FIREBASE_DB_URL}/rutas/${route.id}.json`;
      const response = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...route, updatedAt: Date.now() })
      });
      if (!response.ok) throw new Error('Error Firebase');
      return response.json();
    }

    async function deleteRouteFromFirebase(id) {
      const url = `${FIREBASE_DB_URL}/rutas/${id}.json`;
      const response = await fetch(url, { method: 'DELETE' });
      if (!response.ok) throw new Error('Error Firebase');
    }

    async function loadRoutesFromFirebase() {
      try {
        const response = await fetch(`${FIREBASE_DB_URL}/rutas.json`);
        if (!response.ok) throw new Error('Error Firebase');
        const data = await response.json();
        if (!data) return [];
        return Object.entries(data).map(([id, route]) => ({ ...route, id }));
      } catch (error) {
        console.error('Load Firebase error:', error);
        return [];
      }
    }

    // =====================================================
    // CLOUDINARY
    // =====================================================
    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_CONFIG.upload_preset);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloud_name}/image/upload`,
        { method: 'POST', body: formData }
      );

      if (!response.ok) throw new Error('Error Cloudinary');
      const data = await response.json();
      return data.secure_url;
    }

    // =====================================================
    // MAPA
    // =====================================================
    function initMap() {
      state.map = L.map('map', {
        center: TUXTLA_CENTER,
        zoom: DEFAULT_ZOOM,
        zoomControl: false,
        attributionControl: false
      });

      L.control.zoom({ position: 'bottomright' }).addTo(state.map);

      // Capas base
      const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(state.map);

      const osmHOT = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap HOT'
      });

      // Control de capas
      const baseMaps = {
        "OpenStreetMap": osm,
        "OpenStreetMap HOT": osmHOT
      };

      L.control.layers(baseMaps, null, { position: 'bottomright' }).addTo(state.map);

      // Geocoder
      L.Control.geocoder({
        defaultMarkGeocode: false,
        placeholder: 'Buscar dirección...',
        errorMessage: 'No encontrado'
      })
        .on('markgeocode', function(e) {
          state.map.fitBounds(e.geocode.bbox);
        })
        .addTo(state.map);

      // Click en mapa
      state.map.on('click', handleMapClick);

      console.log('Mapa inicializado');
    }

    function handleMapClick(e) {
      if (!state.isEditing) return;

      const { lat, lng } = e.latlng;

      if (state.activeTool === 'draw') {
        addTrackedPoint({ lat, lng, tipo: 'manual' });
      } else if (state.activeTool === 'poi') {
        addPoiAtLocation(lat, lng);
      } else if (state.activeTool === 'search') {
        // Para búsqueda de viaje
        if (!state.searchOrigin) {
          state.searchOrigin = { lat, lng };
          L.marker([lat, lng], { icon: createSearchIcon('A', '#16a34a') })
            .addTo(state.map)
            .bindPopup('Punto de partida');
          showToast('Punto de partida seleccionado');
        } else if (!state.searchDestination) {
          state.searchDestination = { lat, lng };
          L.marker([lat, lng], { icon: createSearchIcon('B', '#dc2626') })
            .addTo(state.map)
            .bindPopup('Destino');
          showToast('Destino seleccionado');
        }
      }
    }

    function createSearchIcon(label, color) {
      return L.divIcon({
        className: 'search-marker',
        html: `<div style="background:${color};color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">${label}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });
    }

    // =====================================================
    // RUTAS - Renderizado
    // =====================================================
    function renderRoutesList() {
      const container = $('#tab-routes');
      const filtered = state.routes.filter(r => {
        if (!state.filterText) return true;
        const search = state.filterText.toLowerCase();
        return (
          (r.nombre && r.nombre.toLowerCase().includes(search)) ||
          (r.descripcion && r.descripcion.toLowerCase().includes(search))
        );
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
            </svg>
            <p>${state.filterText ? 'No se encontraron rutas' : 'No hay rutas registradas'}</p>
            <p style="font-size:11px;margin-top:6px;">Toca + para agregar una nueva ruta</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(route => `
        <div class="route-card ${state.currentRoute?.id === route.id ? 'selected' : ''}" data-id="${route.id}">
          <div class="route-card-header">
            <h3>${escapeHtml(route.nombre || 'Sin nombre')}</h3>
            <span class="route-badge badge-${route.tipo || 'ida'}">${route.tipo || 'ida'}</span>
          </div>
          ${route.descripcion ? `<p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">${escapeHtml(route.descripcion)}</p>` : ''}
          <div class="route-meta">
            <span>📍 ${route.puntos?.length || 0} puntos</span>
            ${route.pois?.length ? `<span>🏪 ${route.pois.length} POIs</span>` : ''}
            ${route.tarifa ? `<span>💰 ${route.tarifa}</span>` : ''}
          </div>
          <div class="route-actions">
            <button class="btn-sm btn-view" onclick="viewRoute('${route.id}')">👁️ Ver</button>
            <button class="btn-sm btn-edit" onclick="editRoute('${route.id}')">✏️ Editar</button>
            <button class="btn-sm btn-delete" onclick="deleteRoute('${route.id}')">🗑️</button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.route-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          selectRoute(card.dataset.id);
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderRoutesOnMap() {
      Object.values(state.routeLayers).forEach(layer => {
        if (layer.polyline) state.map.removeLayer(layer.polyline);
        if (layer.markers) layer.markers.forEach(m => state.map.removeLayer(m));
      });
      state.routeLayers = {};

      state.routes.forEach(route => {
        if (!route.puntos || route.puntos.length < 2) return;

        const coords = route.puntos.map(p => [p.lat, p.lng]);
        const color = route.color || '#1e40af';

        const polyline = L.polyline(coords, {
          color,
          weight: 4,
          opacity: 0.8,
          lineJoin: 'round'
        }).addTo(state.map);

        const markers = [
          L.marker(coords[0], {
            icon: L.divIcon({
              className: 'route-marker',
              html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            })
          }).bindPopup(`<b>${route.nombre}</b><br>Inicio`),
          L.marker(coords[coords.length - 1], {
            icon: L.divIcon({
              className: 'route-marker',
              html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            })
          }).bindPopup(`<b>${route.nombre}</b><br>Fin`)
        ];

        markers.forEach(m => m.addTo(state.map));

        // Renderizar POIs de la ruta
        if (route.pois && route.pois.length > 0) {
          route.pois.forEach(poi => {
            const poiMarker = L.marker([poi.lat, poi.lng], {
              icon: L.divIcon({
                className: 'poi-marker',
                html: `<div style="background:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.2);border:2px solid ${color};">${poi.icono || '📍'}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
              })
            }).bindPopup(`<b>${poi.nombre}</b><br>${poi.descripcion || ''}`);
            poiMarker.addTo(state.map);
            markers.push(poiMarker);
          });
        }

        state.routeLayers[route.id] = { polyline, markers };
      });
    }

    function selectRoute(id) {
      const route = state.routes.find(r => r.id === id);
      if (!route) return;

      state.currentRoute = route;
      renderRoutesList();

      Object.entries(state.routeLayers).forEach(([routeId, layer]) => {
        if (layer.polyline) {
          layer.polyline.setStyle({
            weight: routeId === id ? 6 : 4,
            opacity: routeId === id ? 1 : 0.6
          });
        }
      });

      if (state.routeLayers[id]) {
        const bounds = state.routeLayers[id].polyline.getBounds();
        state.map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    // =====================================================
    // BÚSQUEDA DE VIAJE
    // =====================================================
    async function searchTrip() {
      const originInput = $('#search-origin').value.trim();
      const destInput = $('#search-destination').value.trim();
      const radius = state.searchRadius;

      let origin = state.searchOrigin;
      let destination = state.searchDestination;

      // Si no hay puntos seleccionados en mapa, buscar por texto
      if (!origin && originInput) {
        const results = await searchPlaces(originInput, TUXTLA_CENTER[0], TUXTLA_CENTER[1]);
        if (results.length > 0) {
          origin = { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
        }
      }

      if (!destination && destInput) {
        const results = await searchPlaces(destInput, TUXTLA_CENTER[0], TUXTLA_CENTER[1]);
        if (results.length > 0) {
          destination = { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
        }
      }

      if (!origin || !destination) {
        showToast('Selecciona origen y destino');
        return;
      }

      // Buscar rutas que pasan cerca de ambos puntos
      const routesFromOrigin = findRoutesNearPoint(origin, radius);
      const routesFromDestination = findRoutesNearPoint(destination, radius);

      // Rutas directas (pasan por ambos)
      const directRoutes = routesFromOrigin.filter(r =>
        routesFromDestination.some(r2 => r2.id === r.id)
      );

      // Rutas con transbordo
      const transferRoutes = [];
      routesFromOrigin.forEach(originRoute => {
        routesFromDestination.forEach(destRoute => {
          if (originRoute.id === destRoute.id) return;

          // Buscar punto de transbordo
          const transferPoint = findTransferPoint(originRoute, destRoute);
          if (transferPoint) {
            transferRoutes.push({
              route1: originRoute,
              route2: destRoute,
              transferPoint
            });
          }
        });
      });

      renderSearchResults(directRoutes, transferRoutes, origin, destination);
    }

    function findRoutesNearPoint(point, radius) {
      return state.routes.filter(route => {
        if (!route.puntos || route.puntos.length < 2) return false;
        const dist = pointToLineDistance(point, route.puntos);
        return dist <= radius;
      });
    }

    function findTransferPoint(route1, route2) {
      if (!route1.puntos || !route2.puntos) return null;

      let minDist = Infinity;
      let transferPoint = null;

      route1.puntos.forEach(p1 => {
        route2.puntos.forEach(p2 => {
          const dist = calculateDistance(p1.lat, p1.lng, p2.lat, p2.lng);
          if (dist < minDist && dist < 300) {
            minDist = dist;
            transferPoint = {
              lat: (p1.lat + p2.lat) / 2,
              lng: (p1.lng + p2.lng) / 2,
              distance: dist
            };
          }
        });
      });

      return transferPoint;
    }

    function renderSearchResults(directRoutes, transferRoutes, origin, destination) {
      const container = $('#search-results');

      let html = '';

      // Limpiar capas anteriores de búsqueda
      state.map.eachLayer(layer => {
        if (layer.options && layer.options.isSearchLayer) {
          state.map.removeLayer(layer);
        }
      });

      if (directRoutes.length > 0) {
        html += '<h3 style="font-size:14px;margin-bottom:10px;">✅ Rutas Directas</h3>';
        directRoutes.forEach(route => {
          html += `
            <div class="route-card" onclick="viewRoute('${route.id}')">
              <div class="route-card-header">
                <h3>${route.nombre}</h3>
                <span class="route-badge badge-${route.tipo}">${route.tipo}</span>
              </div>
              <div class="route-meta">
                <span>📍 ${route.puntos.length} puntos</span>
                ${route.tarifa ? `<span>💰 ${route.tarifa}</span>` : ''}
              </div>
            </div>
          `;

          // Dibujar ruta en mapa
          const coords = route.puntos.map(p => [p.lat, p.lng]);
          L.polyline(coords, {
            color: '#16a34a',
            weight: 5,
            opacity: 0.8,
            isSearchLayer: true
          }).addTo(state.map);
        });
      }

      if (transferRoutes.length > 0) {
        html += '<h3 style="font-size:14px;margin:16px 0 10px;">🔄 Rutas con Transbordo</h3>';
        transferRoutes.slice(0, 5).forEach(({ route1, route2, transferPoint }) => {
          html += `
            <div class="transfer-card">
              <h4>${route1.nombre} → ${route2.nombre}</h4>
              <p>Transbordo a ${Math.round(transferPoint.distance)}m del punto</p>
              <button class="btn-sm btn-view" style="margin-top:8px;" onclick="showTransfer('${route1.id}', '${route2.id}', ${transferPoint.lat}, ${transferPoint.lng})">
                Ver en mapa
              </button>
            </div>
          `;
        });
      }

      if (directRoutes.length === 0 && transferRoutes.length === 0) {
        html = `
          <div class="empty-state">
            <p>No se encontraron rutas para este viaje</p>
            <p style="font-size:11px;margin-top:6px;">Intenta aumentar el radio de búsqueda</p>
          </div>
        `;
      }

      container.innerHTML = html;

      // Marcar origen y destino
      L.marker([origin.lat, origin.lng], {
        icon: createSearchIcon('A', '#16a34a'),
        isSearchLayer: true
      }).addTo(state.map);

      L.marker([destination.lat, destination.lng], {
        icon: createSearchIcon('B', '#dc2626'),
        isSearchLayer: true
      }).addTo(state.map);

      // Ajustar vista
      const bounds = L.latLngBounds([
        [origin.lat, origin.lng],
        [destination.lat, destination.lng]
      ]);
      state.map.fitBounds(bounds, { padding: [50, 50] });
    }

    window.showTransfer = function(route1Id, route2Id, lat, lng) {
      const route1 = state.routes.find(r => r.id === route1Id);
      const route2 = state.routes.find(r => r.id === route2Id);

      if (route1 && route1.puntos) {
        const coords = route1.puntos.map(p => [p.lat, p.lng]);
        L.polyline(coords, { color: '#16a34a', weight: 5, isSearchLayer: true }).addTo(state.map);
      }

      if (route2 && route2.puntos) {
        const coords = route2.puntos.map(p => [p.lat, p.lng]);
        L.polyline(coords, { color: '#dc2626', weight: 5, isSearchLayer: true }).addTo(state.map);
      }

      L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'transfer-marker',
          html: '<div style="background:#f59e0b;color:white;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">🔄</div>',
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        }),
        isSearchLayer: true
      }).addTo(state.map).bindPopup('Punto de transbordo');

      state.map.setView([lat, lng], 16);
    };

    // =====================================================
    // EDICIÓN DE RUTAS
    // =====================================================
    function startEditing(routeId = null) {
      state.isEditing = true;
      state.editingRouteId = routeId;
      state.trackedPoints = [];
      state.detectedPois = [];

      $('#edit-toolbar').classList.add('active');
      $('#bottom-panel').classList.add('collapsed');

      if (routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (route) {
          state.trackedPoints = [...(route.puntos || [])];
          state.detectedPois = [...(route.pois || [])];
          renderEditingTrack();
        }
      }

      updatePointsUI();
      showToast('Modo edición activo. Haz clic en el mapa para agregar puntos.');
    }

    function stopEditing() {
      state.isEditing = false;
      state.editingRouteId = null;
      state.trackedPoints = [];
      state.detectedPois = [];

      $('#edit-toolbar').classList.remove('active');
      $('#bottom-panel').classList.remove('collapsed');

      if (state.editingLayer) {
        state.map.removeLayer(state.editingLayer);
        state.editingLayer = null;
      }

      state.poiLayers.forEach(layer => state.map.removeLayer(layer));
      state.poiLayers = [];

      if (state.isTracking) stopTracking();
    }

    function addTrackedPoint(point) {
      state.trackedPoints.push(point);
      updatePointsUI();
      renderEditingTrack();
    }

    function addPoiAtLocation(lat, lng) {
      const poi = {
        id: generateId(),
        lat,
        lng,
        nombre: 'Nuevo punto',
        descripcion: '',
        tipo: 'custom',
        icono: '📍'
      };

      state.detectedPois.push(poi);
      renderDetectedPois();
      renderPoiOnMap(poi);

      // Intentar obtener información automáticamente
      reverseGeocode(lat, lng).then(result => {
        if (result && result.displayName) {
          poi.descripcion = result.displayName;
          if (result.address) {
            const addr = result.address;
            if (addr.amenity || addr.shop) {
              poi.nombre = addr.amenity || addr.shop;
              poi.tipo = 'business';
              poi.icono = '🏪';
            } else if (addr.road) {
              poi.nombre = addr.road;
              poi.tipo = 'street';
              poi.icono = '🛣️';
            }
          }
          renderDetectedPois();
        }
      });
    }

    function renderPoiOnMap(poi) {
      const marker = L.marker([poi.lat, poi.lng], {
        icon: L.divIcon({
          className: 'editing-poi',
          html: `<div style="background:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid #1e40af;">${poi.icono}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        }),
        draggable: true
      }).addTo(state.map);

      marker.on('dragend', (e) => {
        const pos = e.target.getLatLng();
        poi.lat = pos.lat;
        poi.lng = pos.lng;
      });

      marker.on('click', () => {
        const newName = prompt('Nombre del punto:', poi.nombre);
        if (newName) {
          poi.nombre = newName;
          renderDetectedPois();
        }
      });

      state.poiLayers.push(marker);
    }

    function renderEditingTrack() {
      if (state.editingLayer) {
        state.map.removeLayer(state.editingLayer);
      }

      if (state.trackedPoints.length < 2) return;

      const coords = state.trackedPoints.map(p => [p.lat, p.lng]);
      state.editingLayer = L.polyline(coords, {
        color: '#16a34a',
        weight: 5,
        opacity: 0.9,
        dashArray: state.isTracking ? '10, 10' : null
      }).addTo(state.map);

      // Marcadores para puntos manuales
      state.trackedPoints.forEach((p, i) => {
        if (p.tipo === 'manual') {
          const marker = L.circleMarker([p.lat, p.lng], {
            radius: 6,
            fillColor: '#dc2626',
            color: 'white',
            weight: 2,
            fillOpacity: 1
          }).addTo(state.map);

          marker.bindPopup(`Punto ${i + 1}`);
          marker.on('click', () => {
            if (confirm('¿Eliminar este punto?')) {
              state.trackedPoints.splice(i, 1);
              renderEditingTrack();
              updatePointsUI();
            }
          });
        }
      });
    }

    function renderDetectedPois() {
      const container = $('#detected-pois');

      if (state.detectedPois.length === 0) {
        container.innerHTML = '<p style="font-size:12px;color:var(--text-muted);">No hay puntos de interés detectados</p>';
        return;
      }

      container.innerHTML = state.detectedPois.map(poi => `
        <div class="poi-item" data-id="${poi.id}">
          <div class="poi-icon ${poi.tipo}">${poi.icono}</div>
          <div class="poi-info">
            <h4>${escapeHtml(poi.nombre)}</h4>
            <p>${escapeHtml(poi.descripcion || 'Sin descripción')}</p>
          </div>
          <button class="btn-sm btn-delete" onclick="removePoi('${poi.id}')">✕</button>
        </div>
      `).join('');
    }

    window.removePoi = function(id) {
      state.detectedPois = state.detectedPois.filter(p => p.id !== id);
      renderDetectedPois();
    };

    function updatePointsUI() {
      const count = state.trackedPoints.length;
      $('#points-count').textContent = count;
      $('#recording-text').textContent = `Grabando... ${count} puntos`;
    }

    // =====================================================
    // GRABACIÓN GPS
    // =====================================================
    function startTracking() {
      if (!navigator.geolocation) {
        showToast('Geolocalización no soportada');
        return;
      }

      state.isTracking = true;
      $('#recording-bar').classList.add('active');

      state.watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          addTrackedPoint({
            lat: latitude,
            lng: longitude,
            accuracy,
            tipo: 'gps',
            timestamp: position.timestamp
          });
          state.map.setView([latitude, longitude], 16);
        },
        (error) => {
          console.error('GPS Error:', error);
          showToast('Error GPS: ' + error.message);
          stopTracking();
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );

      showToast('Grabando recorrido...');
    }

    function stopTracking() {
      state.isTracking = false;

      if (state.watchId) {
        navigator.geolocation.clearWatch(state.watchId);
        state.watchId = null;
      }

      $('#recording-bar').classList.remove('active');
      showToast(`Recorrido detenido: ${state.trackedPoints.length} puntos`);

      // Detectar POIs automáticamente
      if (state.trackedPoints.length > 5) {
        detectPoisAlongRoute(state.trackedPoints).then(pois => {
          state.detectedPois = [...state.detectedPois, ...pois];
          renderDetectedPois();
          pois.forEach(poi => renderPoiOnMap(poi));
          showToast(`Detectados ${pois.length} puntos de interés`);
        });
      }
    }

    // =====================================================
    // MODAL
    // =====================================================
    function openModal(routeId = null) {
      state.editingRouteId = routeId;

      const modal = $('#route-modal');
      const form = $('#route-form');

      form.reset();
      $('#image-preview').style.display = 'none';
      $('#route-color').value = '#1e40af';

      if (routeId) {
        $('#modal-title').textContent = 'Editar Ruta';
        const route = state.routes.find(r => r.id === routeId);
        if (route) {
          $('#route-id').value = route.id;
          $('#route-name').value = route.nombre || '';
          $('#route-desc').value = route.descripcion || '';
          $('#route-type').value = route.tipo || 'ida';
          $('#route-color').value = route.color || '#1e40af';
          $('#route-fare').value = route.tarifa || '';
          $('#route-schedule').value = route.horario || '';
          $('#route-notes').value = route.notas || '';
          state.trackedPoints = [...(route.puntos || [])];
          state.detectedPois = [...(route.pois || [])];

          if (route.imagen) {
            $('#image-preview').src = route.imagen;
            $('#image-preview').style.display = 'block';
          }
        }
      } else {
        $('#modal-title').textContent = 'Nueva Ruta';
        $('#route-id').value = '';
        state.trackedPoints = [];
        state.detectedPois = [];
      }

      updatePointsUI();
      renderDetectedPois();
      modal.classList.add('active');

      // Iniciar modo edición
      startEditing(routeId);
    }

    function closeModal() {
      $('#route-modal').classList.remove('active');
      stopEditing();
    }

    // =====================================================
    // GUARDAR RUTA
    // =====================================================
    async function saveRoute() {
      const name = $('#route-name').value.trim();

      if (!name) {
        showToast('Ingresa un nombre para la ruta');
        return;
      }

      if (state.trackedPoints.length < 2) {
        showToast('Necesitas al menos 2 puntos en la ruta');
        return;
      }

      const saveBtn = $('#btn-save');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando...';

      try {
        const routeId = $('#route-id').value || generateId();
        const imageFile = $('#route-image').files[0];

        let imageUrl = null;
        if (imageFile) {
          try {
            imageUrl = await uploadImage(imageFile);
          } catch (error) {
            console.error('Image upload error:', error);
          }
        } else if ($('#image-preview').src && $('#image-preview').style.display !== 'none') {
          imageUrl = $('#image-preview').src;
        }

        const route = {
          id: routeId,
          nombre: name,
          descripcion: $('#route-desc').value.trim(),
          tipo: $('#route-type').value,
          color: $('#route-color').value,
          tarifa: $('#route-fare').value.trim(),
          horario: $('#route-schedule').value.trim(),
          notas: $('#route-notes').value.trim(),
          imagen: imageUrl,
          puntos: state.trackedPoints,
          pois: state.detectedPois,
          createdAt: state.editingRouteId ? undefined : Date.now(),
          updatedAt: Date.now()
        };

        await saveRouteToLocal(route);

        if (state.isOnline) {
          try {
            await syncRouteToFirebase(route);
            showToast('Ruta guardada y sincronizada');
          } catch (error) {
            showToast('Guardado local (pendiente sincronizar)');
          }
        } else {
          showToast('Ruta guardada offline');
        }

        const existingIndex = state.routes.findIndex(r => r.id === routeId);
        if (existingIndex >= 0) {
          state.routes[existingIndex] = { ...state.routes[existingIndex], ...route };
        } else {
          state.routes.push(route);
        }

        renderRoutesList();
        renderRoutesOnMap();
        closeModal();

      } catch (error) {
        console.error('Save error:', error);
        showToast('Error al guardar');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar Ruta';
      }
    }

    // =====================================================
    // ELIMINAR RUTA
    // =====================================================
    async function deleteRoute(id) {
      const route = state.routes.find(r => r.id === id);
      if (!route) return;

      if (!confirm(`¿Eliminar la ruta "${route.nombre}"?`)) return;

      try {
        await deleteRouteFromLocal(id);

        if (state.isOnline) {
          try {
            await deleteRouteFromFirebase(id);
          } catch (error) {
            console.error('Firebase delete error:', error);
          }
        }

        state.routes = state.routes.filter(r => r.id !== id);

        if (state.routeLayers[id]) {
          if (state.routeLayers[id].polyline) {
            state.map.removeLayer(state.routeLayers[id].polyline);
          }
          if (state.routeLayers[id].markers) {
            state.routeLayers[id].markers.forEach(m => state.map.removeLayer(m));
          }
          delete state.routeLayers[id];
        }

        renderRoutesList();
        showToast('Ruta eliminada');

      } catch (error) {
        console.error('Delete error:', error);
        showToast('Error al eliminar');
      }
    }

    // =====================================================
    // EVENT LISTENERS
    // =====================================================
    function setupEventListeners() {
      // Búsqueda de rutas
      $('#search-btn').addEventListener('click', () => {
        state.filterText = $('#search-input').value.trim();
        renderRoutesList();
      });

      $('#search-input').addEventListener('input', (e) => {
        state.filterText = e.target.value.trim();
        renderRoutesList();
      });

      // Agregar ruta
      $('#btn-add-route').addEventListener('click', () => openModal());

      // Cerrar modal
      $('#modal-close').addEventListener('click', closeModal);
      $('#btn-cancel').addEventListener('click', closeModal);

      // Guardar
      $('#btn-save').addEventListener('click', saveRoute);

      // Grabar GPS
      $('#btn-start-tracking').addEventListener('click', () => {
        if (state.isTracking) stopTracking();
        else startTracking();
      });

      $('#btn-stop-recording').addEventListener('click', stopTracking);

      // Limpiar puntos
      $('#btn-clear-points').addEventListener('click', () => {
        if (confirm('¿Limpiar todos los puntos?')) {
          state.trackedPoints = [];
          state.detectedPois = [];
          updatePointsUI();
          renderDetectedPois();
          if (state.editingLayer) {
            state.map.removeLayer(state.editingLayer);
            state.editingLayer = null;
          }
        }
      });

      // Subida de imagen
      $('#image-upload-area').addEventListener('click', () => {
        $('#route-image').click();
      });

      $('#route-image').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            $('#image-preview').src = ev.target.result;
            $('#image-preview').style.display = 'block';
          };
          reader.readAsDataURL(file);
        }
      });

      // Panel toggle
      $('#panel-toggle').addEventListener('click', () => {
        $('#bottom-panel').classList.toggle('collapsed');
      });

      // Tabs
      $$('.panel-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.panel-tab').forEach(t => t.classList.remove('active'));
          $$('.panel-content').forEach(c => c.classList.add('hidden'));
          tab.classList.add('active');
          $(`#tab-${tab.dataset.tab}`).classList.remove('hidden');
        });
      });

      // Herramientas de edición
      $$('.tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tool = btn.dataset.tool;

          if (tool === 'undo') {
            if (state.trackedPoints.length > 0) {
              state.trackedPoints.pop();
              renderEditingTrack();
              updatePointsUI();
            }
            return;
          }

          if (tool === 'clear') {
            if (confirm('¿Limpiar todos los puntos?')) {
              state.trackedPoints = [];
              state.detectedPois = [];
              updatePointsUI();
              renderDetectedPois();
              renderEditingTrack();
            }
            return;
          }

          if (tool === 'gps') {
            if (state.isTracking) stopTracking();
            else startTracking();
            return;
          }

          $$('.tool-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.activeTool = tool;
        });
      });

      // Radio de búsqueda
      $('#search-radius').addEventListener('input', (e) => {
        state.searchRadius = parseInt(e.target.value);
        $('#radius-value').textContent = `${state.searchRadius}m`;
      });

      // Buscar viaje
      $('#btn-search-trip').addEventListener('click', searchTrip);

      // Cerrar modal al hacer clic fuera
      $('#route-modal').addEventListener('click', (e) => {
        if (e.target === $('#route-modal')) closeModal();
      });

      // Funciones globales
      window.viewRoute = selectRoute;
      window.editRoute = (id) => openModal(id);
      window.deleteRoute = deleteRoute;
    }

    // =====================================================
    // INICIALIZACIÓN
    // =====================================================
    async function init() {
      console.log('Iniciando app...');

      await initDB();
      initMap();

      // Cargar rutas locales
      const localRoutes = await getRoutesFromLocal();
      if (localRoutes.length > 0) {
        state.routes = localRoutes;
        renderRoutesList();
        renderRoutesOnMap();
      }

      // Cargar POIs locales
      const localPois = await getPoisFromLocal();
      if (localPois.length > 0) {
        state.pois = localPois;
      }

      // Cargar desde Firebase si hay conexión
      if (state.isOnline) {
        const firebaseRoutes = await loadRoutesFromFirebase();

        const merged = [...firebaseRoutes];
        localRoutes.forEach(local => {
          if (!firebaseRoutes.find(f => f.id === local.id)) {
            merged.push(local);
          }
        });

        state.routes = merged;

        for (const route of merged) {
          await saveRouteToLocal(route);
        }

        renderRoutesList();
        renderRoutesOnMap();
      }

      setupEventListeners();
      updateConnectionStatus();

      window.addEventListener('online', () => {
        updateConnectionStatus();
        showToast('Conexión restaurada');
      });

      window.addEventListener('offline', () => {
        updateConnectionStatus();
        showToast('Sin conexión - Modo offline');
      });

      console.log('App lista');
    }

    init().catch(console.error);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('SW error:', err));
      });
    }
  </script>
</body>
</html>
