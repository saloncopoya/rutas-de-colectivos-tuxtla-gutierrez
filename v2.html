        content.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
            <h3>Ninguna ruta seleccionada</h3>
            <p>Selecciona una ruta en la pestaña Rutas para ver su información</p>
          </div>
        `;
        return;
      }

      const r = state.selectedRoute;
      const badgeClass = r.tipo === 'ida' ? 'badge-ida' : r.tipo === 'vuelta' ? 'badge-vuelta' : 'badge-circular';
      const badgeText = r.tipo === 'ida' ? 'IDA' : r.tipo === 'vuelta' ? 'VUELTA' : 'CIRCULAR';

      let html = `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${r.color || '#2563eb'};"></span>
          <h2 style="font-size:18px;font-weight:700;">${r.nombre}</h2>
          <span class="route-badge ${badgeClass}">${badgeText}</span>
        </div>
        ${r.descripcion ? `<p style="font-size:13px;color:var(--text-2);margin-bottom:12px;">${r.descripcion}</p>` : ''}
        <div class="info-grid">

          <div class="info-item"><div class="info-label">Frecuencia</div><div class="info-value">${r.frecuencia || 'N/A'}</div></div>
          <div class="info-item"><div class="info-label">Horario</div><div class="info-value">${r.horarioInicio || '05:00'} - ${r.horarioFin || '22:00'}</div></div>
          <div class="info-item"><div class="info-label">Días</div><div class="info-value" style="font-size:11px;">${r.dias || 'Todos los días'}</div></div>
          <div class="info-item"><div class="info-label">Accesibilidad</div><div class="info-value" style="font-size:11px;">${r.accesibilidad || 'No accesible'}</div></div>
          <div class="info-item"><div class="info-label">Empresa</div><div class="info-value" style="font-size:11px;">${r.empresa || 'N/A'}</div></div>
          <div class="info-item"><div class="info-label">Puntos</div><div class="info-value">${(r.puntos || []).length}</div></div>
          <div class="info-item"><div class="info-label">Calles</div><div class="info-value">${(r.streets || []).length}</div></div>
          <div class="info-item"><div class="info-label">POIs</div><div class="info-value">${(r.pois || []).length}</div></div>
        </div>
        ${r.notas ? `<div style="margin-bottom:12px;"><div class="info-label">Notas</div><p style="font-size:13px;color:var(--text-2);">${r.notas}</p></div>` : ''}
        ${r.imagen ? `<img src="${r.imagen}" style="width:100%;border-radius:var(--radius);margin-bottom:12px;" alt="Imagen de ruta">` : ''}
        <div style="display:flex;gap:6px;">
          <button class="btn btn-primary btn-sm" style="flex:1;" id="info-edit-btn">✏️ Editar</button>
          <button class="btn btn-secondary btn-sm" style="flex:1;" id="info-center-btn">🎯 Centrar</button>
        </div>
      `;

      content.innerHTML = html;

      content.querySelector('#info-edit-btn')?.addEventListener('click', () => editRoute(r.id));
      content.querySelector('#info-center-btn')?.addEventListener('click', () => {
        if (r.puntos?.length) {
          const bounds = L.latLngBounds(r.puntos.map(p => [p.lat, p.lng]));
          state.map.fitBounds(bounds, { padding: [50, 50] });
        }
      });
    }

    // ============================================================
    // SHEET RENDER
    // ============================================================

      body.innerHTML = html;

    function bindSheetEvents() {
      const body = document.getElementById('sheet-body');

      // Accordions
      body.querySelectorAll('.accordion-header').forEach(h => {
        h.addEventListener('click', () => {
          h.closest('.accordion').classList.toggle('open');
        });
      });

      // Color chips
      body.querySelectorAll('.color-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          body.querySelectorAll('.color-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          state.editColor = chip.dataset.color;
          if (state.editingRoute) state.editingRoute.color = state.editColor;
          if (state.editPolyline) state.editPolyline.setStyle({ color: state.editColor });
        });
      });

      // GPS
      body.querySelector('#btn-record-gps')?.addEventListener('click', () => {
        if (state.isRecording) stopGpsRecording();
        else startGpsRecording();
      });

      body.querySelector('#btn-clear-points')?.addEventListener('click', () => {
        if (confirm('¿Limpiar todos los puntos, calles y POIs?')) {
          state.editPoints = [];
          state.editStreets = [];
          state.editPois = [];
          drawEditRoute();
          drawEditPois();
          renderSheet();
          toast('Puntos limpiados');
        }
      });

      // Detect streets
      body.querySelector('#btn-detect-streets-sheet')?.addEventListener('click', detectStreets);

      body.querySelector('#btn-reverse-streets')?.addEventListener('click', () => {
        state.editStreets.reverse();
        state.editStreets.forEach((s, i) => s.orden = i + 1);
        renderSheet();
        toast('Calles invertidas');
      });

      // POIs
      body.querySelector('#btn-add-poi')?.addEventListener('click', () => {
        const nombre = prompt('Nombre del punto de interés:');
        if (nombre) {
          const desc = prompt('Descripción (opcional):') || '';
          state.editPois.push({
            id: 'poi_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            lat: state.map.getCenter().lat,
            lng: state.map.getCenter().lng,
            nombre,
            tipo: 'custom',
            icono: '📍',
            descripcion: desc
          });
          drawEditPois();
          renderSheet();
        }
      });

      body.querySelector('#btn-detect-businesses')?.addEventListener('click', detectBusinesses);

      // Image
      const uploadZone = body.querySelector('#image-upload');
      const fileInput = body.querySelector('#image-input');
      uploadZone?.addEventListener('click', () => fileInput.click());
      fileInput?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const preview = body.querySelector('#image-preview');
          preview.innerHTML = `<img src="${ev.target.result}" alt="Preview"><button class="remove-img" id="remove-img">✕</button>`;
          preview.classList.add('show');
          preview.dataset.dataUrl = ev.target.result;
          preview.dataset.fileName = file.name;
          bindRemoveImg();
        };
        reader.readAsDataURL(file);
      });

      function bindRemoveImg() {
        body.querySelector('#remove-img')?.addEventListener('click', () => {
          const preview = body.querySelector('#image-preview');
          preview.classList.remove('show');
          preview.innerHTML = '';
          preview.dataset.dataUrl = '';
          if (state.editingRoute) state.editingRoute.imagen = '';
        });
      }
      bindRemoveImg();
    }

    // ============================================================
    // SHEET OPEN/CLOSE
    // ============================================================
    function openSheet() {
      document.getElementById('sheet').classList.add('show');
      document.getElementById('sheet-overlay').classList.add('show');
      document.getElementById('edit-toolbar').classList.add('show');
      document.getElementById('fab').style.display = 'none';
    }

    function closeSheet() {
      document.getElementById('sheet').classList.remove('show');
      document.getElementById('sheet-overlay').classList.remove('show');
      document.getElementById('edit-toolbar').classList.remove('show');
      document.getElementById('fab').style.display = '';
      stopGpsRecording();
      state.isEditing = false;
    }

    function newRoute() {
      state.editingRoute = {
        id: 'ruta_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        nombre: '',
        descripcion: '',
        tipo: 'ida',
        empresa: '',
        color: '#2563eb',
        tarifa: '',
        frecuencia: '',
        horarioInicio: '05:00',
        horarioFin: '22:00',
        dias: 'todos',
        accesibilidad: 'no',
        notas: '',
        puntos: [],
        streets: [],
        pois: [],
        imagen: '',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      state.editPoints = [];
      state.editStreets = [];
      state.editPois = [];
      state.editColor = '#2563eb';
      state.isEditing = true;
      state.editTool = 'draw';
      drawEditRoute();
      drawEditPois();
      renderSheet();
      openSheet();
      document.querySelectorAll('#edit-toolbar .btn-pill[data-tool]').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === 'draw');
      });
    }

    function editRoute(id) {
      const route = state.routes.find(r => r.id === id);
      if (!route) return;
      state.editingRoute = JSON.parse(JSON.stringify(route));
      state.editPoints = JSON.parse(JSON.stringify(route.puntos || []));
      state.editStreets = JSON.parse(JSON.stringify(route.streets || []));
      state.editPois = JSON.parse(JSON.stringify(route.pois || []));
      state.editColor = route.color || '#2563eb';
      state.isEditing = true;
      state.editTool = 'draw';
      drawEditRoute();
      drawEditPois();
      renderSheet();
      openSheet();
      if (state.editPoints.length > 0) {
        const bounds = L.latLngBounds(state.editPoints.map(p => [p.lat, p.lng]));
        state.map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    async function deleteRouteConfirm(id) {
      const route = state.routes.find(r => r.id === id);
      if (!route) return;
      if (!confirm(`¿Eliminar la ruta "${route.nombre}"?`)) return;
      await deleteRoute(id);
      await deleteRouteFromFirebase(id);
      state.routes = state.routes.filter(r => r.id !== id);
      if (state.selectedRoute?.id === id) state.selectedRoute = null;
      renderRoutesOnMap();
      renderPanel();
      toast('Ruta eliminada');
    }

    async function saveCurrentRoute() {
      const body = document.getElementById('sheet-body');
      const nombre = body.querySelector('#f-nombre')?.value.trim();
      if (!nombre) { toast('El nombre es obligatorio'); return; }
      if (state.editPoints.length < 2) { toast('Agrega al menos 2 puntos a la ruta'); return; }

      const route = {
        ...state.editingRoute,
        nombre,
        descripcion: body.querySelector('#f-descripcion')?.value.trim() || '',
        tipo: body.querySelector('#f-tipo')?.value || 'ida',
        empresa: body.querySelector('#f-empresa')?.value.trim() || '',
        color: state.editColor,
        tarifa: body.querySelector('#f-tarifa')?.value.trim() || '',
        frecuencia: body.querySelector('#f-frecuencia')?.value.trim() || '',
        horarioInicio: body.querySelector('#f-horario-inicio')?.value || '05:00',
        horarioFin: body.querySelector('#f-horario-fin')?.value || '22:00',
        dias: body.querySelector('#f-dias')?.value || 'todos',
        accesibilidad: body.querySelector('#f-accesibilidad')?.value || 'no',
        notas: body.querySelector('#f-notas')?.value.trim() || '',
        puntos: state.editPoints,
        streets: state.editStreets,
        pois: state.editPois,
        updatedAt: Date.now()
      };

      // Image upload
      const preview = body.querySelector('#image-preview');
      const dataUrl = preview?.dataset?.dataUrl;
      const fileName = preview?.dataset?.fileName;
      if (dataUrl && fileName) {
        try {
          toast('Subiendo imagen...');
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], fileName, { type: blob.type });
          route.imagen = await uploadToCloudinary(file);
        } catch {
          toast('Error al subir imagen, se guardará localmente');
          route.imagen = dataUrl;
        }
      } else if (state.editingRoute?.imagen) {
        route.imagen = state.editingRoute.imagen;
      }

      await saveRoute(route);

      // Update in-memory
      const idx = state.routes.findIndex(r => r.id === route.id);
      if (idx >= 0) state.routes[idx] = route;
      else state.routes.push(route);

      // Firebase sync
      if (navigator.onLine) {
        const ok = await syncRouteToFirebase(route);
        toast(ok ? 'Ruta guardada y sincronizada' : 'Guardado local (pendiente sync)');
      } else {
        toast('Ruta guardada offline');
      }

      state.selectedRoute = route;
      state.routesGridMode = 'selected';
      renderRoutesOnMap();
      renderPanel();
      closeSheet();

      if (route.puntos?.length) {
        const bounds = L.latLngBounds(route.puntos.map(p => [p.lat, p.lng]));
        state.map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    // ============================================================
    // GLOBAL HELPERS (exposed to window)
    // ============================================================
    window.removeSearchPoint = (i) => {
      state.searchPoints.splice(i, 1);
      state.searchPoints.forEach((p, idx) => { p.letter = ['A','B','C'][idx]; p.color = { A:'#16a34a', B:'#dc2626', C:'#f59e0b' }[p.letter]; });
      state.searchMarkers.forEach(m => state.map.removeLayer(m));
      state.searchMarkers = [];
      state.searchCircles.forEach(c => state.map.removeLayer(c));
      state.searchCircles = [];
      state.searchPoints.forEach(p => addSearchPointMarker(p));
      updateSearchRadiusCircles();
      renderPanel();
    };

    window.editStreet = (i) => {
      const s = state.editStreets[i];
      const nuevo = prompt('Nombre de la calle:', s.nombre);
      if (nuevo) {
        s.nombre = nuevo;
        renderSheet();
      }
    };

    window.removeStreet = (i) => {
      state.editStreets.splice(i, 1);
      renderSheet();
    };

    window.removePoi = (i) => {
      state.editPois.splice(i, 1);
      drawEditPois();
      renderSheet();
    };

    window.viewRoute = (id) => selectRoute(id);
    window.editRoute = editRoute;
    window.deleteRoute = deleteRouteConfirm;

    function addMyLocationAsPoint() {
      if (!navigator.geolocation) { toast('GPS no disponible'); return; }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        const letter = ['A', 'B', 'C'][state.searchPoints.length] || 'A';
        const color = { A: '#16a34a', B: '#dc2626', C: '#f59e0b' }[letter];
        const geo = await reverseGeocode(latitude, longitude);
        const street = extractStreetName(geo?.address) || 'Mi ubicación';
        const point = { lat: latitude, lng: longitude, letter, color, street };
        state.searchPoints.push(point);
        addSearchPointMarker(point);
        updateSearchRadiusCircles();
        renderPanel();
        state.map.setView([latitude, longitude], 16);
      }, () => toast('No se pudo obtener ubicación'));
    }

    function centerOnMyLocation() {
      if (!navigator.geolocation) { toast('GPS no disponible'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => state.map.setView([pos.coords.latitude, pos.coords.longitude], 16),
        () => toast('No se pudo obtener ubicación')
      );
    }

    // ============================================================
    // DRIVER MODE
    // ============================================================
    function openDriverPanel() {
      document.getElementById('driver-panel').classList.add('show');
      const select = document.getElementById('driver-route');
      select.innerHTML = '<option value="">Seleccionar ruta...</option>' +
        state.routes.map(r => `<option value="${r.id}">${r.nombre}</option>`).join('');
    }

    function closeDriverPanel() {
      document.getElementById('driver-panel').classList.remove('show');
    }

    function startDriverBroadcast() {
      const name = document.getElementById('driver-name').value.trim();
      const routeId = document.getElementById('driver-route').value;
      const unit = document.getElementById('driver-unit').value.trim();
      const routeNum = document.getElementById('driver-route-num').value.trim();

      if (!name || !routeId || !unit) {
        toast('Completa todos los campos requeridos');
        return;
      }

      const route = state.routes.find(r => r.id === routeId);
      if (!route) { toast('Ruta no encontrada'); return; }

      state.driverInfo = {
        nombre: name,
        routeId,
        routeName: route.nombre,
        unit,
        routeNum: routeNum || route.nombre,
        color: route.color || '#2563eb'
      };

      if (!navigator.geolocation) { toast('GPS no disponible'); return; }

      // Start watching
      state.driverWatchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          const info = state.driverInfo;
          const routeObj = state.routes.find(r => r.id === info.routeId);
          if (routeObj?.puntos?.length >= 2) {
            const coords = routeObj.puntos.map(p => [p.lat, p.lng]);
            const dist = pointToLineDistance(latitude, longitude, coords);
            if (dist > 80) {
              // Outside route, don't broadcast
              return;
            }
          }
          await syncDriverLocation(info, latitude, longitude);
        },
        (err) => console.error(err),
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
      );

      // Update UI
      document.getElementById('driver-start').style.display = 'none';
      document.getElementById('driver-stop').style.display = 'block';
      const status = document.getElementById('driver-status');
      status.className = 'driver-status-badge active';
      status.innerHTML = '<span>🟢</span> Transmitiendo';

      // Poll drivers periodically
      if (state.driverInterval) clearInterval(state.driverInterval);
      state.driverInterval = setInterval(refreshDriverMarkers, 10000);
      refreshDriverMarkers();

      toast('Transmisión iniciada. Tu ubicación se muestra en el mapa.');
    }

    function stopDriverBroadcast() {
      if (state.driverWatchId !== null) {
        navigator.geolocation.clearWatch(state.driverWatchId);
        state.driverWatchId = null;
      }
      if (state.driverInterval) {
        clearInterval(state.driverInterval);
        state.driverInterval = null;
      }
      if (state.driverInfo) {
        clearDriverLocation(state.driverInfo);
      }
      state.driverInfo = null;

      document.getElementById('driver-start').style.display = 'block';
      document.getElementById('driver-stop').style.display = 'none';
      const status = document.getElementById('driver-status');
      status.className = 'driver-status-badge inactive';
      status.innerHTML = '<span>⚪</span> Desconectado';

      clearDriverMarkers();
      toast('Transmisión detenida');
    }

    let driverMarkers = [];
    function clearDriverMarkers() {
      driverMarkers.forEach(m => state.map.removeLayer(m));
      driverMarkers = [];
    }

    async function refreshDriverMarkers() {
      if (!navigator.onLine) return;
      const drivers = await loadDrivers();
      clearDriverMarkers();

      Object.entries(drivers).forEach(([key, d]) => {
        // Only show if the user is viewing this route or all routes
        const route = state.routes.find(r => r.id === d.routeId);
        if (!route) return;
        const show = state.routesGridMode === 'all' ||
                     (state.routesGridMode === 'selected' && state.selectedRoute?.id === d.routeId);
        if (!show) return;

        const icon = L.divIcon({
          className: 'driver-marker',
          html: `<div style="background:${d.color || '#2563eb'};color:#fff;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);">🚐 ${d.unit} - ${d.nombre}</div>`,
          iconSize: [120, 24],
          iconAnchor: [60, 12]
        });
        const marker = L.marker([d.lat, d.lng], { icon }).addTo(state.map);
        marker.bindPopup(`<b>${d.nombre}</b><br>Unidad: ${d.unit}<br>Ruta: ${d.routeName}<br>Actualizado: ${new Date(d.timestamp).toLocaleTimeString()}`);
        driverMarkers.push(marker);
      });
    }

    // ============================================================
    // ONLINE/OFFLINE
    // ============================================================
    function updateConnectionStatus() {
      const online = navigator.onLine;
      document.getElementById('status-dot').className = 'status-dot' + (online ? '' : ' offline');
      document.getElementById('status-text').textContent = online ? 'Online' : 'Offline';
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    function setupEvents() {
      // Connection
      window.addEventListener('online', () => { updateConnectionStatus(); toast('Conexión restaurada'); refreshDriverMarkers(); });
      window.addEventListener('offline', () => { updateConnectionStatus(); toast('Sin conexión. Modo offline.'); });

      // FAB
      document.getElementById('fab')?.addEventListener('click', newRoute);

      // Sheet
      document.getElementById('sheet-close')?.addEventListener('click', closeSheet);
      document.getElementById('sheet-minimize')?.addEventListener('click', closeSheet);
      document.getElementById('sheet-overlay')?.addEventListener('click', closeSheet);
      document.getElementById('btn-cancel')?.addEventListener('click', closeSheet);
      document.getElementById('btn-save')?.addEventListener('click', saveCurrentRoute);

      // Sheet drag
      setupSheetDrag();

      // Edit toolbar
      document.querySelectorAll('#edit-toolbar .btn-pill[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#edit-toolbar .btn-pill[data-tool]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.editTool = btn.dataset.tool;
          if (state.editTool === 'gps') {
            if (!state.isRecording) startGpsRecording();
          } else {
            if (state.isRecording) stopGpsRecording();
          }
        });
      });

      document.getElementById('btn-undo')?.addEventListener('click', () => {
        if (state.editPoints.length > 0) {
          state.editPoints.pop();
          drawEditRoute();
          renderSheet();
          toast('Último punto eliminado');
        }
      });

      document.getElementById('btn-clear')?.addEventListener('click', () => {
        if (confirm('¿Limpiar todos los puntos, calles y POIs?')) {
          state.editPoints = [];
          state.editStreets = [];
          state.editPois = [];
          drawEditRoute();
          drawEditPois();
          renderSheet();
          toast('Todo limpiado');
        }
      });

      document.getElementById('btn-detect-streets')?.addEventListener('click', detectStreets);

      // Recording
      document.getElementById('btn-stop-recording')?.addEventListener('click', stopGpsRecording);

      // Panel tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.activeTab = btn.dataset.tab;
          renderPanel();
        });
      });

      // Panel handle
      setupPanelDrag();

      // Map search
      const searchInput = document.getElementById('map-search-input');
      const searchResults = document.getElementById('search-results');
      let searchTimeout;

      searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const q = e.target.value.trim();
        if (q.length < 3) { searchResults.classList.remove('show'); return; }
        searchTimeout = setTimeout(async () => {
          // Search routes
          const routeMatches = state.routes.filter(r =>
            (r.nombre || '').toLowerCase().includes(q.toLowerCase())
          ).slice(0, 4);
          // Search POIs
          const poiMatches = [];
          state.routes.forEach(r => {
            (r.pois || []).forEach(p => {
              if ((p.nombre || '').toLowerCase().includes(q.toLowerCase())) {
                poiMatches.push({ ...p, routeName: r.nombre });
              }
            });
          });
          const poiResults = poiMatches.slice(0, 4);

          // Nominatim search
          const nomiResults = await searchNominatim(q + ', Tuxtla Gutiérrez, Chiapas, México');

          let html = '';
          if (routeMatches.length > 0) {
            html += routeMatches.map(r => `
              <div class="sr-item" data-type="route" data-id="${r.id}">
                <span class="sr-icon">🚌</span>
                <span><b>${r.nombre}</b><br><small>${r.descripcion || ''}</small></span>
              </div>
            `).join('');
          }
          if (poiResults.length > 0) {
            html += poiResults.map(p => `
              <div class="sr-item" data-type="poi" data-lat="${p.lat}" data-lng="${p.lng}" data-route-id="${p.routeId}">
                <span class="sr-icon">${p.icono || '🏪'}</span>
                <span><b>${p.nombre}</b><br><small>${p.routeName}</small></span>
              </div>
            `).join('');
          }
          if (nomiResults.length > 0) {
            html += nomiResults.map(r => `
              <div class="sr-item" data-type="place" data-lat="${r.lat}" data-lng="${r.lon}" data-bbox="${r.boundingbox?.join(',') || ''}">
                <span class="sr-icon">📍</span>
                <span>${r.display_name}</span>
              </div>
            `).join('');
          }
          if (!html) {
            html = '<div class="sr-item" style="color:var(--text-3);">No encontrado</div>';
          }
          searchResults.innerHTML = html;
          searchResults.classList.add('show');

          // Bind result clicks
          searchResults.querySelectorAll('.sr-item').forEach(item => {
            item.addEventListener('click', () => {
              const type = item.dataset.type;
              if (type === 'route') {
                selectRoute(item.dataset.id);
                searchInput.value = '';
                searchResults.classList.remove('show');
              } else if (type === 'poi') {
                selectRoute(item.dataset.routeId);
                state.map.setView([parseFloat(item.dataset.lat), parseFloat(item.dataset.lng)], 17);
                searchInput.value = '';
                searchResults.classList.remove('show');
              } else if (type === 'place') {
                const lat = parseFloat(item.dataset.lat);
                const lng = parseFloat(item.dataset.lng);
                const bbox = item.dataset.bbox;
                if (bbox) {
                  const [s, n, w, e] = bbox.split(',').map(Number);
                  state.map.fitBounds([[s, w], [n, e]]);
                } else {
                  state.map.setView([lat, lng], 16);
                }
                searchInput.value = '';
                searchResults.classList.remove('show');
              }
            });
          });
        }, 400);
      });

      document.getElementById('map-search-btn')?.addEventListener('click', () => {
        searchInput?.dispatchEvent(new Event('input'));
      });

      // Map controls toggle
      document.getElementById('map-controls-toggle')?.addEventListener('click', toggleMapControls);

      // Driver
      document.getElementById('driver-toggle-btn')?.addEventListener('click', openDriverPanel);
      document.getElementById('driver-close')?.addEventListener('click', closeDriverPanel);
      document.getElementById('driver-start')?.addEventListener('click', startDriverBroadcast);
      document.getElementById('driver-stop')?.addEventListener('click', stopDriverBroadcast);
    }

    // ============================================================
    // SHEET DRAG
    // ============================================================
    function setupSheetDrag() {
      const sheet = document.getElementById('sheet');
      const handle = document.getElementById('sheet-drag-handle');
      let startY = 0, currentY = 0, dragging = false;

      const onStart = (e) => {
        dragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        sheet.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        currentY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
        if (currentY > 0) {
          sheet.style.transform = `translateY(${currentY}px)`;
        }
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        sheet.style.transition = '';
        sheet.style.transform = '';
        if (currentY > 120) closeSheet();
        currentY = 0;
      };

      handle?.addEventListener('touchstart', onStart, { passive: true });
      handle?.addEventListener('mousedown', onStart);
      document.addEventListener('touchmove', onMove, { passive: true });
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchend', onEnd);
      document.addEventListener('mouseup', onEnd);
    }

    // ============================================================
    // PANEL DRAG
    // ============================================================
    function setupPanelDrag() {
      const panel = document.getElementById('panel');
      const handle = document.getElementById('panel-handle');
      let startY = 0, currentY = 0, dragging = false;

      const onStart = (e) => {
        dragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        panel.style.transition = 'none';
      };
      const onMove = (e) => {
        if (!dragging) return;
        currentY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        panel.style.transition = '';
        if (currentY > 60) {
          panel.classList.add('collapsed');
          document.body.classList.add('panel-collapsed');
        } else if (currentY < -60) {
          panel.classList.remove('collapsed');
          panel.classList.add('full');
          document.body.classList.remove('panel-collapsed');
        }
        currentY = 0;
      };

      handle?.addEventListener('touchstart', onStart, { passive: true });
      handle?.addEventListener('mousedown', onStart);
      document.addEventListener('touchmove', onMove, { passive: true });
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchend', onEnd);
      document.addEventListener('mouseup', onEnd);

      // Click to toggle
      handle?.addEventListener('click', () => {
        if (panel.classList.contains('collapsed')) {
          panel.classList.remove('collapsed');
          document.body.classList.remove('panel-collapsed');
        } else if (panel.classList.contains('full')) {
          panel.classList.remove('full');
        } else {
          panel.classList.add('collapsed');
          document.body.classList.add('panel-collapsed');
        }
      });
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      try {
        await initDB();
        initMap();
        setupEvents();
        updateConnectionStatus();

        // Load local routes
        state.routes = await getRoutes();
        state.pois = await getPois();

        // Load from Firebase
        if (navigator.onLine) {
          const remote = await loadRoutesFromFirebase();
          const localIds = new Set(state.routes.map(r => r.id));
          for (const r of remote) {
            if (!localIds.has(r.id)) {
              state.routes.push(r);
              await saveRoute(r);
            } else {
              // Firebase has priority
              const idx = state.routes.findIndex(lr => lr.id === r.id);
              state.routes[idx] = r;
              await saveRoute(r);
            }
          }
        }

        // Default: hidden
        state.routesGridMode = 'hidden';

        // Render
        renderPanel();
        renderRoutesOnMap();

        // Refresh driver markers periodically
        if (state.driverInterval) clearInterval(state.driverInterval);
        state.driverInterval = setInterval(() => {
          if (!state.driverInfo && navigator.onLine) refreshDriverMarkers();
        }, 15000);

        // Open panel
        setTimeout(() => {
          document.getElementById('panel').classList.remove('collapsed');
        }, 100);

        toast('Rutas Tuxtla Gutiérrez lista');
      } catch (err) {
        console.error('Init error:', err);
        toast('Error al inicializar la aplicación');
      }
    }

    init();
  </script>
</body>
